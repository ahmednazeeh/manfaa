openapi: 3.1.0

# ---------------------------------------------------------------------------
# Manfaa Vendor API — Phase 2 design artefact (PLAN §9).
#
# Written BEFORE the implementation. This document is the contract POS
# vendors code against on day one and never revisit; the implementation
# conforms to it, not the other way round.
#
# Reconciled against internal conventions already shipped in Phases 0–1:
#   - money is an integer count of laari and rates are integer basis points
#     INTERNALLY, with no floats anywhere (PLAN §4); on the WIRE a rate is a
#     2-decimal percent string ("2.00"), and basis points never appear in a
#     request or response (PLAN §1, decision 2026-08-15);
#   - resources expose the raw laari integers plus pre-formatted MVR strings
#     (e.g. cashback_laari: 2000 alongside cashback_mvr: "20.00");
#   - timestamps are ISO 8601, stored UTC, business rules evaluated in UTC+5
#     (PLAN §13); an offsetless occurred_at is read as Maldives time;
#   - every state change flows through the transaction state machine (§6);
#     the states named here are exactly the internal states.
# ---------------------------------------------------------------------------

info:
  title: Manfaa Vendor API
  version: 1.0.0
  summary: Vendor-facing cashback ingestion API for POS systems and web merchants.
  description: |
    Maldives-wide cashback marketplace. POS systems and web merchants **POST**
    sales to this API; the platform computes cashback, runs the settlement
    clock, and pays customers. There is no polling contract — on-prem tills
    sit behind NAT, so all integration traffic is inbound to us, plus signed
    outbound webhooks (see the *Webhooks* section) so tills never cache stale
    offers.

    ## Money

    - Every amount is an **integer count of laari** (1/100 MVR). Field names
      carry the unit: `eligible_amount`, `cashback_laari`. JSON numbers with a
      fractional part are rejected with `validation_failed` — never send
      floats.
    - Every rate is a **2-decimal percent string**: 2% is `"2.00"`, the
      platform fee `"0.75"`. Basis points are the platform's internal
      representation and **never appear in a request or a response** —
      there is no `rate_bp` or `fee_bp` field on this API. Requests accept
      a rate as a string (`"2"`, `"2.5"`, `"2.50"`) or as a JSON number
      (`2`, `2.5`), with at most two decimals; more precision is
      `validation_failed`.
    - Cashback and fee round **up** to the next whole laari per line
      (`ceil(eligible × rate / 100)`, computed internally in basis points as
      `ceil(eligible × bp / 10000)`), customer-favourable, so any nonzero
      eligible amount yields at least 1 laari.
    - Responses carry both the integer (`cashback_laari`) and a
      pre-formatted string (`cashback_mvr`, e.g. `"4,300.25"`) for receipt
      and till display. The integer is the value; the string is presentation.
    - `currency` is `MVR` only in v1.

    ## Eligible amount

    `eligible_amount` is **the merchant's own figure and is taken at face
    value** — how it is derived (tax, service charge, excluded categories) is
    the merchant's policy, defined in their agreement, never recomputed or
    second-guessed by the API. `sale_amount` is optional, reference-only, and
    never used in any computation.

    ## Rates

    The rate applied is the merchant's rate **effective at `occurred_at`**,
    frozen onto the transaction. The till's displayed rate is advisory; the
    server recomputes authoritatively. Rate *decreases* take effect only at
    00:00 (UTC+5) the next day, so a stale till cache can only
    under-promise, never over-promise.

    A sale may carry an optional **per-sale override**,
    `cashback_rate_percent` on `POST /v1/transactions`, which prices that
    one sale (a staff discount day, a goodwill boost). It may only RAISE
    the rate the sale would otherwise earn — below the standing rate, or
    below a live promotion covering the sale, is refused
    `rate_below_advertised`, because the advertised rate is a promise to
    the customer. A rate the platform's fee schedule cannot price is
    refused `rate_not_priced`. The override never changes the merchant's
    standing rate: it applies to that sale and nothing else.

    Because it only raises, an override **equal** to the rate the sale
    already earns prices exactly as if the field were absent — so echoing
    `active_promotion.cashback_rate_percent` back into a sale leaves the
    promotion in charge of it, per-customer cap included. Only a value
    strictly above the advertised rate replaces it, and such a sale is
    priced by that number alone: no promotion is stamped on it and it
    consumes no promotional headroom.

    ## Idempotency

    Every write requires an `Idempotency-Key` header (a missing header is
    `422 idempotency_key_required`). Keys are scoped to the merchant
    credential. A repeated key with an identical request body replays the
    original result with HTTP `200` and the response header
    `Idempotency-Replay: true`. A repeated key with a **different** body is
    rejected `422 idempotency_key_reuse_mismatch`. Independently,
    `(merchant, invoice_no)` is unique — the same sale arriving as two
    *distinct* requests (different keys) is rejected `409 duplicate_invoice`.

    Use a fresh UUID v4 per logical write. Replays for transaction creation
    are permanent (backed by the stored row); replays for reversals are
    guaranteed for at least 7 days after first use.

    **Retry rule:** on a network failure, timeout, or any `5xx`, retry with
    the **same** `Idempotency-Key`. Every documented `4xx` is terminal — fix
    the request or stop; do not blind-retry. Transient coordination codes
    (e.g. `409 idempotency_key_in_flight`, returned while a concurrent
    request holding the same key is still processing) are deliberately not
    in the registry and follow the same rule: not listed means retry with
    the same key.

    ## Timestamps

    `occurred_at` is **optional — omit it and the sale is recorded as of
    now**. When you do send it, two shapes are accepted:

    - ISO 8601 **with an explicit offset**: `2026-08-14T11:04:22+05:00`,
      `2026-08-14T06:04:22Z`, `2026-08-14T11:04:22+0500`. Read as sent.
    - A plain wall clock with **no offset**: `2026-08-14 11:04:22` or
      `2026-08-14T11:04:22`, read as **Maldives time (UTC+5)** — so it
      means the instant `2026-08-14T06:04:22Z`. This used to be refused,
      because reading it as UTC would misdate the sale by five hours and
      freeze the wrong rate; reading it as Maldives time answers the same
      objection honestly, and it is what a till writing its own local clock
      means every time.

    Anything else is `validation_failed`. Future-dated sales (beyond a
    5-minute clock-skew allowance) are rejected `future_dated`. Sales older than the
    merchant's validation window plus 3 days are **backdated**: accepted,
    but they skip the refund window entirely and become payable
    IMMEDIATELY — `state: payable_unfunded`, `reason_code: backdated_final`,
    `backdated: true`, with the 15-day settlement clock starting at the
    moment of the POST, not at `occurred_at`. A backdated sale can **never
    be reversed through this API** (`409 backdated_irreversible`); a
    correction is an admin adjustment. Send today's sales today.
    All response timestamps are ISO 8601 UTC.

    ## Errors

    Every error response is the envelope `{"error": {"code", "message"}}`,
    with three exceptions raised by the platform edge before the vendor API
    proper: a missing/invalid/revoked token is `401`
    `{"message": "Unauthenticated."}`, a valid token lacking the required
    ability is `403` `{"message": "Invalid ability provided."}`, and
    exceeding the rate limit (120 requests/minute per token) is `429`
    `{"message": "Too Many Attempts."}` with a `Retry-After` header.
    Everywhere else `code` is a stable machine code — the registry,
    including the non-error reason codes that appear in `200` bodies, is
    documented at
    [`#/components/schemas/MachineCode`](#/components/schemas/MachineCode).
    `message` is human-readable and may change; never match on it.

    ## Sandbox

    A full sandbox environment (see `servers`) provides fixture merchants,
    test credentials, and published test customer refs, so no vendor ever
    debugs against production or mints real cashback doing it. Sandbox
    tokens are issued alongside production credentials at onboarding; the
    fixture data set is published in the vendor integration guide.
  contact:
    name: Manfaa integrations
    email: integrations@manfaa.app

servers:
  - url: https://api.manfaa.app/api
    description: Production. (Domain is the PLAN §14 placeholder until the production domain is confirmed.)
  - url: https://api.manfaa.app/api
    description: Sandbox — fixture merchants and test customer refs (PLAN §9.5). No real cashback is ever created here.

security:
  - vendorToken: []

tags:
  - name: Transactions
    description: Recording sales and sending reversals. Sending reversals for refunded or voided sales is a contractual obligation under the vendor integration agreement, not best-effort.
  - name: Merchant
    description: Merchant configuration reads for the till.
  - name: Customers
    description: Customer confirmation at the point of sale.

paths:

  /v1/transactions:
    post:
      operationId: createTransaction
      tags: [Transactions]
      summary: Record a sale and accrue cashback
      x-required-ability: transactions:write
      description: |
        Records a sale for the authenticated merchant and accrues cashback at
        the rate effective at `occurred_at`. The transaction enters the
        merchant's validation (refund) window; the 15-day settlement clock
        starts when that window closes.

        This endpoint **never rejects a well-formed sale for business
        reasons** — below-minimum sales and sales from suspended merchants
        are accepted and recorded with `cashback_laari: 0`, a reason code,
        and a distinct `200` body, so the cashier always sees something
        truthful. Only malformed requests, duplicates, and auth failures are
        errors.

        The single exception is an **unusable `cashback_rate_percent`
        override on a sale that would earn cashback**: a rate below the one
        the sale would otherwise earn (`422 rate_below_advertised`) or one
        the platform cannot price (`422 rate_not_priced`). Those are refused
        rather than quietly ignored — the till asked for terms we will not
        honour, and printing a different number on the customer's receipt
        would be worse than an error. Omit the field and the sale prices
        exactly as it always has. On a sale that earns nothing either way
        (suspended merchant, below minimum) the field is ignored rather than
        refused, and the sale is recorded with its `200` body as usual.

        | HTTP | Meaning |
        |---|---|
        | `201` | Created — cashback accrued (or held for review if stale). |
        | `200` + `Idempotency-Replay: true` | Replay of the original result for this `Idempotency-Key`. |
        | `200` `status: recorded_ineligible` | Merchant is suspended; sale recorded, **no cashback**. |
        | `200` `status: below_minimum` | Below the merchant's minimum eligible amount; recorded, **no cashback**. |
        | `409` | `duplicate_invoice`. |
        | `422` | Validation failure — including a malformed or future-dated `occurred_at`, unknown `customer_ref`, an unusable `cashback_rate_percent` override on an accruing sale, missing or mismatched `Idempotency-Key`. |

        A merchant account that is **not trading** is refused
        `403 forbidden_ability` in the error envelope, with the message
        *"This merchant account is not active on the platform."* That covers
        every status except `active` and `suspended`: a **closed** account,
        and one that has not completed onboarding (a self-signed-up store
        still in setup, awaiting review, or sent back). **Suspended is NOT
        one of them** — a suspended merchant's sales are still accepted, as
        `200 recorded_ineligible` above. The credential should already be
        revoked in the refused cases; stop sending and contact the platform.
        Retrying cannot help until the account is reinstated.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionCreateRequest'
            examples:
              simplest:
                summary: Simplest
                description: |
                  Everything a till is required to send: who to credit, the
                  invoice number, and the merchant's own eligible total in
                  laari. `occurred_at` is omitted, so the sale is recorded
                  **now** — the response echoes `occurred_at` equal to
                  `received_at` — and prices at the rate effective at that
                  instant.

                  Hand-derived against the §4 law
                  (`intdiv(laari × bp + 9999, 10000)` — every fractional
                  laari rounds UP) at this store's standing 2.00%:

                  - cashback = ceil(118,000 × 200 ÷ 10,000) = **2,360
                    laari** = MVR 23.60
                  - 2.00% sits in the 2.00%–4.99% band, whose platform fee
                    is 0.75%, so fee = ceil(118,000 × 75 ÷ 10,000) = **885
                    laari** = MVR 8.85
                  - the merchant owes 2,360 + 885 = **3,245 laari** (MVR
                    32.45) when this sale settles

                  See the `created` response example — these are its exact
                  integers.
                value:
                  invoice_no: INV-1001
                  customer_ref: '482917'
                  eligible_amount: 118000
              saleTotalAndWallClock:
                summary: With sale total and wall-clock time
                description: |
                  The same sale with the two optional reference fields a
                  real till usually has to hand.

                  `sale_amount` is the FULL bill (MVR 625.00); the merchant
                  found MVR 500.33 of it eligible under their own policy,
                  which the platform never recomputes or second-guesses. It
                  enters no computation — it is kept for dispute answers
                  and the eligible-ratio monitoring of §11 (here
                  50,033 ÷ 62,500 = 80.05%).

                  `occurred_at` carries no offset, so it is read as
                  **Maldives time (UTC+5)**: `2026-08-15 11:09:00` is the
                  instant `2026-08-15T06:09:00Z`, which is what the
                  response echoes. A till that writes its own local clock
                  needs no timezone maths.

                  Hand-derived at the standing 2.00% — note the ceiling
                  rounding on both figures, which an even amount hides:

                  - cashback = ceil(50,033 × 200 ÷ 10,000) = ceil(1,000.66)
                    = **1,001 laari** = MVR 10.01
                  - fee = ceil(50,033 × 75 ÷ 10,000) = ceil(375.2475) =
                    **376 laari** = MVR 3.76

                  The response is the `created` shape with
                  `sale_laari: 62500` and
                  `occurred_at: "2026-08-15T06:09:00+00:00"`.

                  A till standing at one branch adds the third optional
                  field, `branch_id`, from the ids issued at onboarding. It
                  scopes reporting and lets branch-scoped promotions apply;
                  it changes none of the arithmetic above.
                value:
                  invoice_no: INV-1007
                  customer_ref: '482917'
                  eligible_amount: 50033
                  sale_amount: 62500
                  occurred_at: '2026-08-15 11:09:00'
              mixedBasket:
                summary: Mixed basket with line items
                description: |
                  A store with a product-category rate card. The three
                  lines sum to exactly `eligible_amount`
                  (30,000 + 25,000 + 45,000 = 100,000) — one excluded
                  category, one category with its own rate, and the
                  `category: null` bucket for everything else.

                  Pricing is per line at §4 ceiling rounding, then summed;
                  the transaction totals are the SUM of the stored line
                  integers, never a recomputation on the aggregate. This
                  store (the same one the integration guide works through)
                  stands at 5.00%, prices `veggies` at its own 2.00%, and
                  excludes `fruits` — and each line's platform fee follows
                  that line's own rate into its §4 band:

                  - fruits, excluded → **0** cashback, **0** fee, whatever
                    the rest of the basket does
                  - veggies at 2.00%: ceil(25,000 × 200 ÷ 10,000) = **500
                    laari**; the 2.00%–4.99% band's 0.75% fee gives
                    ceil(25,000 × 75 ÷ 10,000) = ceil(187.5) = **188
                    laari**
                  - the remainder at the standing 5.00%:
                    ceil(45,000 × 500 ÷ 10,000) = **2,250 laari**; the
                    5.00%–20.00% band's 1.00% fee gives
                    ceil(45,000 × 100 ÷ 10,000) = **450 laari**
                  - transaction totals: cashback 0 + 500 + 2,250 = **2,750
                    laari** (MVR 27.50), fee 0 + 188 + 450 = **638 laari**
                    (MVR 6.38)

                  A line whose amounts do not sum to `eligible_amount` is
                  `422 lines_sum_mismatch` — see the `linedCreated`
                  response example for the priced echo.
                value:
                  invoice_no: INV-2107
                  customer_ref: '482917'
                  eligible_amount: 100000
                  occurred_at: '2026-08-15T10:30:00+05:00'
                  lines:
                    - category: fruits
                      amount_laari: 30000
                    - category: veggies
                      amount_laari: 25000
                    - category: null
                      amount_laari: 45000
              customRate:
                summary: Custom cashback for this sale
                description: |
                  A one-off boost — a staff discount day, a goodwill
                  gesture — for THIS sale only. The store's standing rate
                  stays 2.00%; nothing about the offer it advertises
                  changes.

                  An override may only **raise** the rate the sale would
                  otherwise earn: 2.00% here, or a live promotion's rate if
                  one covers the sale. A lower value is refused
                  `422 rate_below_advertised` rather than quietly ignored,
                  because the advertised rate is a promise to the customer.

                  Hand-derived at the applied 5.00% — the platform fee
                  follows the APPLIED rate into its own §4 band, and 5.00%
                  crosses into the 5.00%–20.00% band at 1.00%:

                  - cashback = ceil(118,000 × 500 ÷ 10,000) = **5,900
                    laari** = MVR 59.00
                  - fee = ceil(118,000 × 100 ÷ 10,000) = **1,180 laari** =
                    MVR 11.80
                  - the merchant owes **7,080 laari** (MVR 70.80) against
                    the 3,245 the same basket would have cost at 2.00% —
                    the fee band moved too, not only the cashback

                  The applied rate is frozen on the row: see the
                  `overridden` response example.
                value:
                  invoice_no: INV-1006
                  customer_ref: '482917'
                  eligible_amount: 118000
                  cashback_rate_percent: '5.00'
                  occurred_at: '2026-08-15T11:04:22+05:00'
              phoneKeyed:
                summary: Online store — phone-keyed customer
                description: |
                  A web checkout has the shopper's mobile, not the 6-digit
                  code they would read out at a till. Send it as
                  `+960XXXXXXX` (the 7-digit local form is accepted too and
                  normalised to E.164 before lookup). The two spaces never
                  collide: codes are exactly six digits, local mobiles
                  exactly seven.

                  The only difference in the response is
                  `origin: "api_phone"` instead of `pos`; an unknown number
                  answers exactly like an unknown code,
                  `422 customer_not_found`.

                  Hand-derived at the standing 2.00% on MVR 299.00:

                  - cashback = ceil(29,900 × 200 ÷ 10,000) = **598 laari**
                    = MVR 5.98
                  - fee = ceil(29,900 × 75 ÷ 10,000) = ceil(224.25) =
                    **225 laari** = MVR 2.25
                value:
                  invoice_no: WEB-88410
                  customer_ref: '+9607712345'
                  eligible_amount: 29900
                  occurred_at: '2026-08-15T11:12:41+05:00'
      responses:
        '201':
          description: |
            Sale recorded and cashback accrued. `state` is normally
            `awaiting_validation` (the refund window). A sale older than the
            merchant's validation window + 3 days is still `201` but arrives
            in `state: payable_unfunded` with `reason_code: backdated_final`
            and `backdated: true` — it skipped the refund window, its 15-day
            settlement clock started now, and it is **irreversible** through
            this API.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionWriteResult'
              examples:
                created:
                  summary: Created — cashback accrued at the standing 2.00%
                  description: |
                    The answer to the **Simplest** request example. Worked
                    integers, §4 ceiling rounding: cashback
                    ceil(118,000 × 200 ÷ 10,000) = 2,360 laari (MVR 23.60);
                    the 2.00%–4.99% band's fee is 0.75%, so
                    ceil(118,000 × 75 ÷ 10,000) = 885 laari (MVR 8.85).

                    `occurred_at` equals `received_at` because the request
                    omitted it and the platform used now. A request that
                    sends `sale_amount` gets the identical shape with
                    `sale_laari` set — it is reference data only and never
                    touches these integers.
                  value:
                    status: created
                    reason: null
                    transaction:
                      id: 84521
                      origin: pos
                      invoice_no: INV-1001
                      state: awaiting_validation
                      reason_code: null
                      backdated: false
                      currency: MVR
                      eligible_laari: 118000
                      sale_laari: null
                      cashback_rate_percent: '2.00'
                      platform_fee_percent: '0.75'
                      cashback_laari: 2360
                      cashback_mvr: '23.60'
                      fee_laari: 885
                      fee_mvr: '8.85'
                      fee_gst_laari: 0
                      occurred_at: '2026-08-15T06:04:22+00:00'
                      received_at: '2026-08-15T06:04:22+00:00'
                linedCreated:
                  summary: Lined created — the mixed basket priced per line
                  description: |
                    The answer to the **Mixed basket with line items**
                    request. Standing 5.00% (fee band 1.00%), `veggies`
                    priced at its own 2.00% (fee band 0.75%), `fruits`
                    excluded. §4 ceiling rounding at each line, then
                    summed:

                    - fruits 30,000, excluded → 0 cashback, 0 fee
                    - veggies ceil(25,000 × 200 ÷ 10,000) = 500; fee
                      ceil(25,000 × 75 ÷ 10,000) = ceil(187.5) = 188
                    - default bucket ceil(45,000 × 500 ÷ 10,000) = 2,250;
                      fee ceil(45,000 × 100 ÷ 10,000) = 450

                    Transaction totals are the SUMS of those stored line
                    integers — cashback 2,750 (MVR 27.50), fee 638 (MVR
                    6.38) — never a recomputation against the 100,000
                    aggregate. The row-level `cashback_rate_percent` /
                    `platform_fee_percent` are the base-rate snapshot,
                    which is why they read "5.00" / "1.00" while the
                    veggies line reads "2.00".
                  value:
                    status: created
                    reason: null
                    transaction:
                      id: 84525
                      origin: pos
                      invoice_no: INV-2107
                      state: awaiting_validation
                      reason_code: null
                      backdated: false
                      currency: MVR
                      eligible_laari: 100000
                      sale_laari: null
                      cashback_rate_percent: '5.00'
                      platform_fee_percent: '1.00'
                      cashback_laari: 2750
                      cashback_mvr: '27.50'
                      fee_laari: 638
                      fee_mvr: '6.38'
                      fee_gst_laari: 0
                      occurred_at: '2026-08-15T05:30:00+00:00'
                      received_at: '2026-08-15T05:30:01+00:00'
                      lines:
                        - category: fruits
                          category_name_en: Fruits
                          amount_laari: 30000
                          cashback_rate_percent: '0.00'
                          platform_fee_percent: '0.00'
                          cashback_laari: 0
                          fee_laari: 0
                          priced_by: excluded
                          sort: 0
                        - category: veggies
                          category_name_en: Veggies
                          amount_laari: 25000
                          cashback_rate_percent: '2.00'
                          platform_fee_percent: '0.75'
                          cashback_laari: 500
                          fee_laari: 188
                          priced_by: category
                          sort: 1
                        - category: null
                          category_name_en: null
                          amount_laari: 45000
                          cashback_rate_percent: '5.00'
                          platform_fee_percent: '1.00'
                          cashback_laari: 2250
                          fee_laari: 450
                          priced_by: standing
                          sort: 2
                overridden:
                  summary: Per-sale override applied — 5.00% frozen on the row
                  description: |
                    The answer to the **Custom cashback for this sale**
                    request. Standing 2.00%, override "5.00" on this sale.
                    Worked integers: cashback
                    ceil(118,000 × 500 ÷ 10,000) = 5,900 (MVR 59.00); the
                    fee follows the APPLIED rate into the 5.00%–20.00% band
                    (1.00%), so ceil(118,000 × 100 ÷ 10,000) = 1,180 (MVR
                    11.80). The merchant's standing rate is untouched — the
                    next sale prices at 2.00% again.
                  value:
                    status: created
                    reason: null
                    transaction:
                      id: 84526
                      origin: pos
                      invoice_no: INV-1006
                      state: awaiting_validation
                      reason_code: null
                      backdated: false
                      currency: MVR
                      eligible_laari: 118000
                      sale_laari: null
                      cashback_rate_percent: '5.00'
                      platform_fee_percent: '1.00'
                      cashback_laari: 5900
                      cashback_mvr: '59.00'
                      fee_laari: 1180
                      fee_mvr: '11.80'
                      fee_gst_laari: 0
                      occurred_at: '2026-08-15T06:04:22+00:00'
                      received_at: '2026-08-15T06:04:23+00:00'
                backdated:
                  summary: Backdated sale — payable immediately, irreversible
                  description: |
                    `occurred_at` is older than the merchant's validation
                    window plus the 3-day grace, so the sale skipped the
                    refund window entirely: `state: payable_unfunded` with
                    the 15-day settlement clock starting NOW, and
                    `backdated: true` forever — `POST /reverse` answers
                    `409 backdated_irreversible` whatever the state.
                    Pricing is unchanged by any of that: at the standing
                    2.00%, cashback ceil(50,000 × 200 ÷ 10,000) = 1,000
                    (MVR 10.00), fee ceil(50,000 × 75 ÷ 10,000) = 375 (MVR
                    3.75).
                  value:
                    status: created
                    reason: backdated_final
                    transaction:
                      id: 84522
                      origin: pos
                      invoice_no: INV-0844
                      state: payable_unfunded
                      reason_code: backdated_final
                      backdated: true
                      currency: MVR
                      eligible_laari: 50000
                      sale_laari: null
                      cashback_rate_percent: '2.00'
                      platform_fee_percent: '0.75'
                      cashback_laari: 1000
                      cashback_mvr: '10.00'
                      fee_laari: 375
                      fee_mvr: '3.75'
                      fee_gst_laari: 0
                      occurred_at: '2026-08-01T10:00:00+00:00'
                      received_at: '2026-08-15T06:04:23+00:00'
        '200':
          description: |
            One of three non-error outcomes, distinguished by `status`:

            - **Idempotent replay** — this `Idempotency-Key` was already
              processed; the original result is returned unchanged, with the
              `Idempotency-Replay: true` header. `status` reflects the
              *original* outcome (a replayed creation has `status: created`).
            - **`recorded_ineligible`** — the merchant is suspended
              (settlement overdue past day 16). The sale is accepted and
              recorded so the till never errors, but **no cashback accrues**:
              `cashback_laari: 0`, `reason: merchant_suspended`, terminal
              `state: reversed`. Resumes automatically on reinstatement — see
              the `merchant.suspended` / `merchant.reinstated` webhooks.
            - **`below_minimum`** — `eligible_amount` is below the merchant's
              minimum eligible transaction. Recorded with
              `cashback_laari: 0`, `reason: below_minimum`, terminal
              `state: reversed`. Not an error — do not retry.
          headers:
            Idempotency-Replay:
              $ref: '#/components/headers/IdempotencyReplay'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionWriteResult'
              examples:
                idempotentReplay:
                  summary: Replay of an earlier successful creation (Idempotency-Replay header set)
                  description: |
                    Byte-for-byte the original `created` body — the same
                    id, the same 2,360 / 885 integers, the same
                    `received_at` from the first request — returned with
                    `Idempotency-Replay: true` and HTTP 200 instead of 201.
                    Nothing was recorded twice. A till that retries after a
                    timeout is safe precisely because this is not a new
                    sale.
                  value:
                    status: created
                    reason: null
                    transaction:
                      id: 84521
                      origin: pos
                      invoice_no: INV-1001
                      state: awaiting_validation
                      reason_code: null
                      backdated: false
                      currency: MVR
                      eligible_laari: 118000
                      sale_laari: null
                      cashback_rate_percent: '2.00'
                      platform_fee_percent: '0.75'
                      cashback_laari: 2360
                      cashback_mvr: '23.60'
                      fee_laari: 885
                      fee_mvr: '8.85'
                      fee_gst_laari: 0
                      occurred_at: '2026-08-15T06:04:22+00:00'
                      received_at: '2026-08-15T06:04:22+00:00'
                recordedIneligibleSuspended:
                  summary: recorded_ineligible — suspended store, sale recorded, no cashback
                  description: |
                    The merchant is suspended for an overdue settlement
                    (§7: suspension stops cashback CREATION, not
                    ingestion). The sale is accepted so the till never
                    errors, and lands terminal at `state: reversed` — it
                    can never confirm, so it is never shown to the customer
                    as Pending.

                    Every money integer is **0**: MVR 2,000.00 eligible at
                    2.00% would have earned ceil(200,000 × 200 ÷ 10,000) =
                    4,000 laari with a 1,500-laari fee, and earns none of
                    it. The frozen `cashback_rate_percent` /
                    `platform_fee_percent` are still present and still the
                    standing terms: the row evidences what the sale would
                    have met. A `cashback_rate_percent` override in the
                    request is ignored here rather than refused — the sale
                    earns nothing either way.

                    Accrual resumes by itself on reinstatement; watch the
                    `merchant.suspended` / `merchant.reinstated` webhooks
                    rather than retrying this sale.
                  value:
                    status: recorded_ineligible
                    reason: merchant_suspended
                    transaction:
                      id: 84523
                      origin: pos
                      invoice_no: INV-1003
                      state: reversed
                      reason_code: merchant_suspended
                      backdated: false
                      currency: MVR
                      eligible_laari: 200000
                      sale_laari: null
                      cashback_rate_percent: '2.00'
                      platform_fee_percent: '0.75'
                      cashback_laari: 0
                      cashback_mvr: '0.00'
                      fee_laari: 0
                      fee_mvr: '0.00'
                      fee_gst_laari: 0
                      occurred_at: '2026-08-15T06:10:00+00:00'
                      received_at: '2026-08-15T06:10:01+00:00'
                belowMinimum:
                  summary: below_minimum — under the store's minimum, recorded, zero cashback
                  description: |
                    `eligible_amount` 3,500 laari is MVR 35.00, under this
                    merchant's MVR 50.00 (5,000 laari) minimum eligible
                    transaction, so no cashback accrues:
                    ceil(3,500 × 200 ÷ 10,000) = 70 laari is what the sale
                    would have earned above the minimum, and it earns 0.
                    The row is terminal at `state: reversed`.

                    This is a **200, not an error** — the sale is genuine
                    and the cashier should be told the truth, not shown a
                    failure. Do not retry it.
                  value:
                    status: below_minimum
                    reason: below_minimum
                    transaction:
                      id: 84524
                      origin: pos
                      invoice_no: INV-1004
                      state: reversed
                      reason_code: below_minimum
                      backdated: false
                      currency: MVR
                      eligible_laari: 3500
                      sale_laari: 3500
                      cashback_rate_percent: '2.00'
                      platform_fee_percent: '0.75'
                      cashback_laari: 0
                      cashback_mvr: '0.00'
                      fee_laari: 0
                      fee_mvr: '0.00'
                      fee_gst_laari: 0
                      occurred_at: '2026-08-15T06:12:00+00:00'
                      received_at: '2026-08-15T06:12:01+00:00'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenAbility'
        '409':
          description: |
            Terminal conflict — do not retry with the same request.

            `duplicate_invoice` — this `invoice_no` already exists for the
            merchant under a *different* `Idempotency-Key`: the same sale
            arrived as two distinct requests. The existing transaction id
            is in `error.meta.transaction_id`. Treat the sale as already
            recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                duplicateInvoice:
                  value:
                    error:
                      code: duplicate_invoice
                      message: Invoice INV-1001 has already been recorded for this merchant.
                      meta:
                        transaction_id: 84521
        '422':
          description: |
            The request is malformed or fails a published business rule.
            Terminal — fix the request before resending (a corrected resend
            is a new write: use a fresh `Idempotency-Key`).

            Codes: `validation_failed` (shape errors — missing fields,
            non-integer amounts, an `occurred_at` that is neither ISO 8601
            nor a plain wall clock, a `cashback_rate_percent` with more
            than two decimals, unknown `branch_id`), `future_dated`
            (`occurred_at` beyond the 5-minute skew allowance),
            `customer_not_found` (unknown `customer_ref` — confirm the code
            with the customer via `GET /v1/customers/lookup`),
            `no_effective_rate` (merchant has no rate effective at
            `occurred_at` — contact the platform),
            `rate_below_advertised` (the `cashback_rate_percent` override is
            below the rate the sale already earns — an override may only
            raise it), `rate_not_priced` (the override is above the ceiling
            the platform's fee schedule prices),
            `idempotency_key_required` (the write arrived without the
            mandatory `Idempotency-Key` header), and
            `idempotency_key_reuse_mismatch` (this `Idempotency-Key` was
            already used with a different request body — fix the till's key
            generation; never reuse a key across different sales).

            Line-split failures (only possible when `lines` is sent):
            `unknown_category` (not one of this merchant's slugs — refresh
            `GET /v1/merchants/me/product-categories`), `inactive_category`
            (the category was deactivated), `duplicate_category_line` (a
            category — or the null default — appears twice), and
            `lines_sum_mismatch` (line amounts do not sum to exactly
            `eligible_amount`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                idempotencyMismatch:
                  value:
                    error:
                      code: idempotency_key_reuse_mismatch
                      message: This Idempotency-Key was already used with a different request body.
                malformedOccurredAt:
                  summary: occurred_at in a shape the API does not accept
                  description: |
                    An offsetless wall clock (`2026-08-14 11:04:22`) is NOT
                    an error — it is read as Maldives time. This is a
                    genuinely unparseable value.
                  value:
                    error:
                      code: validation_failed
                      message: The given data was invalid.
                      errors:
                        occurred_at:
                          - The occurred_at field must be ISO 8601 with an offset, or "YYYY-MM-DD HH:MM:SS" in Maldives time.
                overPreciseRate:
                  summary: cashback_rate_percent with more than 2 decimals
                  value:
                    error:
                      code: validation_failed
                      message: The given data was invalid.
                      errors:
                        cashback_rate_percent:
                          - The cashback rate percent must be a percent between 0.50 and 20.00 with at most 2 decimal places, for example "0.50".
                floatAmount:
                  summary: Fractional eligible_amount
                  value:
                    error:
                      code: validation_failed
                      message: The given data was invalid.
                      errors:
                        eligible_amount:
                          - The eligible_amount field must be an integer count of laari.
                futureDated:
                  value:
                    error:
                      code: future_dated
                      message: occurred_at is in the future beyond the permitted clock-skew allowance.
                customerNotFound:
                  value:
                    error:
                      code: customer_not_found
                      message: 'No customer matches ref "482917".'
                rateBelowAdvertised:
                  summary: Override below the rate the sale already earns
                  description: |
                    Standing 2.00%, override "1.50": refused. The advertised
                    rate is a promise to the customer, so an override may
                    only boost. `meta` carries the rate that applies, so the
                    till can retry at or above it (with a fresh
                    `Idempotency-Key`) or simply drop the field.
                  value:
                    error:
                      code: rate_below_advertised
                      message: cashback_rate_percent 1.50% is below the 2.00% this sale already earns — an override may only raise the advertised rate.
                      meta:
                        advertised_cashback_rate_percent: '2.00'
                rateNotPriced:
                  summary: Override above the platform's priced ceiling
                  value:
                    error:
                      code: rate_not_priced
                      message: The current fee schedule prices rates up to 10.00%.
                      meta:
                        ceiling_percent: '10.00'
                linesSumMismatch:
                  summary: Line amounts do not sum to eligible_amount
                  value:
                    error:
                      code: lines_sum_mismatch
                      message: Line amounts sum to 75000 laari but eligible_amount is 100000 — they must be equal.
                unknownCategory:
                  value:
                    error:
                      code: unknown_category
                      message: 'No product category "electronics" exists for this merchant.'

  /v1/transactions/{id}/reverse:
    post:
      operationId: reverseTransaction
      tags: [Transactions]
      summary: Reverse a recorded sale
      x-required-ability: transactions:reverse
      description: |
        Reverses a sale — refund, till void, duplicate. Reversal reverses the
        **stored** integers; nothing is ever recomputed from a since-changed
        rate.

        The outcome depends on where the transaction sits in its lifecycle,
        and the `200` body distinguishes them so the till can tell them
        apart:

        - **`outcome: reversed`** — the transaction was still pending (not
          yet locked into a settlement, not confirmed). It moves to
          `state: reversed`; the accrual is reversed in full.
        - **`outcome: adjustment_created`** — the transaction can no longer
          be reversed in place: its line is **locked in a settlement batch**
          that has left draft (`cause: locked_in_settlement`), or the reward
          is **already confirmed or paid** (`cause: already_confirmed`). The
          transaction is untouched; a credit adjustment is created instead
          and applied to the merchant's next settlement batch. This is a
          success, not a failure — record `adjustment.id` and move on.

        Terminal states (`reversed`, `written_off`) return
        `409 invalid_state`. Note: retrying a reversal with the **same**
        `Idempotency-Key` replays the original `200`; `invalid_state` only
        fires on a *new* key against an already-terminal transaction.

        **Backdated sales cannot be reversed here at all.** A transaction
        created outside the merchant's validation window (`backdated: true`,
        `reason_code: backdated_final`) answers `409
        backdated_irreversible` in **every** state — pending, confirmed or
        paid — and no credit adjustment is created either. It was recorded
        as final and became payable immediately; only an admin adjustment
        can correct it. This code is deliberately distinct from
        `invalid_state`: `invalid_state` describes the transaction's current
        position, while `backdated_irreversible` will never succeed on any
        retry, so route it to a human rather than a queue.

        Cross-merchant ids return `404 transaction_not_found` —
        indistinguishable from a nonexistent id, deliberately.
      parameters:
        - name: id
          in: path
          required: true
          description: Transaction id, as returned at creation.
          schema:
            type: integer
            format: int64
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReverseRequest'
            examples:
              refund:
                value:
                  reason: customer_refund
                  occurred_at: '2026-08-15T09:30:00+05:00'
      responses:
        '200':
          description: Reversal processed — see `outcome`.
          headers:
            Idempotency-Replay:
              $ref: '#/components/headers/IdempotencyReplay'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReverseResult'
              examples:
                reversed:
                  summary: Pending transaction reversed in place
                  value:
                    outcome: reversed
                    cause: null
                    adjustment: null
                    transaction:
                      id: 84521
                      origin: pos
                      invoice_no: INV-1001
                      state: reversed
                      reason_code: customer_refund
                      backdated: false
                      currency: MVR
                      eligible_laari: 118000
                      sale_laari: null
                      cashback_rate_percent: '2.00'
                      platform_fee_percent: '0.75'
                      cashback_laari: 2360
                      cashback_mvr: '23.60'
                      fee_laari: 885
                      fee_mvr: '8.85'
                      fee_gst_laari: 0
                      occurred_at: '2026-08-14T06:04:22+00:00'
                      received_at: '2026-08-14T06:04:23+00:00'
                lockedInSettlement:
                  summary: Line locked in a non-draft settlement — credit adjustment created
                  value:
                    outcome: adjustment_created
                    cause: locked_in_settlement
                    adjustment:
                      id: 311
                      transaction_id: 84521
                      amount_laari: -3245
                      amount_mvr: '-32.45'
                      currency: MVR
                      reason_code: customer_refund
                      created_at: '2026-08-15T04:30:00+00:00'
                    transaction:
                      id: 84521
                      origin: pos
                      invoice_no: INV-1001
                      state: payable_unfunded
                      reason_code: null
                      backdated: false
                      currency: MVR
                      eligible_laari: 118000
                      sale_laari: null
                      cashback_rate_percent: '2.00'
                      platform_fee_percent: '0.75'
                      cashback_laari: 2360
                      cashback_mvr: '23.60'
                      fee_laari: 885
                      fee_mvr: '8.85'
                      fee_gst_laari: 0
                      occurred_at: '2026-08-14T06:04:22+00:00'
                      received_at: '2026-08-14T06:04:23+00:00'
                alreadyConfirmed:
                  summary: Reward already confirmed — credit adjustment created
                  value:
                    outcome: adjustment_created
                    cause: already_confirmed
                    adjustment:
                      id: 312
                      transaction_id: 84488
                      amount_laari: -2750
                      amount_mvr: '-27.50'
                      currency: MVR
                      reason_code: customer_refund
                      created_at: '2026-08-15T04:31:00+00:00'
                    transaction:
                      id: 84488
                      origin: pos
                      invoice_no: INV-0991
                      state: confirmed
                      reason_code: null
                      backdated: false
                      currency: MVR
                      eligible_laari: 100000
                      sale_laari: null
                      cashback_rate_percent: '2.00'
                      platform_fee_percent: '0.75'
                      cashback_laari: 2000
                      cashback_mvr: '20.00'
                      fee_laari: 750
                      fee_mvr: '7.50'
                      fee_gst_laari: 0
                      occurred_at: '2026-08-10T05:00:00+00:00'
                      received_at: '2026-08-10T05:00:01+00:00'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenAbility'
        '404':
          description: |
            `transaction_not_found` — the id does not exist **or belongs to
            another merchant**. The two cases are deliberately
            indistinguishable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                notFound:
                  value:
                    error:
                      code: transaction_not_found
                      message: No transaction with id 99999.
        '409':
          description: |
            Two distinct codes, both terminal — do not retry either:

            - `invalid_state` — the transaction is in a terminal state
              (`reversed`, `written_off`) and cannot be reversed again.
            - `backdated_irreversible` — the sale was recorded outside the
              merchant's validation window (`backdated: true`). It became
              payable the moment it was recorded and can never be reversed
              by the merchant or their vendor, in any state, and no credit
              adjustment is created. Corrections are admin adjustments —
              contact the platform.

            The current state is in `error.meta.state` for both.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                alreadyReversed:
                  value:
                    error:
                      code: invalid_state
                      message: Transaction 84521 is already reversed.
                      meta:
                        state: reversed
                backdatedIrreversible:
                  value:
                    error:
                      code: backdated_irreversible
                      message: >-
                        Transaction 84522 was credited as a backdated sale and cannot be
                        reversed by the merchant — an admin adjustment is required.
                      meta:
                        state: payable_unfunded
        '422':
          description: '`validation_failed` — missing `reason`, or an unparseable `occurred_at`; `future_dated` when the reversal instant is in the future.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                missingReason:
                  value:
                    error:
                      code: validation_failed
                      message: The given data was invalid.
                      errors:
                        reason:
                          - The reason field is required.

  /v1/merchants/me/rate:
    get:
      operationId: getMyRate
      tags: [Merchant]
      summary: Current rate for the till display
      x-required-ability: rates:read
      description: |
        The authenticated merchant's current cashback rate and platform fee,
        plus any **pending scheduled decrease**. Decreases take effect only
        at 00:00 (UTC+5) the next day; increases take effect immediately, so
        `pending_decrease` is the only kind of scheduled change that can
        exist.

        The value returned here is advisory, for the till display. The
        server always recomputes authoritatively from the rate effective at
        `occurred_at`. Vendors should refresh their cache on the
        `merchant.rate_changed` webhook rather than poll.
      responses:
        '200':
          description: Current rate and any pending scheduled decrease.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerchantRate'
              examples:
                steady:
                  summary: No pending change
                  value:
                    cashback_rate_percent: '2.00'
                    platform_fee_percent: '0.75'
                    currency: MVR
                    min_eligible_laari: 5000
                    pending_decrease: null
                decreaseScheduled:
                  summary: Decrease scheduled for midnight UTC+5
                  value:
                    cashback_rate_percent: '2.00'
                    platform_fee_percent: '0.75'
                    currency: MVR
                    min_eligible_laari: 5000
                    pending_decrease:
                      cashback_rate_percent: '1.50'
                      platform_fee_percent: '0.50'
                      effective_at: '2026-08-15T00:00:00+05:00'
                livePromotion:
                  summary: A live promotion boosting the standing rate
                  description: |
                    `active_promotion` appears ONLY while a published
                    promotion is live and its rate beats the standing rate.
                    Display it as the offer; the server still resolves
                    authoritatively at `occurred_at`.
                  value:
                    cashback_rate_percent: '2.00'
                    platform_fee_percent: '0.75'
                    currency: MVR
                    min_eligible_laari: 5000
                    pending_decrease: null
                    active_promotion:
                      cashback_rate_percent: '5.00'
                      platform_fee_percent: '1.00'
                      branch_id: null
                      min_purchase_laari: 10000
                      ends_at: '2026-08-20T00:00:00+05:00'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenAbility'
        '422':
          description: '`no_effective_rate` — the merchant has no rate configured as of now. Contact the platform.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                noRate:
                  value:
                    error:
                      code: no_effective_rate
                      message: No cashback rate is currently effective — contact the platform.

  /v1/merchants/me/product-categories:
    get:
      operationId: listMyProductCategories
      tags: [Merchant]
      summary: Product categories usable in transaction lines
      x-required-ability: rates:read
      description: |
        The authenticated merchant's **active** product categories — the
        allowed values for `lines[].category` on `POST /v1/transactions`.
        `category` is the exact string to submit. `mode: excluded` lines
        earn nothing (even during promotions); `mode: rate` lines earn
        their `cashback_rate_percent` instead of the standing rate. Amounts in no listed
        category belong on the default line (`category: null`), which earns
        the standing rate.

        The list is merchant-managed and can change at any time; a
        deactivated category is refused at credit time with
        `inactive_category`, so refresh on that error rather than caching
        indefinitely. Sales without `lines` are never affected.
      responses:
        '200':
          description: Active product categories, in display order.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProductCategory'
              examples:
                typical:
                  value:
                    data:
                      - category: fruits
                        name_en: Fruits
                        name_dv: މޭވާ
                        mode: excluded
                        cashback_rate_percent: null
                      - category: veggies
                        name_en: Veggies
                        name_dv: ތަރުކާރީ
                        mode: rate
                        cashback_rate_percent: '2.00'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenAbility'

  /v1/customers/lookup:
    get:
      operationId: lookupCustomer
      tags: [Customers]
      summary: Confirm a customer ref at the till
      x-required-ability: customers:lookup
      description: |
        Resolves a customer ref — the 6-digit customer code the customer
        shows as digits or QR, or their Maldivian mobile (`+960XXXXXXX` or
        the 7-digit local form starting `7` or `9`) — to a **masked** name
        so the cashier can confirm the right person is being credited — the
        defence against recycled phone numbers and typos crediting a
        stranger. Confirm before every phone-keyed credit: a mistyped
        mobile is a real, currently-assigned number more often than a
        mistyped code is a real code.

        `valid: true` means the customer can currently earn. A ref that
        resolves but cannot earn (customer blocked or closed) returns `200`
        with `valid: false`. An unknown ref returns `404
        customer_not_found`.

        Only the masked name is ever exposed. No balance, phone number, or
        any other customer data crosses this API.

        **Failed lookups are budgeted.** Because the ref space is small, a
        walk of it is treated as enumeration: unresolved refs are counted
        **per merchant per rolling day** — shared across every credential
        the store holds — and beyond the daily allowance every lookup for
        that merchant answers `429` `{"message": "Too Many Attempts."}`
        with `Retry-After` until the window rolls. Successful lookups are
        never counted. A till confirming refs a customer is standing there
        reading out will never approach it; a script iterating refs will.
      parameters:
        - name: ref
          in: query
          required: true
          description: |
            The customer's 6-digit code as shown at the till, or their
            Maldivian mobile (`+960XXXXXXX`, or 7-digit local starting `7`
            or `9`). Remember to URL-encode `+` as `%2B`.
          schema:
            type: string
            pattern: '^(\d{6}|\+960[79]\d{6}|[79]\d{6})$'
          examples:
            code:
              value: '482917'
            phone:
              value: '+9607712345'
      responses:
        '200':
          description: The ref resolves; confirm the masked name with the customer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerLookupResult'
              examples:
                valid:
                  value:
                    ref: '482917'
                    valid: true
                    masked_name: Ais*** Moh***
                blocked:
                  summary: Known ref that cannot currently earn
                  value:
                    ref: '104433'
                    valid: false
                    masked_name: Hus*** Ada***
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenAbility'
        '404':
          description: '`customer_not_found` — no customer matches this ref.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                unknown:
                  value:
                    error:
                      code: customer_not_found
                      message: 'No customer matches ref "000000".'
        '422':
          description: '`validation_failed` — `ref` missing, or neither a 6-digit code nor a Maldivian mobile.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                badRef:
                  value:
                    error:
                      code: validation_failed
                      message: The given data was invalid.
                      errors:
                        ref:
                          - The ref field format is invalid.

# ---------------------------------------------------------------------------
# Outbound webhooks (PLAN §9.3)
# ---------------------------------------------------------------------------
webhooks:

  merchant.rate_changed:
    post:
      operationId: webhookMerchantRateChanged
      summary: The merchant's standing rate changed
      description: |
        Emitted whenever the merchant's rate changes. For decreases,
        `effective_at` is 00:00 (UTC+5) the next day; for increases it is
        the moment of the change. Refresh the till's cached rate on receipt
        — without this event, tills cache indefinitely and quote offers the
        platform will not honour.

        See `WebhookEvent` for the envelope, signature verification, and the
        retry policy common to all events.
      parameters:
        - $ref: '#/components/parameters/WebhookSignature'
        - $ref: '#/components/parameters/WebhookTimestamp'
        - $ref: '#/components/parameters/WebhookEventName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/WebhookEvent'
                - type: object
                  properties:
                    type:
                      const: merchant.rate_changed
                    data:
                      $ref: '#/components/schemas/WebhookRateChangedData'
            examples:
              decrease:
                value:
                  id: evt_01J5A8Z0T2N9GQK4WMB3XVRD6H
                  type: merchant.rate_changed
                  created_at: '2026-08-14T16:05:11+05:00'
                  data:
                    merchant_id: 12
                    cashback_rate_percent: '1.50'
                    platform_fee_percent: '0.50'
                    previous_cashback_rate_percent: '2.00'
                    previous_platform_fee_percent: '0.75'
                    effective_at: '2026-08-15T00:00:00+05:00'
      responses:
        '200':
          description: Acknowledged. Any `2xx` counts as delivered; anything else (or a 10-second timeout) is retried.

  merchant.suspended:
    post:
      operationId: webhookMerchantSuspended
      summary: The merchant was suspended
      description: |
        Emitted when the merchant is automatically suspended (settlement
        overdue past day 16). From this moment, `POST /v1/transactions`
        returns `200 recorded_ineligible` with `reason: merchant_suspended`
        — sales are still recorded, but no cashback accrues. Tills should
        stop advertising cashback until `merchant.reinstated`.
      parameters:
        - $ref: '#/components/parameters/WebhookSignature'
        - $ref: '#/components/parameters/WebhookTimestamp'
        - $ref: '#/components/parameters/WebhookEventName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/WebhookEvent'
                - type: object
                  properties:
                    type:
                      const: merchant.suspended
                    data:
                      $ref: '#/components/schemas/WebhookSuspendedData'
            examples:
              suspended:
                value:
                  id: evt_01J5A9B7WQZ3JD8T2NKC5YVEMF
                  type: merchant.suspended
                  created_at: '2026-08-16T00:05:00+05:00'
                  data:
                    merchant_id: 12
                    reason: overdue_settlement
                    suspended_at: '2026-08-16T00:05:00+05:00'
      responses:
        '200':
          description: Acknowledged. Any `2xx` counts as delivered; anything else (or a 10-second timeout) is retried.

  merchant.reinstated:
    post:
      operationId: webhookMerchantReinstated
      summary: The merchant was reinstated
      description: |
        Emitted when a suspended merchant settles and is reinstated.
        Cashback accrual resumes for sales received after
        `reinstated_at`; tills may resume advertising the offer.
      parameters:
        - $ref: '#/components/parameters/WebhookSignature'
        - $ref: '#/components/parameters/WebhookTimestamp'
        - $ref: '#/components/parameters/WebhookEventName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/WebhookEvent'
                - type: object
                  properties:
                    type:
                      const: merchant.reinstated
                    data:
                      $ref: '#/components/schemas/WebhookReinstatedData'
            examples:
              reinstated:
                value:
                  id: evt_01J5AB2R8XW4KE9V3PMD6ZTFNG
                  type: merchant.reinstated
                  created_at: '2026-08-18T10:12:00+05:00'
                  data:
                    merchant_id: 12
                    reinstated_at: '2026-08-18T10:12:00+05:00'
      responses:
        '200':
          description: Acknowledged. Any `2xx` counts as delivered; anything else (or a 10-second timeout) is retried.

  transaction.reversed:
    post:
      operationId: webhookTransactionReversed
      summary: A transaction was reversed
      description: |
        Emitted whenever one of the merchant's transactions transitions to
        `reversed` — including reversals initiated outside this API (admin
        action, dispute resolution), so the till's local record can be kept
        in sync. Reversals the vendor itself initiated also emit this event;
        deduplicate by transaction id.
      parameters:
        - $ref: '#/components/parameters/WebhookSignature'
        - $ref: '#/components/parameters/WebhookTimestamp'
        - $ref: '#/components/parameters/WebhookEventName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/WebhookEvent'
                - type: object
                  properties:
                    type:
                      const: transaction.reversed
                    data:
                      $ref: '#/components/schemas/WebhookTransactionReversedData'
            examples:
              adminReversal:
                value:
                  id: evt_01J5AC9K2MHQ7FT5WNB8XVGDRP
                  type: transaction.reversed
                  created_at: '2026-08-15T14:20:00+05:00'
                  data:
                    transaction_id: 84521
                    merchant_id: 12
                    invoice_no: INV-1001
                    reason: dispute_resolved
                    reversed_at: '2026-08-15T14:20:00+05:00'
      responses:
        '200':
          description: Acknowledged. Any `2xx` counts as delivered; anything else (or a 10-second timeout) is retried.

# ---------------------------------------------------------------------------
# Components
# ---------------------------------------------------------------------------
components:

  securitySchemes:
    vendorToken:
      type: http
      scheme: bearer
      description: |
        Per-merchant Sanctum personal access token — one token per merchant
        per POS vendor, independently revocable, so a merchant switching POS
        vendor never forces rotation across other merchants.

        Two ways a token comes into existence, both producing the same
        credential: Manfaa issues one at onboarding, or the **merchant's own
        owner** issues one themselves from Settings › API access in the
        merchant panel, choosing the abilities below. Either way the
        plaintext is shown exactly once at issuance and never again — only
        its SHA-256 digest is stored, so a lost token is replaced, never
        recovered. The merchant can revoke any of their tokens at any time
        from the same screen; the next request with it answers `401`.

        Each token carries **abilities**; every operation declares the one
        it requires as `x-required-ability`:

        | Ability | Grants |
        |---|---|
        | `transactions:write` | `POST /v1/transactions` |
        | `transactions:reverse` | `POST /v1/transactions/{id}/reverse` |
        | `rates:read` | `GET /v1/merchants/me/rate` |
        | `customers:lookup` | `GET /v1/customers/lookup` |

        A missing or revoked token returns `401`
        `{"message": "Unauthenticated."}`; a valid token lacking the
        operation's ability returns `403`
        `{"message": "Invalid ability provided."}` (both auth-layer bodies
        — see `AuthLayerMessage`). Tokens are merchant-scoped: every
        resource read or written belongs to the token's merchant, and other
        merchants' resources answer `404`. Requests are throttled at 120
        per minute **per token**; beyond that, `429`
        `{"message": "Too Many Attempts."}` with `Retry-After`.

  parameters:

    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Unique key for this write, generated by the till — a fresh UUID v4
        per logical operation is recommended. Scoped to the merchant
        credential. Omitting the header is `422 idempotency_key_required`.
        Repeating a key with an identical body replays the original result
        (`200` + `Idempotency-Replay: true`); repeating it with a different
        body is `422 idempotency_key_reuse_mismatch`. Retries after network
        failures or `5xx` MUST reuse the same key.
      schema:
        type: string
        minLength: 1
        maxLength: 255
      example: 0a1cf047-9d35-4f26-b8a9-6f2f7c1de1a4

    WebhookSignature:
      name: X-Manfaa-Signature
      in: header
      required: true
      description: |
        Lowercase hex encoding of `HMAC-SHA256(endpoint_secret, raw_body)`,
        computed over the **raw request body bytes exactly as sent** — verify
        before parsing, against the raw bytes, never a re-serialisation.
        Compare in constant time. Retried deliveries carry an identical body
        and therefore an identical signature.
      schema:
        type: string
        pattern: '^[0-9a-f]{64}$'
      example: 5b6c1de0f4a2b39c8e7d6f5a4b3c2d1e0f9a8b7c6d5e4f3a2b1c0d9e8f7a6b5c

    WebhookTimestamp:
      name: X-Manfaa-Timestamp
      in: header
      required: true
      description: |
        Unix epoch seconds of this delivery **attempt**. Not covered by the
        signature (which is over the body alone); use it for latency
        monitoring and coarse staleness checks. Replay protection comes from
        the signed body: deduplicate by the event `id` and reject events
        whose signed `created_at` is implausibly old for your use.
      schema:
        type: integer
        format: int64
      example: 1755151511

    WebhookEventName:
      name: X-Manfaa-Event
      in: header
      required: true
      description: |
        The event name (equal to the body's `type`), so receivers can route
        the delivery before parsing. Not covered by the signature — trust
        the signed `type` field for anything beyond routing.
      schema:
        type: string
        enum:
          - merchant.rate_changed
          - merchant.suspended
          - merchant.reinstated
          - transaction.reversed
      example: merchant.rate_changed

  headers:

    IdempotencyReplay:
      description: |
        Present (with value `true`) when this response is a replay of a
        previously processed `Idempotency-Key` rather than the result of new
        work. Absent on first processing.
      schema:
        type: boolean

  responses:

    Unauthorized:
      description: |
        Missing, malformed, or revoked bearer token. Raised by the auth
        layer before the vendor API proper, so the body is the bare
        `{"message"}` shape, not the error envelope.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthLayerMessage'
          examples:
            unauthorized:
              value:
                message: Unauthenticated.

    ForbiddenAbility:
      description: |
        The token is valid but does not carry the ability this operation
        requires (see `x-required-ability`). Raised by the auth layer, so
        the body is the bare `{"message"}` shape, not the error envelope.
        (The one enveloped `403` is the not-active-merchant refusal on
        `POST /v1/transactions` — closed, or never approved — code
        `forbidden_ability`.)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthLayerMessage'
          examples:
            forbidden:
              value:
                message: Invalid ability provided.

  schemas:

    AuthLayerMessage:
      type: object
      description: |
        The bare body shape of auth-layer and throttling failures (`401`,
        missing-ability `403`, `429`), which are raised before the vendor
        API proper and therefore do not use the error envelope.
      required: [message]
      properties:
        message:
          type: string
          description: Human-readable. Distinguish these outcomes by HTTP status, never by message text.

    MachineCode:
      type: string
      description: |
        The registry of stable machine codes. Codes are contractual and
        never change meaning; messages are human-readable and may change.
        Codes appear in two places: as `error.code` in the error envelope,
        and as reason/cause values inside `200`/`201` bodies (`reason`,
        `cause`, `transaction.reason_code`).

        Note: the usual `401` and missing-ability `403` are auth-layer
        failures with the bare `{"message"}` body (see `AuthLayerMessage`)
        — the `unauthorized` and `forbidden_ability` envelope codes appear
        only on the edge paths noted below.

        | Code | Appears as | HTTP | Retry? |
        |---|---|---|---|
        | `unauthorized` | error (edge paths; the usual 401 body is `{"message": "Unauthenticated."}`) | 401 | After fixing credentials |
        | `forbidden_ability` | error (merchant not active — closed, or never approved; the usual missing-ability 403 body is `{"message": "Invalid ability provided."}`) | 403 | After fixing token abilities; never while the merchant is not active |
        | `validation_failed` | error | 422 | Fix request; resend with a **fresh** key |
        | `idempotency_key_required` | error | 422 | Add the header; resend |
        | `idempotency_key_reuse_mismatch` | error | 422 | Never — fix key generation |
        | `future_dated` | error | 422 | Fix the till clock; resend with a fresh key |
        | `customer_not_found` | error | 422 (create) / 404 (lookup) | Re-confirm the ref with the customer |
        | `no_effective_rate` | error | 422 | No — contact the platform |
        | `rate_below_advertised` | error | 422 | Never with that value — an override may only raise the advertised rate |
        | `rate_not_priced` | error | 422 | No — the platform prices no fee for that rate |
        | `unknown_category` | error | 422 | Refresh the category list; fix the slug; fresh key |
        | `inactive_category` | error | 422 | Refresh the category list; resubmit; fresh key |
        | `duplicate_category_line` | error | 422 | Merge the duplicate lines; fresh key |
        | `lines_sum_mismatch` | error | 422 | Make line amounts sum to `eligible_amount`; fresh key |
        | `duplicate_invoice` | error | 409 | Never — sale already recorded |
        | `invalid_state` | error | 409 | Never — terminal state |
        | `backdated_irreversible` | error | 409 | Never — admin adjustment only |
        | `transaction_not_found` | error | 404 | Never |
        | `merchant_suspended` | reason (`200 recorded_ineligible`) | — | n/a — recorded, no cashback |
        | `below_minimum` | reason (`200 below_minimum`) | — | n/a — recorded, zero cashback |
        | `backdated_final` | reason (`201`, `state: payable_unfunded`) | — | n/a — accepted, payable now, irreversible |
        | `locked_in_settlement` | cause (`200 adjustment_created`) | — | n/a — adjustment created |
        | `already_confirmed` | cause (`200 adjustment_created`) | — | n/a — adjustment created |

        Transient coordination codes (e.g. `409
        idempotency_key_in_flight`) are deliberately unregistered. Anything
        not listed here — and any `5xx` — is retryable with the same
        `Idempotency-Key`.
      enum:
        - unauthorized
        - forbidden_ability
        - validation_failed
        - idempotency_key_required
        - idempotency_key_reuse_mismatch
        - future_dated
        - customer_not_found
        - no_effective_rate
        - rate_below_advertised
        - rate_not_priced
        - unknown_category
        - inactive_category
        - duplicate_category_line
        - lines_sum_mismatch
        - duplicate_invoice
        - invalid_state
        - backdated_irreversible
        - transaction_not_found
        - merchant_suspended
        - below_minimum
        - backdated_final
        - locked_in_settlement
        - already_confirmed

    Error:
      type: object
      description: |
        The error envelope, identical on every non-2xx response except the
        auth-layer `401`/`403` and throttling `429` (see
        `AuthLayerMessage`): `{"error": {"code", "message"}}`. Match on
        `code`, never on `message`. `errors` (per-field messages) is
        present only with `validation_failed`; `meta` carries optional
        machine-readable context (e.g. the existing `transaction_id` on
        `duplicate_invoice`, the current `state` on `invalid_state` and
        `backdated_irreversible`).
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              $ref: '#/components/schemas/MachineCode'
            message:
              type: string
              description: Human-readable, subject to change. Never match on it.
            errors:
              type: object
              description: Per-field validation messages. Present only when `code` is `validation_failed`.
              additionalProperties:
                type: array
                items:
                  type: string
            meta:
              type: object
              description: Optional machine-readable context for this failure mode.
              additionalProperties: true

    LaariAmount:
      type: integer
      format: int64
      description: An integer count of laari (1/100 MVR). Never fractional, never a float.

    PercentString:
      type: string
      pattern: '^\d{1,2}\.\d{2}$'
      description: |
        A rate, as a 2-decimal percent STRING — `"2.00"`, `"0.75"`,
        `"12.50"`. Every rate on this API is quoted this way, the same
        idiom `cashback_mvr` uses for money: exact digits, no float, no
        locale. Internally the platform stores and computes rates as
        integer basis points, but **basis points never appear on the
        wire** — do not expect a `rate_bp` or `fee_bp` field anywhere.

        Read one by splitting on the decimal point (or with a decimal
        type). Never parse it into a binary float and multiply.
      examples: ['2.00', '0.75', '12.50']

    PercentInput:
      description: |
        A rate on the way IN: a 2-decimal percent, sent either as a string
        (`"2"`, `"2.5"`, `"2.50"`) or as a JSON number (`2`, `2.5`). At
        most two decimal places — `"2.555"` is `validation_failed`, as are
        negatives and non-numeric values. Sending a string is recommended:
        it cannot be mangled by a JSON library's float handling.
      oneOf:
        - type: string
          pattern: '^\d{1,2}(\.\d{1,2})?$'
        - type: number
      examples: ['2.50', 2.5]

    MvrString:
      type: string
      pattern: '^-?\d{1,3}(,\d{3})*\.\d{2}$'
      description: |
        Pre-formatted MVR presentation of a laari integer, with thousands
        separators — e.g. laari `430025` is `"4,300.25"`. Presentation only;
        the paired `*_laari` integer is the value.

    TransactionState:
      type: string
      description: |
        Internal transaction state (PLAN §6). The customer-facing status is
        deliberately simpler; for the till, everything up to
        `payable_unfunded`/`on_hold` is "pending", `confirmed`/`paid` are
        final, `reversed`/`written_off` are terminal negatives.

        | State | Meaning |
        |---|---|
        | `tracked` | POST received, not yet validated |
        | `awaiting_validation` | In the refund window — settlement clock not started |
        | `payable_unfunded` | Settlement clock running |
        | `on_hold` | Fraud or dispute review |
        | `confirmed` | Settlement received and allocated |
        | `paid` | Included in a completed payout |
        | `reversed` | Voided, duplicated, invalidated, or recorded-ineligible |
        | `written_off` | Merchant never settled — 90 days past due |
      enum:
        - tracked
        - awaiting_validation
        - payable_unfunded
        - on_hold
        - confirmed
        - paid
        - reversed
        - written_off

    TransactionCreateRequest:
      type: object
      required: [invoice_no, customer_ref, eligible_amount]
      properties:
        invoice_no:
          type: string
          minLength: 1
          maxLength: 64
          description: |
            The merchant's invoice number. Unique per merchant — a second
            distinct request with the same `invoice_no` is
            `409 duplicate_invoice`.
        customer_ref:
          type: string
          pattern: '^(\d{6}|\+960[79]\d{6}|[79]\d{6})$'
          description: |
            Who to credit — EITHER the customer's 6-digit code (shown at the
            till as digits or QR), OR their Maldivian mobile number: full
            `+960XXXXXXX`, or the 7-digit local form (mobiles start `7` or
            `9`), normalised server-side to `+960` E.164 before lookup. The
            two spaces never collide — codes are exactly six digits, local
            mobiles exactly seven. Code-keyed transactions record
            `origin: pos`; phone-keyed record `origin: api_phone`. An
            unknown phone answers exactly like an unknown code —
            `422 customer_not_found`. Any other shape is
            `422 validation_failed`.
          examples: ['482917', '+9607712345', '7712345']
        eligible_amount:
          allOf:
            - $ref: '#/components/schemas/LaariAmount'
          minimum: 1
          description: |
            The merchant's own eligible invoice total, in laari. Taken at
            face value — never recomputed by the platform. This is the only
            figure used in computation.
        sale_amount:
          type: ['integer', 'null']
          format: int64
          minimum: 1
          description: |
            Optional full invoice total, in laari. Never used in any
            computation — kept for dispute answers, merchant analytics, and
            eligible-ratio monitoring.
        occurred_at:
          type: string
          description: |
            When the sale happened at the till. **Optional — omit it and
            the platform uses NOW**, which is what a till posting a sale as
            it rings it up means anyway.

            Two accepted shapes:

            - **ISO 8601 with an explicit offset** —
              `2026-08-14T11:04:22+05:00`, `2026-08-14T06:04:22Z`, or
              `2026-08-14T11:04:22+0500`. Read exactly as sent.
            - **A plain wall clock with NO offset** —
              `2026-08-14 11:04:22` or `2026-08-14T11:04:22` — read as
              **Maldives time (UTC+5)**, the only sensible reading of a
              clock on a Maldivian till. `2026-08-14 11:04:22` is therefore
              the instant `2026-08-14T06:04:22Z`.

            Anything else (a date without a time, `15/08/2026`, seconds
            omitted) is `422 validation_failed`. Future-dated values beyond
            5 minutes of clock skew are `422 future_dated`. The rate
            applied is the one effective at this instant.
          examples: ['2026-08-14T11:04:22+05:00', '2026-08-14 11:04:22']
        cashback_rate_percent:
          allOf:
            - $ref: '#/components/schemas/PercentInput'
          description: |
            **Optional per-sale rate override** — a rate for THIS SALE
            only, e.g. a staff discount day or a one-off goodwill boost.
            The merchant's standing rate is untouched, and the rate that
            actually applied is frozen on the transaction as always
            (`transaction.cashback_rate_percent`), with the platform fee
            following the APPLIED rate into its §4 tier.

            Two rules, both refusals rather than silent adjustments:

            - it may only **raise** the rate the sale would otherwise earn
              — the standing rate, or a live promotion covering this sale.
              A lower value is `422 rate_below_advertised`, with the
              advertised rate in
              `error.meta.advertised_cashback_rate_percent`. The advertised
              rate is a public promise to the customer;
            - it must be priced by the platform's active fee schedule. A
              rate above its ceiling is `422 rate_not_priced`, with the
              ceiling in `error.meta.ceiling_percent`.

            With `lines`, the override becomes the rate of every line that
            would otherwise price at the standing rate (the `category:
            null` bucket). Category overrides and exclusions are untouched,
            and a live promotion still lifts any line it would pay more on
            — no line ever earns less than it would have without the
            override.
          examples: ['5.00', 5]
        branch_id:
          type: ['integer', 'null']
          format: int64
          description: |
            Optional branch, from the ids issued at onboarding. Must belong
            to the authenticated merchant, else `validation_failed`.
        lines:
          type: array
          minItems: 1
          maxItems: 100
          description: |
            **Optional line-item split** for stores with product-category
            rates (`GET /v1/merchants/me/product-categories`). Omit it and
            the whole `eligible_amount` earns the standing rate, exactly as
            before — sending `lines` is never required.

            Each line is `{category, amount_laari}`: `category` is one of
            the merchant's active category slugs, or **`null` for the
            default "everything else" bucket** (standing rate). Rules:

            - amounts are laari integers ≥ 1 and **must sum to exactly
              `eligible_amount`** (`422 lines_sum_mismatch`);
            - each category — and the null default — may appear at most
              once (`422 duplicate_category_line`);
            - unknown or other-merchant slugs are `422 unknown_category`;
              deactivated ones are `422 inactive_category`.

            Pricing per line (§4 ceiling rounding per line, then summed —
            totals are the sum of the stored line integers): `excluded`
            categories earn 0 (even during promotions); `rate` categories
            earn their own `cashback_rate_percent`; the default line earns
            the standing rate — or the per-sale `cashback_rate_percent`
            override, when one is sent. A live promotion covering the sale (its minimum purchase
            is judged against the WHOLE `eligible_amount`) lifts every
            non-excluded line to max(promotion rate, the line's own rate);
            per-customer promotion caps clip only the promotion-priced
            lines, in submitted order. The response echoes the priced
            `lines` with per-line integers.
          items:
            type: object
            required: [category, amount_laari]
            properties:
              category:
                type: ['string', 'null']
                description: Category slug, or null for the default (standing-rate) bucket.
              amount_laari:
                allOf:
                  - $ref: '#/components/schemas/LaariAmount'
                minimum: 1

    ProductCategory:
      type: object
      description: |
        One merchant product category as listed to vendors. `category` is
        the exact `lines[].category` value. `cashback_rate_percent` is null
        exactly when `mode` is `excluded`.
      required: [category, name_en, name_dv, mode, cashback_rate_percent]
      properties:
        category:
          type: string
          description: The immutable slug submitted in transaction lines.
        name_en:
          type: string
        name_dv:
          type: ['string', 'null']
        mode:
          type: string
          enum: [excluded, rate]
        cashback_rate_percent:
          oneOf:
            - $ref: '#/components/schemas/PercentString'
            - type: 'null'
          description: The category's override cashback rate as a 2-decimal percent string; null for excluded categories.

    TransactionLine:
      type: object
      description: |
        One priced line of a lined transaction — an immutable snapshot of
        the terms the line earned under. `priced_by` says why:
        `excluded` (earns nothing, promos included), `category` (its own
        override rate), `standing` (the default bucket, or a line whose own
        rate beat the promotion), `promotion` (lifted to the promotion
        rate; per-customer caps clip only these lines, fee following the
        reward actually granted). The transaction's `cashback_laari` /
        `fee_laari` are the SUMS of these stored integers.
      required:
        - category
        - category_name_en
        - amount_laari
        - cashback_rate_percent
        - platform_fee_percent
        - cashback_laari
        - fee_laari
        - priced_by
        - sort
      properties:
        category:
          type: ['string', 'null']
          description: The category slug as submitted (creation-time snapshot); null for the default bucket.
        category_name_en:
          type: ['string', 'null']
        amount_laari:
          $ref: '#/components/schemas/LaariAmount'
        cashback_rate_percent:
          allOf:
            - $ref: '#/components/schemas/PercentString'
          description: The rate this LINE actually earned, as a 2-decimal percent string (`"0.00"` for an excluded line).
        platform_fee_percent:
          allOf:
            - $ref: '#/components/schemas/PercentString'
          description: The platform fee tier that followed the line's rate (`"0.00"` for an excluded line).
        cashback_laari:
          $ref: '#/components/schemas/LaariAmount'
        fee_laari:
          $ref: '#/components/schemas/LaariAmount'
        priced_by:
          type: string
          enum: [excluded, category, standing, promotion]
        sort:
          type: integer
          description: Zero-based submitted position.

    Transaction:
      type: object
      description: |
        The transaction resource. Amounts are laari integers with paired
        `*_mvr` presentation strings; rates are 2-decimal percent strings
        (`PercentString`) — basis points never appear on the wire.
        `cashback_rate_percent` / `platform_fee_percent` are the terms
        FROZEN at `occurred_at`: they never change afterwards, even if the
        merchant's rate does, and a per-sale `cashback_rate_percent`
        override is frozen here exactly the same way. On zero-cashback
        outcomes (`below_minimum`, `merchant_suspended`) the frozen rate is
        still present: the row evidences the terms the sale met.
      required:
        - id
        - origin
        - invoice_no
        - state
        - reason_code
        - backdated
        - currency
        - eligible_laari
        - sale_laari
        - cashback_rate_percent
        - platform_fee_percent
        - cashback_laari
        - cashback_mvr
        - fee_laari
        - fee_mvr
        - fee_gst_laari
        - occurred_at
        - received_at
      properties:
        id:
          type: integer
          format: int64
          description: Platform transaction id. Store it — reversals address it.
        origin:
          type: string
          description: |
            How the transaction entered the platform. API-created
            transactions are `pos` when `customer_ref` was the 6-digit code,
            `api_phone` when it was a phone number.
          enum: [pos, manual, online_link, api_phone, card_linked]
        invoice_no:
          type: string
        state:
          $ref: '#/components/schemas/TransactionState'
        reason_code:
          type: ['string', 'null']
          description: Machine code qualifying the current state (see `MachineCode`), e.g. `below_minimum`, `merchant_suspended`, `backdated_final`, or the reversal reason. Rewritten by later transitions — for the permanent irreversibility fact, read `backdated`.
        backdated:
          type: boolean
          description: |
            `true` when the sale was recorded outside the merchant's
            validation window (+3 days grace). Such a transaction skipped
            the refund window, is payable immediately, and can **never** be
            reversed through this API — `POST /v1/transactions/{id}/reverse`
            answers `409 backdated_irreversible` regardless of state. A
            permanent property of the row: unlike `reason_code`, nothing
            later clears it.
        currency:
          type: string
          const: MVR
        eligible_laari:
          $ref: '#/components/schemas/LaariAmount'
        sale_laari:
          type: ['integer', 'null']
          format: int64
          description: The reference-only sale total, if supplied.
        cashback_rate_percent:
          allOf:
            - $ref: '#/components/schemas/PercentString'
          description: |
            The cashback rate this sale was priced at, frozen at
            `occurred_at` — the standing rate, a live promotion's rate, or
            the per-sale `cashback_rate_percent` override, whichever
            applied.
        platform_fee_percent:
          allOf:
            - $ref: '#/components/schemas/PercentString'
          description: The platform fee, tiered on the APPLIED cashback rate and frozen with it.
        cashback_laari:
          $ref: '#/components/schemas/LaariAmount'
        cashback_mvr:
          $ref: '#/components/schemas/MvrString'
        fee_laari:
          $ref: '#/components/schemas/LaariAmount'
        fee_mvr:
          $ref: '#/components/schemas/MvrString'
        fee_gst_laari:
          $ref: '#/components/schemas/LaariAmount'
        occurred_at:
          type: string
          format: date-time
          description: As supplied, normalised to UTC.
        received_at:
          type: string
          format: date-time
          description: When the platform received the POST (UTC).
        lines:
          type: array
          description: |
            Present ONLY on transactions created with a `lines` split: the
            priced lines, in submitted order. Absent — not empty — on
            single-rate transactions. When present,
            `cashback_rate_percent` / `platform_fee_percent` on the
            transaction are the BASE-rate snapshot (the standing rate, or
            the per-sale override when one was sent); the per-line truth is
            here, and `cashback_laari`/`fee_laari` are the sums of these
            line integers.
          items:
            $ref: '#/components/schemas/TransactionLine'

    TransactionWriteResult:
      type: object
      description: |
        Envelope for `POST /v1/transactions`. `status` names the outcome;
        `reason` (a `MachineCode`) qualifies it when cashback did not accrue
        normally. HTTP `201` means newly created with accrual; HTTP `200` is
        an idempotent replay or a recorded-without-cashback outcome.
      required: [status, reason, transaction]
      properties:
        status:
          type: string
          enum: [created, recorded_ineligible, below_minimum]
          description: |
            `created` — cashback accrued (HTTP 201, or 200 on replay).
            `recorded_ineligible` — merchant suspended; recorded, no cashback.
            `below_minimum` — under the merchant's minimum; recorded, zero cashback.
        reason:
          oneOf:
            - $ref: '#/components/schemas/MachineCode'
            - type: 'null'
          description: '`merchant_suspended`, `below_minimum`, `backdated_final`, or `null` for a clean creation.'
        transaction:
          $ref: '#/components/schemas/Transaction'

    ReverseRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          description: Why the sale is being reversed. Recorded on the transaction event and reported to the customer factually.
          enum: [customer_refund, till_void, duplicate, other]
        occurred_at:
          type: string
          description: |
            When the refund/void happened at the till. **Optional — omit it
            for now.** Same two shapes as on creation: ISO 8601 with an
            offset, or a plain wall clock read as Maldives time.
          examples: ['2026-08-15T09:30:00+05:00', '2026-08-15 09:30:00']

    ReverseResult:
      type: object
      description: |
        Envelope for `POST /v1/transactions/{id}/reverse`. `outcome`
        distinguishes an in-place reversal from a credit adjustment;
        `cause` (a `MachineCode`) says why an adjustment was needed.
        Reversals and adjustments always carry the **stored** integers —
        nothing is recomputed.
      required: [outcome, cause, adjustment, transaction]
      properties:
        outcome:
          type: string
          enum: [reversed, adjustment_created]
          description: |
            `reversed` — the transaction moved to `state: reversed`; the
            accrual was reversed in full.
            `adjustment_created` — the transaction could not be reversed in
            place; a credit adjustment was created and will be applied to
            the merchant's next settlement batch.
        cause:
          oneOf:
            - $ref: '#/components/schemas/MachineCode'
            - type: 'null'
          description: |
            Present when `outcome` is `adjustment_created`:
            `locked_in_settlement` (the line sits in a settlement batch that
            has left draft) or `already_confirmed` (the reward is confirmed
            or already paid out). `null` when `outcome` is `reversed`.
        adjustment:
          oneOf:
            - $ref: '#/components/schemas/Adjustment'
            - type: 'null'
          description: The credit adjustment, when `outcome` is `adjustment_created`; otherwise `null`.
        transaction:
          $ref: '#/components/schemas/Transaction'

    Adjustment:
      type: object
      description: |
        A post-lock/post-confirmation correction. History is never edited;
        the adjustment is applied as a credit on the merchant's next
        settlement batch. `amount_laari` is negative — the stored line total
        (cashback + fee + GST), negated.
      required: [id, transaction_id, amount_laari, amount_mvr, currency, reason_code, created_at]
      properties:
        id:
          type: integer
          format: int64
        transaction_id:
          type: integer
          format: int64
        amount_laari:
          $ref: '#/components/schemas/LaariAmount'
        amount_mvr:
          $ref: '#/components/schemas/MvrString'
        currency:
          type: string
          const: MVR
        reason_code:
          type: string
          description: The reversal reason as submitted.
        created_at:
          type: string
          format: date-time

    MerchantRate:
      type: object
      description: The merchant's current standing rate, for the till display. Advisory — the server recomputes authoritatively at `occurred_at`.
      required: [cashback_rate_percent, platform_fee_percent, currency, min_eligible_laari, pending_decrease]
      properties:
        cashback_rate_percent:
          allOf:
            - $ref: '#/components/schemas/PercentString'
          description: Current customer cashback rate, as a 2-decimal percent string.
        platform_fee_percent:
          allOf:
            - $ref: '#/components/schemas/PercentString'
          description: Current platform fee, tiered on the cashback rate.
        currency:
          type: string
          const: MVR
        min_eligible_laari:
          allOf:
            - $ref: '#/components/schemas/LaariAmount'
          description: Sales with `eligible_amount` below this record with zero cashback (`below_minimum`).
        pending_decrease:
          oneOf:
            - $ref: '#/components/schemas/PendingRateDecrease'
            - type: 'null'
          description: The scheduled decrease taking effect at 00:00 UTC+5, if one exists. Increases apply immediately and never appear here.
        active_promotion:
          allOf:
            - $ref: '#/components/schemas/ActivePromotion'
          description: |
            Present ONLY while a published promotion is live AND genuinely
            boosting (its rate above the standing rate) — the field is
            absent otherwise, so the base contract stays byte-stable for
            tills that predate promotions.

    PendingRateDecrease:
      type: object
      required: [cashback_rate_percent, platform_fee_percent, effective_at]
      properties:
        cashback_rate_percent:
          $ref: '#/components/schemas/PercentString'
        platform_fee_percent:
          $ref: '#/components/schemas/PercentString'
        effective_at:
          type: string
          format: date-time
          description: Always 00:00 UTC+5 on a following day.

    ActivePromotion:
      type: object
      description: |
        A live promotion boosting the merchant's rate right now. Advisory,
        exactly like the standing rate: the till applies `branch_id` and
        `min_purchase_laari` for DISPLAY, and the server re-resolves
        authoritatively at `occurred_at`.
      required: [cashback_rate_percent, platform_fee_percent, branch_id, min_purchase_laari, ends_at]
      properties:
        cashback_rate_percent:
          $ref: '#/components/schemas/PercentString'
        platform_fee_percent:
          $ref: '#/components/schemas/PercentString'
        branch_id:
          type: ['integer', 'null']
          format: int64
          description: The branch the promotion is scoped to; null means every branch.
        min_purchase_laari:
          allOf:
            - $ref: '#/components/schemas/LaariAmount'
          description: Minimum eligible amount for the promotion to apply; `0` when there is none.
        ends_at:
          type: string
          format: date-time

    CustomerLookupResult:
      type: object
      required: [ref, valid, masked_name]
      properties:
        ref:
          type: string
          pattern: '^\d{6}$'
          description: The ref as looked up.
        valid:
          type: boolean
          description: Whether this customer can currently earn cashback.
        masked_name:
          type: string
          description: |
            The customer's name with only the first three characters of each
            part visible (e.g. `Ais*** Moh***`) — enough for the cashier to
            confirm with the person present, nothing more.

    WebhookEvent:
      type: object
      description: |
        Common envelope for every outbound webhook delivery.

        **Signature verification** — every delivery carries
        `X-Manfaa-Signature` (lowercase hex `HMAC-SHA256` of the raw body
        with your endpoint's signing secret, issued once at endpoint
        registration), `X-Manfaa-Timestamp` (delivery-attempt time, unix
        seconds) and `X-Manfaa-Event` (the event name, for routing before
        parsing). Verify by computing the HMAC over the **raw body bytes**
        and comparing constant-time; then parse. Deduplicate by `id` —
        delivery is **at-least-once** and may be out of order. `created_at`
        is inside the signed body and is the event's authoritative time.
        A worked signature example is in the vendor integration guide.

        **Retry policy** — a delivery counts as successful on any `2xx`
        within 10 seconds. Otherwise it is retried with exponential backoff
        at approximately 1 minute, 5 minutes, 30 minutes, 2 hours, 8 hours,
        and 24 hours after the first attempt (6 retries over roughly 35
        hours). After the final failure the event is parked and surfaced to
        platform operations; it is not silently dropped. Retried deliveries
        carry the identical body (and signature) with a fresh
        `X-Manfaa-Timestamp`.
      required: [id, type, created_at, data]
      properties:
        id:
          type: string
          description: Globally unique event id (`evt_` + ULID). Deduplicate on this.
          pattern: '^evt_[0-9A-HJKMNP-TV-Z]{26}$'
        type:
          type: string
          enum:
            - merchant.rate_changed
            - merchant.suspended
            - merchant.reinstated
            - transaction.reversed
        created_at:
          type: string
          format: date-time
          description: When the event occurred (signed, authoritative).
        data:
          type: object
          description: Event-specific payload — see the per-event schemas.

    WebhookRateChangedData:
      type: object
      required: [merchant_id, cashback_rate_percent, platform_fee_percent, previous_cashback_rate_percent, previous_platform_fee_percent, effective_at]
      properties:
        merchant_id:
          type: integer
          format: int64
        cashback_rate_percent:
          $ref: '#/components/schemas/PercentString'
        platform_fee_percent:
          $ref: '#/components/schemas/PercentString'
        previous_cashback_rate_percent:
          $ref: '#/components/schemas/PercentString'
        previous_platform_fee_percent:
          oneOf:
            - $ref: '#/components/schemas/PercentString'
            - type: 'null'
          description: |
            The fee the outgoing rate was billed at. Null in the rare case
            where the outgoing rate was not priced by the fee schedule in
            force at `effective_at` (a legacy rate being rescued).
        effective_at:
          type: string
          format: date-time
          description: When the new rate takes (or took) effect — 00:00 UTC+5 next day for decreases, immediate for increases.

    WebhookSuspendedData:
      type: object
      required: [merchant_id, reason, suspended_at]
      properties:
        merchant_id:
          type: integer
          format: int64
        reason:
          type: string
          description: Why the merchant was suspended. `overdue_settlement` is the automatic day-16 suspension.
          enum: [overdue_settlement, manual]
        suspended_at:
          type: string
          format: date-time

    WebhookReinstatedData:
      type: object
      required: [merchant_id, reinstated_at]
      properties:
        merchant_id:
          type: integer
          format: int64
        reinstated_at:
          type: string
          format: date-time

    WebhookTransactionReversedData:
      type: object
      required: [transaction_id, merchant_id, invoice_no, reason, reversed_at]
      properties:
        transaction_id:
          type: integer
          format: int64
        merchant_id:
          type: integer
          format: int64
        invoice_no:
          type: string
        reason:
          type: string
          description: The reversal reason code recorded on the transition event.
        reversed_at:
          type: string
          format: date-time
