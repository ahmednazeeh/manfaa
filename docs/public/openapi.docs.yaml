                    would have earned above the minimum, and it earns 0.

                    The row is terminal at `state: reversed`.


                    This is a **200, not an error** — the sale is genuine

                    and the cashier should be told the truth, not shown a

                    failure. Do not retry it.

                    '
                  value:
                    status: below_minimum
                    reason: below_minimum
                    transaction:
                      id: 84524
                      origin: pos
                      invoice_no: INV-1004
                      state: reversed
                      reason_code: below_minimum
                      backdated: false
                      currency: MVR
                      eligible_laari: 3500
                      eligible_mvr: '35.00'
                      sale_laari: 3500
                      sale_mvr: '35.00'
                      cashback_rate_percent: '2.00'
                      platform_fee_percent: '0.75'
                      effective_cashback_rate_percent: '0.00'
                      effective_platform_fee_percent: '0.00'
                      cashback_laari: 0
                      cashback_mvr: '0.00'
                      fee_laari: 0
                      fee_mvr: '0.00'
                      fee_gst_laari: 0
                      fee_gst_mvr: '0.00'
                      occurred_at: '2026-08-15T06:12:00+00:00'
                      received_at: '2026-08-15T06:12:01+00:00'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenAbility'
        '409':
          description: 'Terminal conflict — do not retry with the same request.


            `duplicate_invoice` — this `invoice_no` already exists for the

            merchant under a *different* `Idempotency-Key`: the same sale

            arrived as two distinct requests. The existing transaction id

            is in `error.meta.transaction_id`. Treat the sale as already

            recorded.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                duplicateInvoice:
                  value:
                    error:
                      code: duplicate_invoice
                      message: Invoice INV-1001 has already been recorded for this merchant.
                      meta:
                        transaction_id: 84521
        '422':
          description: 'The request is malformed or fails a published business rule.

            Terminal — fix the request before resending (a corrected resend

            is a new write: use a fresh `Idempotency-Key`).


            Codes: `validation_failed` (shape errors — missing fields,

            non-integer amounts, an `occurred_at` that is neither ISO 8601

            nor a plain wall clock, a `cashback_rate_percent` with more

            than two decimals, unknown `branch_id`), `future_dated`

            (`occurred_at` beyond the 5-minute skew allowance),

            `customer_not_found` (unknown `customer_ref` — confirm the code

            with the customer via `GET /v1/customers/lookup`),

            `no_effective_rate` (merchant has no rate effective at

            `occurred_at` — contact the platform),

            `rate_below_advertised` (the `cashback_rate_percent` override is

            below the rate the sale already earns — an override may only

            raise it), `rate_not_priced` (the override is above the ceiling

            the platform''s fee schedule prices),

            `idempotency_key_required` (the write arrived without the

            mandatory `Idempotency-Key` header), and

            `idempotency_key_reuse_mismatch` (this `Idempotency-Key` was

            already used with a different request body — fix the till''s key

            generation; never reuse a key across different sales).


            Line-split failures (only possible when `lines` is sent):

            `conflicting_category` (a line''s `category` and `category_id`

            name different categories),

            `unknown_category` (not one of this merchant''s categories — refresh

            `GET /v1/merchants/me/product-categories`), `inactive_category`

            (the category was deactivated), `duplicate_category_line` (a

            category — or the null default — appears twice), and

            `lines_sum_mismatch` (line amounts do not sum to exactly

            `eligible_amount`).

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                idempotencyMismatch:
                  value:
                    error:
                      code: idempotency_key_reuse_mismatch
                      message: This Idempotency-Key was already used with a different request body.
                malformedOccurredAt:
                  summary: occurred_at in a shape the API does not accept
                  description: 'An offsetless wall clock (`2026-08-14 11:04:22`) is NOT

                    an error — it is read as Maldives time. This is a

                    genuinely unparseable value.

                    '
                  value:
                    error:
                      code: validation_failed
                      message: The given data was invalid.
                      errors:
                        occurred_at:
                        - The occurred_at field must be ISO 8601 with an offset, or "YYYY-MM-DD HH:MM:SS"
                          in Maldives time.
                overPreciseRate:
                  summary: cashback_rate_percent with more than 2 decimals
                  value:
                    error:
                      code: validation_failed
                      message: The given data was invalid.
                      errors:
                        cashback_rate_percent:
                        - The cashback rate percent must be a percent between 0.50 and 20.00 with at most
                          2 decimal places, for example "0.50".
                floatAmount:
                  summary: Fractional eligible_amount
                  value:
                    error:
                      code: validation_failed
                      message: The given data was invalid.
                      errors:
                        eligible_amount:
                        - The eligible_amount field must be an integer count of laari.
                futureDated:
                  value:
                    error:
                      code: future_dated
                      message: occurred_at is in the future beyond the permitted clock-skew allowance.
                customerNotFound:
                  value:
                    error:
                      code: customer_not_found
                      message: No customer matches ref "482917".
                rateBelowAdvertised:
                  summary: Override below the rate the sale already earns
                  description: 'Standing 2.00%, override "1.50": refused. The advertised

                    rate is a promise to the customer, so an override may

                    only boost. `meta` carries the rate that applies, so the

                    till can retry at or above it (with a fresh

                    `Idempotency-Key`) or simply drop the field.

                    '
                  value:
                    error:
                      code: rate_below_advertised
                      message: cashback_rate_percent 1.50% is below the 2.00% this sale already earns
                        — an override may only raise the advertised rate.
                      meta:
                        advertised_cashback_rate_percent: '2.00'
                rateNotPriced:
                  summary: Override above the platform's priced ceiling
                  value:
                    error:
                      code: rate_not_priced
                      message: The current fee schedule prices rates up to 10.00%.
                      meta:
                        ceiling_percent: '10.00'
                linesSumMismatch:
                  summary: Line amounts do not sum to eligible_amount
                  value:
                    error:
                      code: lines_sum_mismatch
                      message: Line amounts sum to 75000 laari but eligible_amount is 100000 — they must
                        be equal.
                unknownCategory:
                  value:
                    error:
                      code: unknown_category
                      message: No product category "electronics" exists for this merchant.
  /v1/transactions/{id}/reverse:
    post:
      operationId: reverseTransaction
      tags:
      - Transactions
      summary: Reverse a recorded sale
      x-required-ability: transactions:reverse
      description: "Reverses a sale — refund, till void, duplicate. Reversal reverses the\n**stored**\
        \ integers; nothing is ever recomputed from a since-changed\nrate.\n\nThe outcome depends on where\
        \ the transaction sits in its lifecycle,\nand the `200` body distinguishes them so the till can\
        \ tell them\napart:\n\n- **`outcome: reversed`** — the transaction was still pending (not\n  yet\
        \ locked into a settlement, not confirmed). It moves to\n  `state: reversed`; the accrual is reversed\
        \ in full.\n- **`outcome: adjustment_created`** — the transaction can no longer\n  be reversed\
        \ in place: its line is **locked in a settlement batch**\n  that has left draft (`cause: locked_in_settlement`),\
        \ or the reward\n  is **already confirmed or paid** (`cause: already_confirmed`). The\n  transaction\
        \ is untouched; a credit adjustment is created instead\n  and applied to the merchant's next settlement\
        \ batch. This is a\n  success, not a failure — record `adjustment.id` and move on.\n\nTerminal\
        \ states (`reversed`, `written_off`) return\n`409 invalid_state`. Note: retrying a reversal with\
        \ the **same**\n`Idempotency-Key` replays the original `200`; `invalid_state` only\nfires on a\
        \ *new* key against an already-terminal transaction.\n\n**Backdated sales cannot be reversed here\
        \ at all.** A transaction\ncreated outside the merchant's validation window (`backdated: true`,\n\
        `reason_code: backdated_final`) answers `409\nbackdated_irreversible` in **every** state — pending,\
        \ confirmed or\npaid — and no credit adjustment is created either. It was recorded\nas final and\
        \ became payable immediately; only an admin adjustment\ncan correct it. This code is deliberately\
        \ distinct from\n`invalid_state`: `invalid_state` describes the transaction's current\nposition,\
        \ while `backdated_irreversible` will never succeed on any\nretry, so route it to a human rather\
        \ than a queue.\n\nCross-merchant ids return `404 transaction_not_found` —\nindistinguishable\
        \ from a nonexistent id, deliberately.\n"
      parameters:
      - name: id
        in: path
        required: true
        description: Transaction id, as returned at creation.
        schema:
          type: integer
          format: int64
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReverseRequest'
            examples:
              refund:
                value:
                  reason: customer_refund
                  occurred_at: '2026-08-15T09:30:00+05:00'
      responses:
        '200':
          description: Reversal processed — see `outcome`.
          headers:
            Idempotency-Replay:
              $ref: '#/components/headers/IdempotencyReplay'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReverseResult'
              examples:
                reversed:
                  summary: Pending transaction reversed in place
                  value:
                    outcome: reversed
                    cause: null
                    adjustment: null
                    transaction:
                      id: 84521
                      origin: pos
                      invoice_no: INV-1001
                      state: reversed
                      reason_code: customer_refund
                      backdated: false
                      currency: MVR
                      eligible_laari: 118000
                      eligible_mvr: 1,180.00
                      sale_laari: null
                      sale_mvr: null
                      cashback_rate_percent: '2.00'
                      platform_fee_percent: '0.75'
                      effective_cashback_rate_percent: '2.00'
                      effective_platform_fee_percent: '0.75'
                      cashback_laari: 2360
                      cashback_mvr: '23.60'
                      fee_laari: 885
                      fee_mvr: '8.85'
                      fee_gst_laari: 0
                      fee_gst_mvr: '0.00'
                      occurred_at: '2026-08-14T06:04:22+00:00'
                      received_at: '2026-08-14T06:04:23+00:00'
                lockedInSettlement:
                  summary: Line locked in a non-draft settlement — credit adjustment created
                  value:
                    outcome: adjustment_created
                    cause: locked_in_settlement
                    adjustment:
                      id: 311
                      transaction_id: 84521
                      amount_laari: -3245
                      amount_mvr: '-32.45'
                      currency: MVR
                      reason_code: customer_refund
                      created_at: '2026-08-15T04:30:00+00:00'
                    transaction:
                      id: 84521
                      origin: pos
                      invoice_no: INV-1001
                      state: payable_unfunded
                      reason_code: null
                      backdated: false
                      currency: MVR
                      eligible_laari: 118000
                      eligible_mvr: 1,180.00
                      sale_laari: null
                      sale_mvr: null
                      cashback_rate_percent: '2.00'
                      platform_fee_percent: '0.75'
                      effective_cashback_rate_percent: '2.00'
                      effective_platform_fee_percent: '0.75'
                      cashback_laari: 2360
                      cashback_mvr: '23.60'
                      fee_laari: 885
