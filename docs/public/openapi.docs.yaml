openapi: 3.1.0
info:
  title: Manfaa Vendor API
  version: 1.0.0
  summary: Vendor-facing cashback ingestion API for POS systems and web merchants.
  description: "Maldives-wide cashback marketplace. POS systems and web merchants **POST**\nsales to this\
    \ API; the platform computes cashback, runs the settlement\nclock, and pays customers. There is no\
    \ polling contract — on-prem tills\nsit behind NAT, so all integration traffic is inbound to us, plus\
    \ signed\noutbound webhooks (see the *Webhooks* section) so tills never cache stale\noffers.\n\n##\
    \ Money\n\n- Every amount is an **integer count of laari** (1/100 MVR). Field names\n  carry the unit:\
    \ `eligible_amount`, `cashback_laari`. JSON numbers with a\n  fractional part are rejected with `validation_failed`\
    \ — never send\n  floats.\n- Every rate is a **2-decimal percent string**: 2% is `\"2.00\"`, the\n\
    \  platform fee `\"0.75\"`. Basis points are the platform's internal\n  representation and **never\
    \ appear in a request or a response** —\n  there is no `rate_bp` or `fee_bp` field on this API. Requests\
    \ accept\n  a rate as a string (`\"2\"`, `\"2.5\"`, `\"2.50\"`) or as a JSON number\n  (`2`, `2.5`),\
    \ with at most two decimals; more precision is\n  `validation_failed`.\n- Cashback and fee round **up**\
    \ to the next whole laari per line\n  (`ceil(eligible × rate / 100)`, computed internally in basis\
    \ points as\n  `ceil(eligible × bp / 10000)`), customer-favourable, so any nonzero\n  eligible amount\
    \ yields at least 1 laari.\n- Responses carry both the integer (`cashback_laari`) and a\n  pre-formatted\
    \ string (`cashback_mvr`, e.g. `\"4,300.25\"`) for receipt\n  and till display. The integer is the\
    \ value; the string is presentation.\n- `currency` is `MVR` only in v1.\n\n## Eligible amount\n\n\
    `eligible_amount` is **the merchant's own figure and is taken at face\nvalue** — how it is derived\
    \ (tax, service charge, excluded categories) is\nthe merchant's policy, defined in their agreement,\
    \ never recomputed or\nsecond-guessed by the API. `sale_amount` is optional, reference-only, and\n\
    never used in any computation.\n\n## Rates\n\nThe rate applied is the merchant's rate **effective\
    \ at `occurred_at`**,\nfrozen onto the transaction. The till's displayed rate is advisory; the\nserver\
    \ recomputes authoritatively. Rate *decreases* take effect only at\n00:00 (UTC+5) the next day, so\
    \ a stale till cache can only\nunder-promise, never over-promise.\n\nA sale may carry an optional\
    \ **per-sale override**,\n`cashback_rate_percent` on `POST /v1/transactions`, which prices that\n\
    one sale (a staff discount day, a goodwill boost). It may only RAISE\nthe rate the sale would otherwise\
    \ earn — below the standing rate, or\nbelow a live promotion covering the sale, is refused\n`rate_below_advertised`,\
    \ because the advertised rate is a promise to\nthe customer. A rate the platform's fee schedule cannot\
    \ price is\nrefused `rate_not_priced`. The override never changes the merchant's\nstanding rate: it\
    \ applies to that sale and nothing else.\n\nBecause it only raises, an override **equal** to the rate\
    \ the sale\nalready earns prices exactly as if the field were absent — so echoing\n`active_promotion.cashback_rate_percent`\
    \ back into a sale leaves the\npromotion in charge of it, per-customer cap included. Only a value\n\
    strictly above the advertised rate replaces it, and such a sale is\npriced by that number alone: no\
    \ promotion is stamped on it and it\nconsumes no promotional headroom.\n\n## Idempotency\n\nEvery\
    \ write requires an `Idempotency-Key` header (a missing header is\n`422 idempotency_key_required`).\
    \ Keys are scoped to the merchant\ncredential. A repeated key with an identical request body replays\
    \ the\noriginal result with HTTP `200` and the response header\n`Idempotency-Replay: true`. A repeated\
    \ key with a **different** body is\nrejected `422 idempotency_key_reuse_mismatch`. Independently,\n\
    `(merchant, invoice_no)` is unique — the same sale arriving as two\n*distinct* requests (different\
    \ keys) is rejected `409 duplicate_invoice`.\n\nUse a fresh UUID v4 per logical write. Replays for\
    \ transaction creation\nare permanent (backed by the stored row); replays for reversals are\nguaranteed\
    \ for at least 7 days after first use.\n\n**Retry rule:** on a network failure, timeout, or any `5xx`,\
    \ retry with\nthe **same** `Idempotency-Key`. Every documented `4xx` is terminal — fix\nthe request\
    \ or stop; do not blind-retry. Transient coordination codes\n(e.g. `409 idempotency_key_in_flight`,\
    \ returned while a concurrent\nrequest holding the same key is still processing) are deliberately\
    \ not\nin the registry and follow the same rule: not listed means retry with\nthe same key.\n\n##\
    \ Timestamps\n\n`occurred_at` is **optional — omit it and the sale is recorded as of\nnow**. When\
    \ you do send it, two shapes are accepted:\n\n- ISO 8601 **with an explicit offset**: `2026-08-14T11:04:22+05:00`,\n\
    \  `2026-08-14T06:04:22Z`, `2026-08-14T11:04:22+0500`. Read as sent.\n- A plain wall clock with **no\
    \ offset**: `2026-08-14 11:04:22` or\n  `2026-08-14T11:04:22`, read as **Maldives time (UTC+5)** —\
    \ so it\n  means the instant `2026-08-14T06:04:22Z`. This used to be refused,\n  because reading it\
    \ as UTC would misdate the sale by five hours and\n  freeze the wrong rate; reading it as Maldives\
    \ time answers the same\n  objection honestly, and it is what a till writing its own local clock\n\
    \  means every time.\n\nAnything else is `validation_failed`. Future-dated sales (beyond a\n5-minute\
    \ clock-skew allowance) are rejected `future_dated`. Sales older than the\nmerchant's validation window\
    \ plus 3 days are **backdated**: accepted,\nbut they skip the refund window entirely and become payable\n\
    IMMEDIATELY — `state: payable_unfunded`, `reason_code: backdated_final`,\n`backdated: true`, with\
    \ the 15-day settlement clock starting at the\nmoment of the POST, not at `occurred_at`. A backdated\
    \ sale can **never\nbe reversed through this API** (`409 backdated_irreversible`); a\ncorrection is\
    \ an admin adjustment. Send today's sales today.\nAll response timestamps are ISO 8601 UTC.\n\n##\
    \ Errors\n\nEvery error response is the envelope `{\"error\": {\"code\", \"message\"}}`,\nwith three\
    \ exceptions raised by the platform edge before the vendor API\nproper: a missing/invalid/revoked\
    \ token is `401`\n`{\"message\": \"Unauthenticated.\"}`, a valid token lacking the required\nability\
    \ is `403` `{\"message\": \"Invalid ability provided.\"}`, and\nexceeding the rate limit (120 requests/minute\
    \ per token) is `429`\n`{\"message\": \"Too Many Attempts.\"}` with a `Retry-After` header.\nEverywhere\
    \ else `code` is a stable machine code — the registry,\nincluding the non-error reason codes that\
    \ appear in `200` bodies, is\ndocumented at\n[`#/components/schemas/MachineCode`](#/components/schemas/MachineCode).\n\
    `message` is human-readable and may change; never match on it.\n\n## Sandbox\n\nA full sandbox environment\
    \ (see `servers`) provides fixture merchants,\ntest credentials, and published test customer refs,\
    \ so no vendor ever\ndebugs against production or mints real cashback doing it. Sandbox\ntokens are\
    \ issued alongside production credentials at onboarding; the\nfixture data set is published in the\
    \ vendor integration guide.\n\n## Sandbox fixtures\n\n\nRun `php artisan manfaa:sandbox` on the sandbox\
    \ host (our team runs it for\nyou at onboarding — the output below is what you receive). It is safe\
    \ to\nre-run and prints the same token every time.\n\n| Fixture | Value |\n|---|---|\n| Merchant |\
    \ **Sandbox Store** (`sandbox-store`) — minimum eligible sale `5000` laari (MVR 50), validation window\
    \ 3 days |\n| Rate | `\"2.00\"` now, with a **scheduled decrease** to `\"1.50\"` at the next 00:00\
    \ UTC+5 — so `GET /v1/merchants/me/rate` always shows a `pending_decrease` |\n| Branch | Sandbox Branch\
    \ (id printed by the command) |\n| POS vendor | Sandbox POS |\n| Token | Printed by the command. Carries\
    \ **all four abilities**. Sandbox-only. |\n\nPublished test customers:\n\n| Code | Name | Phone |\
    \ Behaviour |\n|---|---|---|---|\n| `111111` | Aisha Mohamed | +960 711-1111 | Earns normally. Lookup:\
    \ `valid: true`, `\"Ais*** Moh***\"` |\n| `222222` | Hassan Ibrahim | +960 722-2222 | Earns normally\
    \ |\n| `333333` | Mariyam Saeed | +960 733-3333 | **Suspended** — lookup answers `200` with `valid:\
    \ false`; use it to test your blocked-customer handling |\n\nExport the printed token for the examples\
    \ below:\n\n```sh\nexport MANFAA_TOKEN=\"<token printed by manfaa:sandbox>\"\nexport MANFAA_API=\"\
    https://sandbox.api.manfaa.app/api\"\n```\n\n---\n\n## Authentication\n\n\nEvery request carries a\
    \ bearer token:\n\n```\nAuthorization: Bearer <token>\n```\n\nTokens are **one per merchant per POS\
    \ vendor** and independently revocable —\na merchant switching vendors never invalidates your tokens\
    \ for other\nmerchants. Store the token server-side or in the till's secure storage; it\nis shown\
    \ exactly once (sandbox excepted).\n\nThere are two ways to get one, and they produce the same credential:\n\
    \n- **Manfaa issues it at onboarding** — the usual path when our team does the\n  integration work\
    \ for a physical store.\n- **The merchant issues it themselves** — the store's account OWNER opens\n\
    \  Settings › API access in the merchant panel, names you as the integration\n  partner, ticks the\
    \ permissions you need, and hands you the token. This is\n  the fastest route when the store already\
    \ has a POS provider: no ticket, no\n  waiting on us.\n\nAsk the merchant for exactly the abilities\
    \ you use, no more — the token\ncannot be widened later, and a narrower one is a shorter conversation\
    \ when\nsomething goes wrong. If a token leaks, the merchant revokes it on that same\nscreen and issues\
    \ a replacement; revocation takes effect on the very next\nrequest and never touches their other credentials.\n\
    \nEach token carries **abilities**, and every endpoint requires exactly one:\n\n| Ability | Grants\
    \ |\n|---|---|\n| `transactions:write` | `POST /v1/transactions` |\n| `transactions:reverse` | `POST\
    \ /v1/transactions/{id}/reverse` |\n| `rates:read` | `GET /v1/merchants/me/rate` |\n| `customers:lookup`\
    \ | `GET /v1/customers/lookup` |\n\nAuth failures are the one place you will see a plain body instead\
    \ of the\nerror envelope (§5) — they come from the auth layer, before the API proper:\n\n- Missing/invalid/revoked\
    \ token → `401` `{\"message\": \"Unauthenticated.\"}`\n- Valid token, missing ability → `403` `{\"\
    message\": \"Invalid ability provided.\"}`\n\nTokens are merchant-scoped. Every resource you touch\
    \ belongs to the token's\nmerchant; another merchant's transaction id answers `404`, deliberately\n\
    indistinguishable from a nonexistent one.\n\n**Rate limit:** 120 requests/minute per token. Exceeding\
    \ it returns `429`\n`{\"message\": \"Too Many Attempts.\"}` with a `Retry-After` header — wait and\n\
    retry (with the same `Idempotency-Key` if it was a write).\n\n---\n\n## Endpoints\n\n\n### 4.1 Record\
    \ a sale — `POST /v1/transactions`\n\nAbility: `transactions:write`. Send the sale as soon as it completes:\n\
    \n```sh\ncurl -s -X POST $MANFAA_API/v1/transactions \\\n  -H \"Authorization: Bearer $MANFAA_TOKEN\"\
    \ \\\n  -H \"Idempotency-Key: $(uuidgen)\" \\\n  -H \"Content-Type: application/json\" \\\n  -d '{\n\
    \    \"invoice_no\": \"INV-1001\",\n    \"customer_ref\": \"111111\",\n    \"eligible_amount\": 118000,\n\
    \    \"sale_amount\": 125000,\n    \"occurred_at\": \"2026-08-14T11:04:22+05:00\"\n  }'\n```\n\n-\
    \ `eligible_amount` is **your merchant's own eligible total** in laari, taken\n  at face value — how\
    \ it is derived (GST, service charge, exclusions) is the\n  merchant's agreement with Manfaa, never\
    \ recomputed by us.\n- `sale_amount` is optional, reference-only, never used in computation.\n- `occurred_at`\
    \ is **optional — omit it and we record the sale as of now**,\n  which is what a till posting a sale\
    \ as it rings it up means anyway. When\n  you do send it, two shapes are accepted:\n  - **ISO 8601\
    \ with an offset** — `2026-08-14T11:04:22+05:00`,\n    `2026-08-14T06:04:22Z`, `2026-08-14T11:04:22+0500`.\
    \ Read exactly as sent.\n  - **A plain wall clock with no offset** — `2026-08-14 11:04:22` or\n  \
    \  `2026-08-14T11:04:22` — read as **Maldives time (UTC+5)**, so it means\n    the instant `2026-08-14T06:04:22Z`.\
    \ If your till writes `date('Y-m-d\n    H:i:s')` off its own clock, just send that.\n\n  Anything\
    \ else (`15/08/2026 11:04`, a date with no time, seconds omitted)\n  is `422 validation_failed`. The\
    \ cashback rate applied is the merchant's\n  rate effective *at this instant*.\n- `cashback_rate_percent`\
    \ (optional) overrides the rate **for this sale\n  only** — see the box below.\n- `branch_id` (optional)\
    \ must be one of the merchant's branch ids from\n  onboarding.\n\n**`201` — created, cashback accrued**\
    \ (2.00% of 1,180.00, rounded up per\nline, customer-favourable):\n\n```json\n{\n  \"status\": \"\
    created\",\n  \"reason\": null,\n  \"transaction\": {\n    \"id\": 84521,\n    \"origin\": \"pos\"\
    ,\n    \"invoice_no\": \"INV-1001\",\n    \"state\": \"awaiting_validation\",\n    \"reason_code\"\
    : null,\n    \"backdated\": false,\n    \"currency\": \"MVR\",\n    \"eligible_laari\": 118000,\n\
    \    \"sale_laari\": 125000,\n    \"cashback_rate_percent\": \"2.00\",\n    \"platform_fee_percent\"\
    : \"0.75\",\n    \"cashback_laari\": 2360,\n    \"cashback_mvr\": \"23.60\",\n    \"fee_laari\": 885,\n\
    \    \"fee_mvr\": \"8.85\",\n    \"fee_gst_laari\": 0,\n    \"occurred_at\": \"2026-08-14T06:04:22+00:00\"\
    ,\n    \"received_at\": \"2026-08-14T06:04:23+00:00\"\n  }\n}\n```\n\n**Store `transaction.id` against\
    \ the invoice** — a reversal addresses it.\n\n`cashback_rate_percent` and `platform_fee_percent` are\
    \ the terms **frozen**\non this row at `occurred_at`. They never change afterwards, even if the\n\
    merchant reprices tomorrow — and a reversal reverses the stored integers,\nnever a recomputation.\n\
    \nPrint the conditional wording on the receipt: the customer *will earn*\nMVR 23.60 once the merchant\
    \ confirms — nothing is promised before then.\n\n**`200` — recorded, no cashback.** This endpoint\
    \ never rejects a well-formed\nsale for business reasons; the two no-cashback outcomes come back as\
    \ `200`\nwith a distinct `status` so the cashier always sees something truthful:\n\n*Below the merchant's\
    \ minimum* (sandbox: `eligible_amount` under `5000`):\n\n```sh\ncurl -s -X POST $MANFAA_API/v1/transactions\
    \ \\\n  -H \"Authorization: Bearer $MANFAA_TOKEN\" \\\n  -H \"Idempotency-Key: $(uuidgen)\" \\\n \
    \ -H \"Content-Type: application/json\" \\\n  -d '{\"invoice_no\":\"INV-1002\",\"customer_ref\":\"\
    111111\",\"eligible_amount\":4999,\"occurred_at\":\"2026-08-14T11:20:00+05:00\"}'\n```\n\n```json\n\
    {\n  \"status\": \"below_minimum\",\n  \"reason\": \"below_minimum\",\n  \"transaction\": {\n    \"\
    id\": 84524,\n    \"state\": \"reversed\",\n    \"reason_code\": \"below_minimum\",\n    \"eligible_laari\"\
    : 4999,\n    \"cashback_rate_percent\": \"2.00\",\n    \"platform_fee_percent\": \"0.75\",\n    \"\
    cashback_laari\": 0,\n    \"cashback_mvr\": \"0.00\",\n    \"fee_laari\": 0,\n    \"...\": \"other\
    \ transaction fields as above\"\n  }\n}\n```\n\nNot an error — do not retry. Show \"no cashback on\
    \ this sale\" at the till.\n\n*Merchant suspended* (settlement overdue past day 16 — you will have\n\
    received the `merchant.suspended` webhook first). The sandbox merchant is\nactive, so this one is\
    \ not reproducible against `sandbox-store`; the shape\nis:\n\n```json\n{\n  \"status\": \"recorded_ineligible\"\
    ,\n  \"reason\": \"merchant_suspended\",\n  \"transaction\": {\n    \"id\": 84523,\n    \"state\"\
    : \"reversed\",\n    \"reason_code\": \"merchant_suspended\",\n    \"cashback_laari\": 0,\n    \"\
    fee_laari\": 0,\n    \"cashback_rate_percent\": \"2.00\",\n    \"platform_fee_percent\": \"0.75\"\
    ,\n    \"...\": \"other transaction fields as above\"\n  }\n}\n```\n\nKeep POSTing while suspended\
    \ — sales are still recorded — but stop\nadvertising cashback until the `merchant.reinstated` webhook.\
    \ Accrual resumes\nautomatically; already-recorded ineligible sales are **not** retro-credited.\n\n\
    **`201` with `reason: \"backdated_final\"`** — a sale older than the merchant's\nvalidation window\
    \ + 3 days is **backdated**. It is accepted, but it skips the\nrefund window entirely: it arrives\
    \ in `state: \"payable_unfunded\"` with\n`\"backdated\": true`, the merchant's 15-day settlement clock\
    \ starts at the\nmoment you POST it (not at `occurred_at`), and **it can never be reversed\nthrough\
    \ this API** — `POST /v1/transactions/{id}/reverse` answers\n`409 backdated_irreversible` in every\
    \ state, and no credit adjustment is\ncreated either. Corrections are admin adjustments, arranged\
    \ with Manfaa.\n\nFlush your offline queue promptly: a queue that drains a week late turns\nordinary\
    \ sales into irreversible ones. Branch on the `backdated` boolean, not\non `reason_code` — later transitions\
    \ rewrite `reason_code`, but `backdated`\nis permanent.\n\n#### Per-sale rate override — `cashback_rate_percent`\n\
    \nA sale may carry its own rate: a staff discount day, a launch hour, a\ngoodwill boost for one customer.\
    \ Send `cashback_rate_percent` on the create\nrequest and it prices **that sale only** — the merchant's\
    \ standing rate is\nuntouched, and nothing about the next sale changes.\n\n```sh\ncurl -s -X POST\
    \ $MANFAA_API/v1/transactions \\\n  -H \"Authorization: Bearer $MANFAA_TOKEN\" \\\n  -H \"Idempotency-Key:\
    \ $(uuidgen)\" \\\n  -H \"Content-Type: application/json\" \\\n  -d '{\n    \"invoice_no\": \"INV-1006\"\
    ,\n    \"customer_ref\": \"111111\",\n    \"eligible_amount\": 118000,\n    \"cashback_rate_percent\"\
    : \"5.00\"\n  }'\n```\n\nWith the sandbox merchant's standing 2.00%, that sale is credited at 5.00%:\n\
    \n| | Rate | Worked integer | Result |\n|---|---|---|---:|\n| Cashback | `\"5.00\"` (500 bp internally)\
    \ | ceil(118000 × 500 / 10000) | **5900** laari |\n| Platform fee | `\"1.00\"` — the fee tier of the\
    \ **applied** rate | ceil(118000 × 100 / 10000) | **1180** laari |\n\n```json\n{\n  \"status\": \"\
    created\",\n  \"reason\": null,\n  \"transaction\": {\n    \"id\": 84526,\n    \"state\": \"awaiting_validation\"\
    ,\n    \"eligible_laari\": 118000,\n    \"cashback_rate_percent\": \"5.00\",\n    \"platform_fee_percent\"\
    : \"1.00\",\n    \"cashback_laari\": 5900,\n    \"cashback_mvr\": \"59.00\",\n    \"fee_laari\": 1180,\n\
    \    \"fee_mvr\": \"11.80\",\n    \"...\": \"other transaction fields as above\"\n  }\n}\n```\n\n\
    Two rules, and both are refusals rather than silent adjustments:\n\n- **An override may only raise\
    \ the rate.** Below the rate the sale would\n  otherwise earn — the standing rate, or a live promotion\
    \ covering this sale\n  — it is `422 rate_below_advertised`, with the applicable rate in\n  `error.meta.advertised_cashback_rate_percent`.\
    \ The advertised rate is a\n  public promise to the customer; a till must not be able to quietly pay\n\
    \  less than the storefront says.\n\n  Because it only ever *raises*, an override **equal** to the\
    \ rate the sale\n  already earns is accepted and changes nothing at all: the sale prices\n  exactly\
    \ as if you had not sent the field. That matters during a\n  promotion. If you echo `active_promotion.cashback_rate_percent`\
    \ from\n  `GET /v1/merchants/me/rate` back into the sale, the promotion still\n  prices it — including\
    \ its `max_cashback_per_customer_laari` cap, which is\n  part of the offer the store published. Only\
    \ a value strictly above the\n  promotion is a decision to pay more than the published offer, and\
    \ that\n  sale is then priced by your number alone: no promotion is stamped on it,\n  and it consumes\
    \ none of the customer's promotional headroom.\n\n  ```json\n  {\n    \"error\": {\n      \"code\"\
    : \"rate_below_advertised\",\n      \"message\": \"cashback_rate_percent 1.50% is below the 2.00%\
    \ this sale already earns — an override may only raise the advertised rate.\",\n      \"meta\": {\
    \ \"advertised_cashback_rate_percent\": \"2.00\" }\n    }\n  }\n  ```\n\n- **The platform must be\
    \ able to price the fee for it.** A rate above the\n  ceiling of the active fee schedule is `422 rate_not_priced`,\
    \ with the\n  ceiling in `error.meta.ceiling_percent` (sandbox: `\"10.00\"`). Nothing you\n  can fix\
    \ at the till — the merchant's plan has to be widened by Manfaa\n  first.\n\nBoth refusals are terminal\
    \ for that request: fix the value (or drop the\nfield) and resend with a **fresh** `Idempotency-Key`.\
    \ Nothing was recorded.\n\nThey apply only to a sale that actually earns cashback. On a sale that\n\
    earns none either way — a **suspended** merchant (`200\nrecorded_ineligible`) or one **below the minimum**\
    \ (`200 below_minimum`) —\nthe field is ignored rather than refused, and the sale is recorded exactly\n\
    as it would be without it, frozen at the store's standing terms with\n`cashback_laari: 0`. Ingestion\
    \ never stops for a rate that could not have\nbeen applied: the till still gets its `200` and the\
    \ cashier still sees the\ntruth.\n\n**With `lines`:** the override becomes the rate of every line\
    \ that would\notherwise price at the standing rate (the `category: null` bucket). Category\noverrides\
    \ and exclusions are untouched — an override never pays an excluded\ncategory, and never overwrites\
    \ the merchant's rate card — and a live\npromotion still lifts any line it would pay more on. No line\
    \ ever earns less\nthan it would have without the override.\n\n**A merchant account that is not trading\
    \ answers `403 forbidden_ability`** in\nthe error envelope, with the message *\"This merchant account\
    \ is not active on\nthe platform.\"* — every status except `active` and `suspended`: a closed\naccount,\
    \ and a self-signed-up store that has not completed onboarding (still\nin setup, awaiting review,\
    \ or sent back for changes). Suspended is not one of\nthem: a suspended merchant's sales are still\
    \ accepted, as\n`200 recorded_ineligible` above. Stop sending and contact us — retrying\ncannot succeed\
    \ until the account is reinstated.\n\n#### Online stores\n\nWeb checkouts use the **same endpoint,\
    \ same contract** — nothing above\nchanges. Two ways to key the customer:\n\n- **Customer code at\
    \ checkout** — ask for the 6-digit code in your checkout\n  flow and send it as `customer_ref`, exactly\
    \ like a till.\n- **Phone-keyed posting** — send the customer's Maldivian mobile as\n  `customer_ref`\
    \ instead: full `+960XXXXXXX`, or the 7-digit local form\n  (mobiles start `7` or `9`; we normalise\
    \ to `+960` E.164). Phone-keyed\n  transactions record `origin: \"api_phone\"`; the reward still lands\
    \ at\n  Pending and confirms on settlement like any other sale. An unknown phone\n  answers `422 customer_not_found`,\
    \ exactly like an unknown code.\n\nMind the mistyped-phone risk: a one-digit slip is far more likely\
    \ to be a\n*real, currently-assigned* number than a mistyped code is to be a real code,\nand it silently\
    \ credits a stranger. Prefer a verified phone from your own\naccount records over free-typed entry,\
    \ or confirm the masked name via\n`GET /v1/customers/lookup` (§4.4) before posting. A later release\
    \ will let\ncustomers reject transactions they don't recognise — until then, send a\nreversal if a\
    \ customer reports a credit that isn't theirs.\n\n#### Line-item pricing — optional `lines` for stores\
    \ with category rates\n\nSome stores price cashback **per product category**: certain categories are\n\
    excluded (earn nothing), others carry their own rate, and everything else\nearns the standing rate.\
    \ If the merchant you integrate uses categories,\nsplit the eligible total into `lines`; if not —\
    \ or if you simply don't send\n`lines` — the whole `eligible_amount` earns the standing rate exactly\
    \ as\nbefore. **Sending `lines` is never required.**\n\nEach line is `{category, amount_laari}`. `category`\
    \ is one of the\nmerchant's active slugs from `GET /v1/merchants/me/product-categories`\n(§4.5); `category:\
    \ null` is the default \"everything else\" bucket. Rules:\n\n- amounts are laari integers ≥ 1 and\
    \ must sum to **exactly**\n  `eligible_amount` → otherwise `422 lines_sum_mismatch`;\n- each category\
    \ (and the null default) at most once →\n  `422 duplicate_category_line`;\n- unknown slug → `422 unknown_category`;\
    \ deactivated →\n  `422 inactive_category`.\n\n**Worked example.** Merchant standing rate `\"5.00\"\
    `, category `veggies`\noverridden to `\"2.00\"`, category `fruits` excluded. A MVR 1,000.00 basket\n\
    split 300.00 fruits + 250.00 veggies + 450.00 other:\n\n```sh\ncurl -s -X POST $MANFAA_API/v1/transactions\
    \ \\\n  -H \"Authorization: Bearer $MANFAA_TOKEN\" \\\n  -H \"Idempotency-Key: $(uuidgen)\" \\\n \
    \ -H \"Content-Type: application/json\" \\\n  -d '{\n    \"invoice_no\": \"INV-2107\",\n    \"customer_ref\"\
    : \"111111\",\n    \"eligible_amount\": 100000,\n    \"occurred_at\": \"2026-08-15T10:30:00+05:00\"\
    ,\n    \"lines\": [\n      { \"category\": \"fruits\",  \"amount_laari\": 30000 },\n      { \"category\"\
    : \"veggies\", \"amount_laari\": 25000 },\n      { \"category\": null,      \"amount_laari\": 45000\
    \ }\n    ]\n  }'\n```\n\nEvery line rounds **up** independently (§4 ceiling), then the transaction\n\
    totals are the *sums of the line integers* — never recomputed on the whole\namount:\n\n| Line | Amount\
    \ | Rate | Cashback | Fee tier | Fee |\n|---|---:|---|---:|---|---:|\n| fruits (excluded) | 30000\
    \ | `\"0.00\"` | 0 | `\"0.00\"` | 0 |\n| veggies | 25000 | `\"2.00\"` | ceil(25000×200/10000) = **500**\
    \ | `\"0.75\"` | ceil(25000×75/10000) = **188** |\n| default | 45000 | `\"5.00\"` | ceil(45000×500/10000)\
    \ = **2250** | `\"1.00\"` | ceil(45000×100/10000) = **450** |\n| **Totals** | 100000 | | **2750**\
    \ | | **638** |\n\n(The arithmetic is shown in basis points because that is exactly how the\nplatform\
    \ computes it: `\"2.00\"` is 200 bp, and `ceil(amount × bp / 10000)` is\nthe §4 rule. On the wire\
    \ you only ever see the percent string.)\n\n```json\n{\n  \"status\": \"created\",\n  \"reason\":\
    \ null,\n  \"transaction\": {\n    \"id\": 84525,\n    \"state\": \"awaiting_validation\",\n    \"\
    eligible_laari\": 100000,\n    \"cashback_rate_percent\": \"5.00\",\n    \"platform_fee_percent\"\
    : \"1.00\",\n    \"cashback_laari\": 2750,\n    \"cashback_mvr\": \"27.50\",\n    \"fee_laari\": 638,\n\
    \    \"fee_mvr\": \"6.38\",\n    \"lines\": [\n      { \"category\": \"fruits\",  \"category_name_en\"\
    : \"Fruits\",  \"amount_laari\": 30000, \"cashback_rate_percent\": \"0.00\", \"platform_fee_percent\"\
    : \"0.00\", \"cashback_laari\": 0,    \"fee_laari\": 0,   \"priced_by\": \"excluded\", \"sort\": 0\
    \ },\n      { \"category\": \"veggies\", \"category_name_en\": \"Veggies\", \"amount_laari\": 25000,\
    \ \"cashback_rate_percent\": \"2.00\", \"platform_fee_percent\": \"0.75\", \"cashback_laari\": 500,\
    \  \"fee_laari\": 188, \"priced_by\": \"category\", \"sort\": 1 },\n      { \"category\": null,  \
    \    \"category_name_en\": null,      \"amount_laari\": 45000, \"cashback_rate_percent\": \"5.00\"\
    , \"platform_fee_percent\": \"1.00\", \"cashback_laari\": 2250, \"fee_laari\": 450, \"priced_by\"\
    : \"standing\", \"sort\": 2 }\n    ],\n    \"...\": \"other transaction fields as above\"\n  }\n}\n\
    ```\n\nNotes:\n\n- On a lined transaction, `cashback_rate_percent`/`platform_fee_percent` at\n  the\
    \ transaction level are the **base-rate snapshot** (the standing rate,\n  or your per-sale override\
    \ when you sent one); per-line truth is in `lines`\n  — each line carries the rate it actually earned,\
    \ and `priced_by` says why.\n- During a live promotion, every **non-excluded** line earns\n  max(promotion\
    \ rate, its own rate) — `priced_by: \"promotion\"` on the\n  lifted lines. Excluded categories stay\
    \ excluded even during promotions.\n  A promotion's minimum purchase is judged against the whole\n\
    \  `eligible_amount`, not per line. Per-customer promotion caps clip only\n  the promotion-priced\
    \ lines, in submitted order.\n- Reversals work unchanged — reverse the transaction by id; the stored\n\
    \  totals reverse as one.\n\n### 4.2 Reverse a sale — `POST /v1/transactions/{id}/reverse`\n\nAbility:\
    \ `transactions:reverse`.\n\n> **Contractual obligation, not best-effort.** Under the vendor integration\n\
    > agreement you MUST send a reversal for every refunded, voided, or\n> duplicated sale you previously\
    \ POSTed. Without it, a refunded sale keeps\n> its cashback, the merchant is billed for it, and every\
    \ till error runs in\n> the merchant's favour. Wire this into your refund/void flow, with the same\n\
    > persist-then-send queue you use for sales.\n\n```sh\ncurl -s -X POST $MANFAA_API/v1/transactions/84521/reverse\
    \ \\\n  -H \"Authorization: Bearer $MANFAA_TOKEN\" \\\n  -H \"Idempotency-Key: $(uuidgen)\" \\\n \
    \ -H \"Content-Type: application/json\" \\\n  -d '{\"reason\": \"customer_refund\", \"occurred_at\"\
    : \"2026-08-15T09:30:00+05:00\"}'\n```\n\n`reason` is one of `customer_refund`, `till_void`, `duplicate`,\
    \ `other`.\n`occurred_at` follows the same rule as on creation — **optional** (omit it\nfor now),\
    \ ISO 8601 with an offset, or a plain wall clock read as Maldives\ntime.\nReversal always reverses\
    \ the **stored** integers — never recomputed, even if\nthe rate has since changed.\n\nThe `200` body's\
    \ `outcome` tells you what actually happened:\n\n**`outcome: \"reversed\"`** — the transaction was\
    \ still pending; it moved to\n`state: \"reversed\"` and the accrual was undone in full:\n\n```json\n\
    {\n  \"outcome\": \"reversed\",\n  \"cause\": null,\n  \"adjustment\": null,\n  \"transaction\": {\
    \ \"id\": 84521, \"state\": \"reversed\", \"reason_code\": \"customer_refund\", \"...\": \"...\" }\n\
    }\n```\n\n**`outcome: \"adjustment_created\"`** — the transaction could no longer be\nreversed in\
    \ place: its line is locked in a settlement batch that has left\ndraft (`cause: \"locked_in_settlement\"\
    `), or the reward is already confirmed\nor paid (`cause: \"already_confirmed\"`). The transaction\
    \ is untouched; a\n**credit adjustment** was created and will be netted against the merchant's\nnext\
    \ settlement batch:\n\n```json\n{\n  \"outcome\": \"adjustment_created\",\n  \"cause\": \"locked_in_settlement\"\
    ,\n  \"adjustment\": {\n    \"id\": 311,\n    \"transaction_id\": 84521,\n    \"amount_laari\": -3245,\n\
    \    \"amount_mvr\": \"-32.45\",\n    \"currency\": \"MVR\",\n    \"reason_code\": \"customer_refund\"\
    ,\n    \"created_at\": \"2026-08-15T04:30:00+00:00\"\n  },\n  \"transaction\": { \"id\": 84521, \"\
    state\": \"payable_unfunded\", \"...\": \"...\" }\n}\n```\n\n**This is a success, not a failure**\
    \ — record `adjustment.id` and move on.\nThe distinct `cause` codes exist precisely so your till can\
    \ tell \"reversed\"\nfrom \"credited on the next bill\" without guessing. Reversing the same\ntransaction\
    \ again returns the **same** adjustment, never a second one.\n\nFailure cases: a terminal transaction\
    \ (`reversed`, `written_off`) answers\n`409 invalid_state` with the current state in `error.meta.state`\
    \ (note: a\nretry with the *same* `Idempotency-Key` replays the original `200` instead —\n`invalid_state`\
    \ only fires on a new key); an unknown or cross-merchant id\nanswers `404 transaction_not_found`.\n\
    \n**Backdated sales cannot be reversed at all.** A transaction created outside\nthe merchant's validation\
    \ window (`\"backdated\": true`, `reason_code:\n\"backdated_final\"` — see §4.1) answers:\n\n```json\n\
    {\n  \"error\": {\n    \"code\": \"backdated_irreversible\",\n    \"message\": \"Transaction 84522\
    \ was credited as a backdated sale and cannot be reversed by the merchant — an admin adjustment is\
    \ required.\",\n    \"meta\": { \"state\": \"payable_unfunded\" }\n  }\n}\n```\n\nThis fires in **every**\
    \ state — pending, confirmed or paid — and creates no\ncredit adjustment. It is deliberately a different\
    \ code from `invalid_state`:\n`invalid_state` describes where the transaction is right now, while\n\
    `backdated_irreversible` will never succeed on any retry with any key. Do not\nqueue it; surface it\
    \ to a human, who arranges an adjustment with Manfaa.\n\n### 4.3 Rate for the till display — `GET\
    \ /v1/merchants/me/rate`\n\nAbility: `rates:read`.\n\n```sh\ncurl -s $MANFAA_API/v1/merchants/me/rate\
    \ \\\n  -H \"Authorization: Bearer $MANFAA_TOKEN\"\n```\n\nSandbox answer (the scheduled decrease\
    \ is part of the fixtures):\n\n```json\n{\n  \"cashback_rate_percent\": \"2.00\",\n  \"platform_fee_percent\"\
    : \"0.75\",\n  \"currency\": \"MVR\",\n  \"min_eligible_laari\": 5000,\n  \"pending_decrease\": {\n\
    \    \"cashback_rate_percent\": \"1.50\",\n    \"platform_fee_percent\": \"0.50\",\n    \"effective_at\"\
    : \"2026-08-15T00:00:00+05:00\"\n  }\n}\n```\n\nWhile a published promotion is live and beating the\
    \ standing rate, an\n`active_promotion` block appears alongside — display that as the offer:\n\n```json\n\
    {\n  \"cashback_rate_percent\": \"2.00\",\n  \"platform_fee_percent\": \"0.75\",\n  \"currency\":\
    \ \"MVR\",\n  \"min_eligible_laari\": 5000,\n  \"pending_decrease\": null,\n  \"active_promotion\"\
    : {\n    \"cashback_rate_percent\": \"5.00\",\n    \"platform_fee_percent\": \"1.00\",\n    \"branch_id\"\
    : null,\n    \"min_purchase_laari\": 10000,\n    \"ends_at\": \"2026-08-20T00:00:00+05:00\"\n  }\n\
    }\n```\n\nWhat you display is **advisory** — the server always recomputes at\n`occurred_at`. Rate\
    \ *decreases* take effect only at 00:00 UTC+5 the next day\n(that is what `pending_decrease` announces);\
    \ increases apply immediately. A\nstale cache can therefore only **under**-promise, never over-promise.\
    \ Refresh\non the `merchant.rate_changed` webhook rather than polling. A merchant with\nno configured\
    \ rate answers `422 no_effective_rate`.\n\n### 4.4 Confirm a customer — `GET /v1/customers/lookup`\n\
    \nAbility: `customers:lookup`. The customer shows a 6-digit code (digits or\nQR); confirm the masked\
    \ name **with the person at the till** before crediting\n— phone numbers get recycled in the Maldives,\
    \ and a typo credits a stranger.\n\n```sh\ncurl -s \"$MANFAA_API/v1/customers/lookup?ref=111111\"\
    \ \\\n  -H \"Authorization: Bearer $MANFAA_TOKEN\"\n```\n\n```json\n{ \"ref\": \"111111\", \"valid\"\
    : true, \"name\": \"Aisha Mohamed\", \"masked_name\": \"Ais*** Moh***\" }\n```\n\nThe mask keeps the\
    \ first three characters of each name part — enough to\nconfirm, nothing more. No balance, phone number,\
    \ or other customer data ever\ncrosses this API.\n\nA known code that cannot currently earn (sandbox:\
    \ `333333`) still answers\n`200`, with `valid: false` — show the cashier \"code exists but is blocked\"\
    .\nAn unknown code answers `404 customer_not_found`; re-read it with the\ncustomer (this is almost\
    \ always a mistyped digit).\n\n### 4.5 Product categories — `GET /v1/merchants/me/product-categories`\n\
    \nAbility: `rates:read`. The merchant's **active** product categories — the\nallowed `lines[].category`\
    \ values for line-item pricing (§4.1):\n\n```sh\ncurl -s $MANFAA_API/v1/merchants/me/product-categories\
    \ \\\n  -H \"Authorization: Bearer $MANFAA_TOKEN\"\n```\n\n```json\n{\n  \"data\": [\n    { \"category\"\
    : \"fruits\",  \"name_en\": \"Fruits\",  \"name_dv\": \"މޭވާ\",     \"mode\": \"excluded\", \"cashback_rate_percent\"\
    : null },\n    { \"category\": \"veggies\", \"name_en\": \"Veggies\", \"name_dv\": \"ތަރުކާރީ\", \"\
    mode\": \"rate\",     \"cashback_rate_percent\": \"2.00\" }\n  ]\n}\n```\n\n`category` is the exact\
    \ string to submit. `mode: \"excluded\"` lines earn\nnothing; `mode: \"rate\"` lines earn their `cashback_rate_percent`\
    \ instead of\nthe standing rate (`null` exactly when the category is excluded);\nanything else goes\
    \ on the `category: null` default line. The merchant can\nchange this list at any time — refresh it\
    \ when a POST answers\n`unknown_category` or `inactive_category` rather than caching forever. A\n\
    merchant with no categories returns an empty `data` and you simply never\nsend `lines`.\n\n---\n\n\
    ## Webhooks\n\n\nWe POST signed events to the HTTPS endpoint you register with us (one\nendpoint per\
    \ POS vendor, subscribed to the events you choose). At\nregistration you receive a signing secret\
    \ (`whsec_…`) exactly once — store it\nlike a password.\n\n| Event | When | Do |\n|---|---|---|\n\
    | `merchant.rate_changed` | Rate changed (decreases announce the next-midnight boundary) | Refresh\
    \ the till's cached rate |\n| `merchant.suspended` | Automatic day-16 suspension | Stop advertising\
    \ cashback; keep POSTing sales |\n| `merchant.reinstated` | Merchant settled and was reinstated |\
    \ Resume advertising |\n| `transaction.reversed` | Any transaction reversed — including by Manfaa\
    \ admins | Sync your local record; dedupe by `transaction_id` (your own reversals echo here too) |\n\
    \nEvery delivery carries:\n\n| Header | Meaning |\n|---|---|\n| `X-Manfaa-Signature` | Lowercase hex\
    \ `HMAC-SHA256(secret, raw_body)` |\n| `X-Manfaa-Timestamp` | Unix seconds of this delivery **attempt**\
    \ (fresh per retry, not signed) |\n| `X-Manfaa-Event` | The event name, for routing before you parse\
    \ |\n\n### Verifying the signature\n\nCompute the HMAC over the **raw request body bytes exactly as\
    \ received** —\nbefore parsing, never over a re-serialisation (your JSON library will not\nreproduce\
    \ our key order) — and compare in constant time.\n\n**Worked example.** Endpoint secret:\n\n```\n\
    whsec_sandboxSECRETsandboxSECRETsandboxSECRET000000000\n```\n\nRaw body (one line, 250 bytes, no trailing\
    \ newline):\n\n```\n{\"id\":\"evt_01J5A8Z0T2N9GQK4WMB3XVRD6H\",\"data\":{\"merchant_id\":12,\"effective_at\"\
    :\"2026-08-16T00:00:00+05:00\",\"platform_fee_percent\":\"0.50\",\"cashback_rate_percent\":\"1.50\"\
    ,\"previous_platform_fee_percent\":\"0.75\",\"previous_cashback_rate_percent\":\"2.00\"},\"type\"\
    :\"merchant.rate_changed\",\"created_at\":\"2026-08-15T16:05:11+05:00\"}\n```\n\nExpected `X-Manfaa-Signature`:\n\
    \n```\nbe5a5fe344884c02a4e0cc21fe169052d0305dac2fdaf95c25dd397c2d7f6636\n```\n\nReproduce it on your\
    \ machine:\n\n```sh\nprintf '%s' '{\"id\":\"evt_01J5A8Z0T2N9GQK4WMB3XVRD6H\",\"data\":{\"merchant_id\"\
    :12,\"effective_at\":\"2026-08-16T00:00:00+05:00\",\"platform_fee_percent\":\"0.50\",\"cashback_rate_percent\"\
    :\"1.50\",\"previous_platform_fee_percent\":\"0.75\",\"previous_cashback_rate_percent\":\"2.00\"},\"\
    type\":\"merchant.rate_changed\",\"created_at\":\"2026-08-15T16:05:11+05:00\"}' \\\n  | openssl dgst\
    \ -sha256 -hmac 'whsec_sandboxSECRETsandboxSECRETsandboxSECRET000000000'\n```\n\nPHP:\n\n```php\n\
    $computed = hash_hmac('sha256', $rawBody, $secret);          // $rawBody = file_get_contents('php://input')\n\
    $valid    = hash_equals($computed, $signatureHeader);\n```\n\nNode.js:\n\n```js\nconst crypto = require('crypto');\n\
    const computed = crypto.createHmac('sha256', secret).update(rawBody).digest('hex'); // rawBody: Buffer,\
    \ pre-parse\nconst valid = crypto.timingSafeEqual(Buffer.from(computed), Buffer.from(signatureHeader));\n\
    ```\n\nIf verification passes, parse the JSON and **deduplicate by the event `id`**\n(`evt_` + ULID)\
    \ — delivery is at-least-once and may arrive out of order.\n`created_at` inside the signed body is\
    \ the event's authoritative time; the\ntimestamp header is delivery telemetry only.\n\nAcknowledge\
    \ with any `2xx` within **10 seconds**. Do the work after\nacknowledging, not before — a slow handler\
    \ looks like a failure and triggers\na retry.\n\n---\n\n## Retry expectations\n\n\n**Your retries\
    \ to us (writes):**\n\n1. Persist the sale + its `Idempotency-Key` locally *before* the first send.\n\
    2. On network failure / timeout / any `5xx` / `429` / `idempotency_key_in_flight`:\n   retry with\
    \ the **same key**, backing off (e.g. 1 s, 5 s, 30 s, then every\n   few minutes until connectivity\
    \ returns). The replay mechanics make this\n   safe indefinitely.\n3. On any documented `4xx`: stop.\
    \ It is terminal — surface it, fix it.\n4. Sales sent late still work (the rate is resolved at `occurred_at`,\
    \ not at\n   receipt), but anything older than the validation window + 3 days lands in\n   manual\
    \ review — drain your offline queue promptly.\n\n**Our retries to you (webhooks):** a delivery that\
    \ does not get a `2xx`\nwithin 10 seconds is retried with backoff at ~1 min, 5 min, 30 min, 2 h,\n\
    8 h and 24 h after the first attempt (6 retries over ~35 hours). Retried\ndeliveries carry the identical\
    \ body and signature with a fresh\n`X-Manfaa-Timestamp`. After the final failure the event is parked\
    \ and\nsurfaced to Manfaa operations — never silently dropped — but do not rely on\nthat: monitor\
    \ your endpoint's availability.\n\n---\n\n## Go-live checklist\n\n\n- [ ] Production token held per\
    \ merchant (from us, or from the merchant's own Settings › API access), stored server-side, never\
    \ in a client bundle\n- [ ] Fresh UUID per sale, persisted before send; same key reused on retry\n\
    - [ ] `occurred_at` is omitted (meaning now), carries an explicit offset, or is a plain Maldives wall\
    \ clock — and the till clock is NTP-synced\n- [ ] `transaction.id` stored against the invoice for\
    \ reversals\n- [ ] **Reversal sent for every refund/void/duplicate** (contractual — §4.2)\n- [ ] `below_minimum`\
    \ / `recorded_ineligible` handled as recorded-no-cashback, not errors\n- [ ] `adjustment_created`\
    \ handled as success, adjustment id recorded\n- [ ] Customer name confirmed at the till before crediting\n\
    - [ ] Webhook signature verified over raw bytes, events deduped by `id`\n- [ ] Rate cache refreshed\
    \ on `merchant.rate_changed`, advertising stopped on `merchant.suspended`\n\nQuestions: **integrations@manfaa.app**.\n"
  contact:
    name: Manfaa integrations
    email: integrations@manfaa.app
servers:
- url: https://api.manfaa.app/api
  description: Production. (Domain is the PLAN §14 placeholder until the production domain is confirmed.)
- url: https://api.manfaa.app/api
  description: Sandbox — fixture merchants and test customer refs (PLAN §9.5). No real cashback is ever
    created here.
