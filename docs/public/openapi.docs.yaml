paths:
  /v1/transactions:
    post:
      operationId: createTransaction
      tags:
      - Transactions
      summary: Record a sale and accrue cashback
      x-required-ability: transactions:write
      description: "Records a sale for the authenticated merchant and accrues cashback at\nthe rate effective\
        \ at `occurred_at`. The transaction enters the\nmerchant's validation (refund) window; the 15-day\
        \ settlement clock\nstarts when that window closes.\n\n**Sending `lines[]` changes which rate\
        \ you should read back.** Each\nline prices at its own category rate — excluded earns nothing,\
        \ a\ncategory override earns its own percent, the default bucket earns\nthe standing rate — and\
        \ every line carries its own\n`cashback_rate_percent` and `platform_fee_percent` in the response.\n\
        The row-level pair stays the BASE snapshot the sale was priced\nagainst, so on a mixed basket\
        \ it deliberately does not match what\nthe sale returned; `effective_cashback_rate_percent` is\
        \ that figure.\nThe request and response selectors above are INDEPENDENT — changing\nthe request\
        \ does not change the body shown beside it — so the\ncategorised call is worked end to end here\
        \ instead, where the two\nhalves cannot drift apart.\n\n```json\n// POST /v1/transactions  — a\
        \ basket of three categories\n{\n  \"invoice_no\": \"INV-2107\",\n  \"customer_ref\": \"482917\"\
        ,\n  \"eligible_amount\": 100000,\n  \"lines\": [\n    { \"category\": \"fruits\",  \"amount_laari\"\
        : 30000 },\n    { \"category\": \"veggies\", \"amount_laari\": 25000 },\n    { \"category\": null,\
        \      \"amount_laari\": 45000 }\n  ]\n}\n```\n\nWith fruit excluded, vegetables overridden to\
        \ 2.00% and the store's\nstanding rate at 5.00%, the reply prices each line on its own terms\n\
        and totals the stored integers:\n\n```json\n{\n  \"status\": \"created\",\n  \"transaction\":\
        \ {\n    \"eligible_laari\": 100000,\n    \"eligible_mvr\": \"1,000.00\",\n\n    // The BASE terms\
        \ the sale was priced against — NOT what it earned.\n    \"cashback_rate_percent\": \"5.00\",\n\
        \    \"platform_fee_percent\": \"1.00\",\n\n    // What it actually earned: 2,750 / 100,000.\n\
        \    \"effective_cashback_rate_percent\": \"2.75\",\n    \"effective_platform_fee_percent\": \"\
        0.64\",\n\n    \"cashback_laari\": 2750, \"cashback_mvr\": \"27.50\",\n    \"fee_laari\": 638,\
        \       \"fee_mvr\": \"6.38\",\n\n    \"lines\": [\n      { \"category\": \"fruits\",  \"amount_laari\"\
        : 30000,\n        \"cashback_rate_percent\": \"0.00\", \"platform_fee_percent\": \"0.00\",\n \
        \       \"cashback_laari\": 0,    \"fee_laari\": 0,   \"priced_by\": \"excluded\" },\n      {\
        \ \"category\": \"veggies\", \"amount_laari\": 25000,\n        \"cashback_rate_percent\": \"2.00\"\
        , \"platform_fee_percent\": \"0.75\",\n        \"cashback_laari\": 500,  \"fee_laari\": 188, \"\
        priced_by\": \"category\" },\n      { \"category\": null,      \"amount_laari\": 45000,\n    \
        \    \"cashback_rate_percent\": \"5.00\", \"platform_fee_percent\": \"1.00\",\n        \"cashback_laari\"\
        : 2250, \"fee_laari\": 450, \"priced_by\": \"standing\" }\n    ]\n  }\n}\n```\n\nThree different\
        \ cashback percentages, three different fee\npercentages, one sale. `cashback_laari` is the SUM\
        \ of the lines\n(0 + 500 + 2,250), never the whole 100,000 repriced at any single\nrate — which\
        \ would have given 5,000.\n\nThis endpoint **never rejects a well-formed sale for business\nreasons**\
        \ — below-minimum sales and sales from suspended merchants\nare accepted and recorded with `cashback_laari:\
        \ 0`, a reason code,\nand a distinct `200` body, so the cashier always sees something\ntruthful.\
        \ Only malformed requests, duplicates, and auth failures are\nerrors.\n\nThe single exception\
        \ is an **unusable `cashback_rate_percent`\noverride on a sale that would earn cashback**: a rate\
        \ below the one\nthe sale would otherwise earn (`422 rate_below_advertised`) or one\nthe platform\
        \ cannot price (`422 rate_not_priced`). Those are refused\nrather than quietly ignored — the till\
        \ asked for terms we will not\nhonour, and printing a different number on the customer's receipt\n\
        would be worse than an error. Omit the field and the sale prices\nexactly as it always has. On\
        \ a sale that earns nothing either way\n(suspended merchant, below minimum) the field is ignored\
        \ rather than\nrefused, and the sale is recorded with its `200` body as usual.\n\n| HTTP | Meaning\
        \ |\n|---|---|\n| `201` | Created — cashback accrued (or held for review if stale). |\n| `200`\
        \ + `Idempotency-Replay: true` | Replay of the original result for this `Idempotency-Key`. |\n\
        | `200` `status: recorded_ineligible` | Merchant is suspended; sale recorded, **no cashback**.\
        \ |\n| `200` `status: below_minimum` | Below the merchant's minimum eligible amount; recorded,\
        \ **no cashback**. |\n| `409` | `duplicate_invoice`. |\n| `422` | Validation failure — including\
        \ a malformed or future-dated `occurred_at`, unknown `customer_ref`, an unusable `cashback_rate_percent`\
        \ override on an accruing sale, missing or mismatched `Idempotency-Key`. |\n\nA merchant account\
        \ that is **not trading** is refused\n`403 forbidden_ability` in the error envelope, with the\
        \ message\n*\"This merchant account is not active on the platform.\"* That covers\nevery status\
        \ except `active` and `suspended`: a **closed** account,\nand one that has not completed onboarding\
        \ (a self-signed-up store\nstill in setup, awaiting review, or sent back). **Suspended is NOT\n\
        one of them** — a suspended merchant's sales are still accepted, as\n`200 recorded_ineligible`\
        \ above. The credential should already be\nrevoked in the refused cases; stop sending and contact\
        \ the platform.\nRetrying cannot help until the account is reinstated.\n"
