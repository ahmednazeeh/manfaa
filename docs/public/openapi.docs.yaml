        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenAbility'
        '404':
          description: '`transaction_not_found` — the id does not exist **or belongs to

            another merchant**. The two cases are deliberately

            indistinguishable.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                notFound:
                  value:
                    error:
                      code: transaction_not_found
                      message: No transaction with id 99999.
        '409':
          description: "Two distinct codes, both terminal — do not retry either:\n\n- `invalid_state`\
            \ — the transaction is in a terminal state\n  (`reversed`, `written_off`) and cannot be reversed\
            \ again.\n- `backdated_irreversible` — the sale was recorded outside the\n  merchant's validation\
            \ window (`backdated: true`). It became\n  payable the moment it was recorded and can never\
            \ be reversed\n  by the merchant or their vendor, in any state, and no credit\n  adjustment\
            \ is created. Corrections are admin adjustments —\n  contact the platform.\n\nThe current\
            \ state is in `error.meta.state` for both.\n"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                alreadyReversed:
                  value:
                    error:
                      code: invalid_state
                      message: Transaction 84521 is already reversed.
                      meta:
                        state: reversed
                backdatedIrreversible:
                  value:
                    error:
                      code: backdated_irreversible
                      message: Transaction 84522 was credited as a backdated sale and cannot be reversed
                        by the merchant — an admin adjustment is required.
                      meta:
                        state: payable_unfunded
        '422':
          description: '`validation_failed` — missing `reason`, or an unparseable `occurred_at`; `future_dated`
            when the reversal instant is in the future.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                missingReason:
                  value:
                    error:
                      code: validation_failed
                      message: The given data was invalid.
                      errors:
                        reason:
                        - The reason field is required.
  /v1/merchants/me/rate:
    get:
      operationId: getMyRate
      tags:
      - Merchant
      summary: Current rate for the till display
      x-required-ability: rates:read
      description: 'The authenticated merchant''s current cashback rate and platform fee,

        plus any **pending scheduled decrease**. Decreases take effect only

        at 00:00 (UTC+5) the next day; increases take effect immediately, so

        `pending_decrease` is the only kind of scheduled change that can

        exist.


        The value returned here is advisory, for the till display. The

        server always recomputes authoritatively from the rate effective at

        `occurred_at`. Vendors should refresh their cache on the

        `merchant.rate_changed` webhook rather than poll.

        '
      responses:
        '200':
          description: Current rate and any pending scheduled decrease.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerchantRate'
              examples:
                steady:
                  summary: No pending change
                  value:
                    cashback_rate_percent: '2.00'
                    platform_fee_percent: '0.75'
                    currency: MVR
                    min_eligible_laari: 5000
                    has_category_overrides: false
                    pending_decrease: null
                decreaseScheduled:
                  summary: Decrease scheduled for midnight UTC+5
                  value:
                    cashback_rate_percent: '2.00'
                    platform_fee_percent: '0.75'
                    currency: MVR
                    min_eligible_laari: 5000
                    has_category_overrides: false
                    pending_decrease:
                      cashback_rate_percent: '1.50'
                      platform_fee_percent: '0.50'
                      effective_at: '2026-08-15T00:00:00+05:00'
                livePromotion:
                  summary: A live promotion boosting the standing rate
                  description: '`active_promotion` appears ONLY while a published

                    promotion is live and its rate beats the standing rate.

                    Display it as the offer; the server still resolves

