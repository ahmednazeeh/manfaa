openapi: 3.1.0
info:
  title: Manfaa Vendor API
  version: 1.0.0
  summary: Vendor-facing cashback ingestion API for POS systems and web merchants.
  description: "Maldives-wide cashback marketplace. POS systems and web merchants **POST**\nsales to this\
    \ API; the platform computes cashback, runs the settlement\nclock, and pays customers. There is no\
    \ polling contract — on-prem tills\nsit behind NAT, so all integration traffic is inbound to us, plus\
    \ signed\noutbound webhooks (see the *Webhooks* section) so tills never cache stale\noffers.\n\n##\
    \ Money\n\n- Every amount is an **integer count of laari** (1/100 MVR). Field names\n  carry the unit:\
    \ `eligible_amount`, `cashback_laari`. JSON numbers with a\n  fractional part are rejected with `validation_failed`\
    \ — never send\n  floats.\n- Every rate is a **2-decimal percent string**: 2% is `\"2.00\"`, the\n\
    \  platform fee `\"0.75\"`. Basis points are the platform's internal\n  representation and **never\
    \ appear in a request or a response** —\n  there is no `rate_bp` or `fee_bp` field on this API. Requests\
    \ accept\n  a rate as a string (`\"2\"`, `\"2.5\"`, `\"2.50\"`) or as a JSON number\n  (`2`, `2.5`),\
    \ with at most two decimals; more precision is\n  `validation_failed`.\n- Cashback and fee round **up**\
    \ to the next whole laari per line\n  (`ceil(eligible × rate / 100)`, computed internally in basis\
    \ points as\n  `ceil(eligible × bp / 10000)`), customer-favourable, so any nonzero\n  eligible amount\
    \ yields at least 1 laari.\n- Responses carry both the integer (`cashback_laari`) and a\n  pre-formatted\
    \ string (`cashback_mvr`, e.g. `\"4,300.25\"`) for receipt\n  and till display. The integer is the\
    \ value; the string is presentation.\n- `currency` is `MVR` only in v1.\n\n## Eligible amount\n\n\
    `eligible_amount` is **the merchant's own figure and is taken at face\nvalue** — how it is derived\
    \ (tax, service charge, excluded categories) is\nthe merchant's policy, defined in their agreement,\
    \ never recomputed or\nsecond-guessed by the API. `sale_amount` is optional, reference-only, and\n\
    never used in any computation.\n\n## Rates\n\nThe rate applied is the merchant's rate **effective\
    \ at `occurred_at`**,\nfrozen onto the transaction. The till's displayed rate is advisory; the\nserver\
    \ recomputes authoritatively. Rate *decreases* take effect only at\n00:00 (UTC+5) the next day, so\
    \ a stale till cache can only\nunder-promise, never over-promise.\n\nA sale may carry an optional\
    \ **per-sale override**,\n`cashback_rate_percent` on `POST /v1/transactions`, which prices that\n\
    one sale (a staff discount day, a goodwill boost). It may only RAISE\nthe rate the sale would otherwise\
    \ earn — below the standing rate, or\nbelow a live promotion covering the sale, is refused\n`rate_below_advertised`,\
    \ because the advertised rate is a promise to\nthe customer. A rate the platform's fee schedule cannot\
    \ price is\nrefused `rate_not_priced`. The override never changes the merchant's\nstanding rate: it\
    \ applies to that sale and nothing else.\n\nBecause it only raises, an override **equal** to the rate\
    \ the sale\nalready earns prices exactly as if the field were absent — so echoing\n`active_promotion.cashback_rate_percent`\
    \ back into a sale leaves the\npromotion in charge of it, per-customer cap included. Only a value\n\
    strictly above the advertised rate replaces it, and such a sale is\npriced by that number alone: no\
    \ promotion is stamped on it and it\nconsumes no promotional headroom.\n\n## Idempotency\n\nEvery\
    \ write requires an `Idempotency-Key` header (a missing header is\n`422 idempotency_key_required`).\
    \ Keys are scoped to the merchant\ncredential. A repeated key with an identical request body replays\
    \ the\noriginal result with HTTP `200` and the response header\n`Idempotency-Replay: true`. A repeated\
    \ key with a **different** body is\nrejected `422 idempotency_key_reuse_mismatch`. Independently,\n\
    `(merchant, invoice_no)` is unique — the same sale arriving as two\n*distinct* requests (different\
    \ keys) is rejected `409 duplicate_invoice`.\n\nUse a fresh UUID v4 per logical write. Replays for\
    \ transaction creation\nare permanent (backed by the stored row); replays for reversals are\nguaranteed\
    \ for at least 7 days after first use.\n\n**Retry rule:** on a network failure, timeout, or any `5xx`,\
    \ retry with\nthe **same** `Idempotency-Key`. Every documented `4xx` is terminal — fix\nthe request\
    \ or stop; do not blind-retry. Transient coordination codes\n(e.g. `409 idempotency_key_in_flight`,\
    \ returned while a concurrent\nrequest holding the same key is still processing) are deliberately\
    \ not\nin the registry and follow the same rule: not listed means retry with\nthe same key.\n\n##\
    \ Timestamps\n\n`occurred_at` is **optional — omit it and the sale is recorded as of\nnow**. When\
    \ you do send it, two shapes are accepted:\n\n- ISO 8601 **with an explicit offset**: `2026-08-14T11:04:22+05:00`,\n\
    \  `2026-08-14T06:04:22Z`, `2026-08-14T11:04:22+0500`. Read as sent.\n- A plain wall clock with **no\
    \ offset**: `2026-08-14 11:04:22` or\n  `2026-08-14T11:04:22`, read as **Maldives time (UTC+5)** —\
    \ so it\n  means the instant `2026-08-14T06:04:22Z`. This used to be refused,\n  because reading it\
    \ as UTC would misdate the sale by five hours and\n  freeze the wrong rate; reading it as Maldives\
    \ time answers the same\n  objection honestly, and it is what a till writing its own local clock\n\
    \  means every time.\n\nAnything else is `validation_failed`. Future-dated sales (beyond a\n5-minute\
    \ clock-skew allowance) are rejected `future_dated`. Sales older than the\nmerchant's validation window\
    \ plus 3 days are **backdated**: accepted,\nbut they skip the refund window entirely and become payable\n\
    IMMEDIATELY — `state: payable_unfunded`, `reason_code: backdated_final`,\n`backdated: true`, with\
    \ the 15-day settlement clock starting at the\nmoment of the POST, not at `occurred_at`. A backdated\
    \ sale can **never\nbe reversed through this API** (`409 backdated_irreversible`); a\ncorrection is\
    \ an admin adjustment. Send today's sales today.\nAll response timestamps are ISO 8601 UTC.\n\n##\
    \ Errors\n\nEvery error response is the envelope `{\"error\": {\"code\", \"message\"}}`,\nwith three\
    \ exceptions raised by the platform edge before the vendor API\nproper: a missing/invalid/revoked\
    \ token is `401`\n`{\"message\": \"Unauthenticated.\"}`, a valid token lacking the required\nability\
    \ is `403` `{\"message\": \"Invalid ability provided.\"}`, and\nexceeding the rate limit (120 requests/minute\
    \ per token) is `429`\n`{\"message\": \"Too Many Attempts.\"}` with a `Retry-After` header.\nEverywhere\
    \ else `code` is a stable machine code — the registry,\nincluding the non-error reason codes that\
    \ appear in `200` bodies, is\ndocumented at\n[`#/components/schemas/MachineCode`](#/components/schemas/MachineCode).\n\
    `message` is human-readable and may change; never match on it.\n\n## Testing\n\nThere is no separate\
    \ sandbox host at present. Integrate against\nproduction with the merchant's own credential and a\
    \ real customer code\nyou control: every sale you record can be reversed with\n`POST /v1/transactions/{id}/reverse`\
    \ while it is pending, and nothing\nis paid out before the merchant settles. The worked examples in\
    \ the\nintegration guide are computed against a fixed fixture set (a\n`2.00 %` store with a `5000`\
    \ laari minimum) so the integers can be\nchecked by hand. Ask integrations@manfaa.app for a test merchant\
    \ if you\nare not integrating for a specific store.\n\n## Authentication\n\n\nEvery request carries\
    \ a bearer token:\n\n```\nAuthorization: Bearer <token>\n```\n\nTokens are **one per merchant per\
    \ POS vendor** and independently revocable —\na merchant switching vendors never invalidates your\
    \ tokens for other\nmerchants. Store the token server-side or in the till's secure storage; it\nis\
    \ shown exactly once.\n\nThere are three ways to get one, and they all produce the same credential:\n\
    \n- **Manfaa issues it at onboarding** — the usual path when our team does the\n  integration work\
    \ for a physical store.\n- **The merchant issues it themselves** — the store's account OWNER opens\n\
    \  Settings › API access in the merchant panel, names you as the integration\n  partner, ticks the\
    \ permissions you need, and hands you the token. This is\n  the fastest route when the store already\
    \ has a POS provider: no ticket, no\n  waiting on us.\n- **The merchant approves you on a consent\
    \ screen** — see §2.1. Use this if\n  you are building a product for many Manfaa merchants rather\
    \ than\n  integrating one store; it needs a platform registration from us first.\n\nAsk the merchant\
    \ for exactly the abilities you use, no more — the token\ncannot be widened later, and a narrower\
    \ one is a shorter conversation when\nsomething goes wrong. If a token leaks, the merchant revokes\
    \ it on that same\nscreen and issues a replacement; revocation takes effect on the very next\nrequest\
    \ and never touches their other credentials.\n\nEach token carries **abilities**, and every endpoint\
    \ requires exactly one:\n\n| Ability | Grants |\n|---|---|\n| `transactions:write` | `POST /v1/transactions`\
    \ |\n| `transactions:reverse` | `POST /v1/transactions/{id}/reverse` |\n| `rates:read` | `GET /v1/merchants/me/rate`\
    \ |\n| `customers:lookup` | `GET /v1/customers/lookup` |\n\nAuth failures are the one place you will\
    \ see a plain body instead of the\nerror envelope (§5) — they come from the auth layer, before the\
    \ API proper:\n\n- Missing/invalid/revoked token → `401` `{\"message\": \"Unauthenticated.\"}`\n-\
    \ Valid token, missing ability → `403` `{\"message\": \"Invalid ability provided.\"}`\n\nTokens are\
    \ merchant-scoped. Every resource you touch belongs to the token's\nmerchant; another merchant's transaction\
    \ id answers `404`, deliberately\nindistinguishable from a nonexistent one.\n\n**Rate limit:** 120\
    \ requests/minute per token. Exceeding it returns `429`\n`{\"message\": \"Too Many Attempts.\"}` with\
    \ a `Retry-After` header — wait and\nretry (with the same `Idempotency-Key` if it was a write).\n\n\
    ### 2.1 Connect — one integration, many merchants\n\nIf your product serves many Manfaa merchants,\
    \ asking every shopkeeper to\npaste a key is the wrong shape. Instead you send them to a Manfaa screen\n\
    that says *\"IsleBooks would like to record sales and accrue cashback —\nAuthorise / Deny\"*, and\
    \ if they authorise, **your server** collects the\ntoken. The merchant never sees or handles it.\n\
    \nThe token this produces is an ordinary merchant token: same abilities, same\nendpoints, same `401`/`403`\
    \ behaviour. **It does not expire.** There is no\nrefresh token and nothing to renew — it lives until\
    \ the merchant disconnects\nyou, or until we rotate your client secret.\n\n**You need a platform registration\
    \ first.** Email\nintegrations@manfaa.app with your product name, what it does, the\npermissions you\
    \ need and your callback URL(s). A Manfaa superadmin registers\nyou and sends back a `client_id` and\
    \ a `client_secret`. Without one, use the\nper-merchant key above — it works the same and needs nothing\
    \ from us.\n\nRegistration fixes two things you cannot change at runtime:\n\n- your **callback URLs**,\
    \ matched exactly (not by prefix) and `https` only;\n- the **ceiling** on what you may ask for. A\
    \ request for anything outside it\n  is refused before the merchant is shown it.\n\nThe flow is OAuth\
    \ 2.0 authorization code with PKCE, and it is four steps:\n\n**1. Send the merchant to the consent\
    \ screen.** PKCE is required: generate a\nrandom `code_verifier` (43–128 chars), keep it, and send\
    \ its SHA-256 as\n`code_challenge`.\n\n```\nhttps://merchant.manfaa.app/connect\n  ?client_id=mfa_xxxxxxxxxxxx\n\
    \  &redirect_uri=https://islebooks.mv/manfaa/callback\n  &scope=transactions:write%20rates:read\n\
    \  &state=<your own anti-forgery value>\n  &code_challenge=<base64url(sha256(verifier))>\n  &code_challenge_method=S256\n\
    ```\n\nIf they are not signed in they will be asked to, and returned here\nafterwards.\n\n**2. They\
    \ answer.** The browser comes back to your `redirect_uri` with\neither `?code=…&state=…` or `?error=access_denied&state=…`.\
    \ Check `state`\nmatches what you sent, and treat a denial as final — do not immediately\nre-ask.\n\
    \n**3. Exchange the code, server to server.** The code is good for **60\nseconds and one use**:\n\n\
    ```bash\ncurl -X POST https://api.manfaa.app/api/v1/connect/token \\\n  -H \"Content-Type: application/json\"\
    \ \\\n  -H \"Accept: application/json\" \\\n  -d '{\n    \"grant_type\": \"authorization_code\",\n\
    \    \"client_id\": \"mfa_xxxxxxxxxxxx\",\n    \"client_secret\": \"<your secret>\",\n    \"code\"\
    : \"<the code>\",\n    \"redirect_uri\": \"https://islebooks.mv/manfaa/callback\",\n    \"code_verifier\"\
    : \"<the verifier from step 1>\"\n  }'\n```\n\n```json\n{\n  \"access_token\": \"42|xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx\"\
    ,\n  \"token_type\": \"Bearer\",\n  \"scope\": \"transactions:write rates:read\",\n  \"merchant\"\
    : { \"id\": 17, \"name\": \"Tea Plus\" }\n}\n```\n\nFailures use the OAuth error shape — `{\"error\"\
    : \"...\", \"error_description\":\n\"...\"}` — with `invalid_client` (401) for a bad `client_id`/`client_secret`,\n\
    and `invalid_grant` (400) for a code that is expired, already spent, yours\nunder a different redirect,\
    \ or presented without the matching verifier.\n\n**4. Store the token against that merchant** and\
    \ use it exactly as in §4.\n`merchant.id` in the response tells you which store you just connected.\n\
    \n**Re-authorising replaces.** If a merchant connects you again, the previous\ntoken is revoked the\
    \ moment the new one is issued. Store the new one and\ndiscard the old. Because nothing expires, this\
    \ is how a stale grant is\ncleaned up — so always overwrite, never keep both.\n\n**Disconnection is\
    \ silent.** A merchant can revoke you from Settings › API\naccess at any time, and we do not call\
    \ you when they do. Your next request\nsimply answers `401` — treat that as disconnected and stop\
    \ retrying rather\nthan as a transient fault.\n\n#### Public clients — software on the merchant's\
    \ own server\n\nA plugin (the Manfaa WooCommerce plugin is one) runs on thousands of stores,\neach\
    \ with its own callback URL, and none of them can keep a secret — the\nshop owner can read every file.\
    \ For that shape Manfaa registers a **public\nclient**, and the flow above changes in exactly three\
    \ places:\n\n- **No `client_secret`.** Omit it from step 3; PKCE is the only proof. A\n  public client\
    \ that *sends* a secret is refused `401 invalid_client` — a\n  plugin that thinks it has one is misconfigured.\n\
    - **No registered callbacks.** Send whatever callback URL your install has\n  (`https://shop.example.mv/wp-admin/admin.php?page=manfaa-cashback`).\
    \ It\n  must be `https` on a public host — private ranges, localhost and bare IPs\n  are refused before\
    \ the merchant sees anything — and it must not carry a\n  fragment. The consent screen shows its host:\
    \ *\"This will connect\n  shop.example.mv. If that is not your website, press Deny.\"* The owner's\n\
    \  approval binds that **exact** URL into the code, so step 3 must present\n  the same string.\n-\
    \ **Re-authorising replaces per store, not per merchant.** The grant\n  remembers the origin it came\
    \ from (`connected_from`, visible in the panel\n  and in `GET /v1/me`). The same store connecting\
    \ again replaces its own\n  grant; a second store of the same merchant gets its own, up to the\n \
    \ store's credential cap.\n\nAfter step 4 a plugin typically calls `GET /v1/me` to confirm which\n\
    abilities it holds, then registers its webhook with `POST /v1/webhooks`\n(§6.2) — a complete setup\
    \ with no key ever copied by hand.\n\n---\n\n\n## The full integration guide\n\nEverything above is\
    \ what you need to make a call. The rest — how money and rounding work, how rates and promotions interact,\
    \ the settlement clock, webhooks and their signatures, retry expectations and the go-live checklist\
    \ — is in the [integration guide](/docs/integration-guide).\n\nThe endpoint reference below is authoritative:\
    \ where the guide and this page ever disagree, believe this page.\n\n"
  contact:
    name: Manfaa integrations
    email: integrations@manfaa.app
servers:
- url: https://api.manfaa.app/api
  description: Production.
security:
- vendorToken: []
tags:
- name: Transactions
  description: Recording sales and sending reversals. Sending reversals for refunded or voided sales is
    a contractual obligation under the vendor integration agreement, not best-effort.
- name: Merchant
  description: Merchant configuration reads for the till.
- name: Customers
  description: Customer confirmation at the point of sale.
- name: Connect
  description: "\"Connect with Manfaa\" — the merchant approves you on a Manfaa consent\nscreen and your\
    \ software collects the token. Two kinds of client:\n\n- **Confidential platform** (one server serving\
    \ many merchants, e.g.\n  a bookkeeping SaaS): registered by Manfaa with a `client_secret`\n  and\
    \ an exact list of callback URLs. Email integrations@manfaa.app.\n- **Public client** (software on\
    \ the *merchant's own* server — the\n  Manfaa WooCommerce plugin): **no secret** and no callback list.\
    \ The\n  plugin sends its own callback URL; the consent screen shows its\n  host (\"This will connect\
    \ shop.example.mv\"); the owner's approval\n  binds that exact URL into the code. PKCE is the only\
    \ proof, and a\n  public client that sends a `client_secret` is refused. Each grant\n  remembers the\
    \ store it came from, and the same store reconnecting\n  replaces its grant while a second store of\
    \ the same merchant gets\n  its own.\n\nEither way the token that comes out is an ordinary merchant\
    \ credential\n(see `vendorToken`) — same abilities, same revocation from the panel.\n"
- name: Webhooks — POS vendors
  description: 'Signed events delivered to an endpoint owned by a **POS platform** that

    serves many merchants (a till vendor, IsleBooks). One endpoint per

    platform, registered by Manfaa when we onboard you — email

    integrations@manfaa.app. Every event carries `merchant_id`; you route

    it on your side. You hear about a merchant for as long as it holds a

    live credential issued for your platform.


    Envelope, signature and retries are identical to merchant webhooks —

    see `WebhookEvent`.

    '
- name: Webhooks — Merchants
  description: "Signed events delivered to an endpoint owned by **one store**, which\nhears only that\
    \ store's events. Two ways to register one:\n\n- the store owner types the URL into the merchant panel\n\
    \  (*Settings › API access › Webhooks*), or\n- the store's own credential calls `POST /v1/webhooks`\
    \ — the\n  no-manual-setup path for a plugin: the owner pastes one token, the\n  plugin registers\
    \ its callback URL itself.\n\nAn endpoint registered by a credential is switched off when that\ncredential\
    \ is revoked; panel-made endpoints outlive every token. Up to\n5 active endpoints per store. The signing\
    \ secret is shown exactly once\nat registration.\n\nEnvelope, signature and retries are identical\
    \ to POS-vendor webhooks —\nsee `WebhookEvent`.\n"
paths:
  /v1/transactions:
    post:
      operationId: createTransaction
      tags:
      - Transactions
      summary: Record a sale and accrue cashback
      x-required-ability: transactions:write
      description: "Records a sale for the authenticated merchant and accrues cashback at\nthe rate effective\
        \ at `occurred_at`. The transaction enters the\nmerchant's validation (refund) window; the 15-day\
        \ settlement clock\nstarts when that window closes.\n\n**Sending `lines[]` changes which rate\
        \ you should read back.** Each\nline prices at its own category rate — excluded earns nothing,\
        \ a\ncategory override earns its own percent, the default bucket earns\nthe standing rate — and\
        \ every line carries its own\n`cashback_rate_percent` and `platform_fee_percent` in the response.\n\
        The row-level pair stays the BASE snapshot the sale was priced\nagainst, so on a mixed basket\
        \ it deliberately does not match what\nthe sale returned; `effective_cashback_rate_percent` is\
        \ that figure.\nThe request and response selectors above are INDEPENDENT — changing\nthe request\
        \ does not change the body shown beside it — so the\ncategorised call is worked end to end here\
        \ instead, where the two\nhalves cannot drift apart.\n\nGet the allowed categories first — they\
        \ are the merchant's own,\nand anything not on this list is refused:\n\n```json\n// GET /v1/merchants/me/product-categories\n\
        {\n  \"data\": [\n    { \"category_id\": 41, \"category\": \"fruits\",  \"mode\": \"excluded\"\
        , \"cashback_rate_percent\": null },\n    { \"category_id\": 42, \"category\": \"veggies\", \"\
        mode\": \"rate\",     \"cashback_rate_percent\": \"2.00\" }\n  ]\n}\n```\n\nThen send the sale.\
        \ Name each line by `category_id` **or** by\n`category` — whichever your system already stores.\
        \ `null` is the\nexplicit \"everything else\" bucket.\n\n```json\n// POST /v1/transactions  —\
        \ a basket of three categories\n{\n  \"invoice_no\": \"INV-2107\",\n  \"customer_ref\": \"482917\"\
        ,\n  \"eligible_amount\": 100000,\n  \"lines\": [\n    { \"category_id\": 41, \"amount_laari\"\
        : 30000 },\n    { \"category_id\": 42, \"amount_laari\": 25000 },\n    { \"category\": null, \
        \ \"amount_laari\": 45000 }\n  ]\n}\n```\n\nWith fruit excluded, vegetables overridden to 2.00%\
        \ and the store's\nstanding rate at 5.00%, the reply prices each line on its own terms\nand totals\
        \ the stored integers:\n\n```json\n{\n  \"status\": \"created\",\n  \"transaction\": {\n    \"\
        eligible_laari\": 100000,\n    \"eligible_mvr\": \"1,000.00\",\n\n    // The BASE terms the sale\
        \ was priced against — NOT what it earned.\n    \"cashback_rate_percent\": \"5.00\",\n    \"platform_fee_percent\"\
        : \"1.00\",\n\n    // What it actually earned: 2,750 / 100,000.\n    \"effective_cashback_rate_percent\"\
        : \"2.75\",\n    \"effective_platform_fee_percent\": \"0.64\",\n\n    \"cashback_laari\": 2750,\
        \ \"cashback_mvr\": \"27.50\",\n    \"fee_laari\": 638,       \"fee_mvr\": \"6.38\",\n\n    \"\
        lines\": [\n      { \"category\": \"fruits\",  \"amount_laari\": 30000,\n        \"cashback_rate_percent\"\
        : \"0.00\", \"platform_fee_percent\": \"0.00\",\n        \"cashback_laari\": 0,    \"fee_laari\"\
        : 0,   \"priced_by\": \"excluded\" },\n      { \"category\": \"veggies\", \"amount_laari\": 25000,\n\
        \        \"cashback_rate_percent\": \"2.00\", \"platform_fee_percent\": \"0.75\",\n        \"\
        cashback_laari\": 500,  \"fee_laari\": 188, \"priced_by\": \"category\" },\n      { \"category\"\
        : null,      \"amount_laari\": 45000,\n        \"cashback_rate_percent\": \"5.00\", \"platform_fee_percent\"\
        : \"1.00\",\n        \"cashback_laari\": 2250, \"fee_laari\": 450, \"priced_by\": \"standing\"\
        \ }\n    ]\n  }\n}\n```\n\nThree different cashback percentages, three different fee\npercentages,\
        \ one sale. `cashback_laari` is the SUM of the lines\n(0 + 500 + 2,250), never the whole 100,000\
        \ repriced at any single\nrate — which would have given 5,000.\n\nThis endpoint **never rejects\
        \ a well-formed sale for business\nreasons** — below-minimum sales and sales from suspended merchants\n\
        are accepted and recorded with `cashback_laari: 0`, a reason code,\nand a distinct `200` body,\
        \ so the cashier always sees something\ntruthful. Only malformed requests, duplicates, and auth\
        \ failures are\nerrors.\n\nThe single exception is an **unusable `cashback_rate_percent`\noverride\
        \ on a sale that would earn cashback**: a rate below the one\nthe sale would otherwise earn (`422\
        \ rate_below_advertised`) or one\nthe platform cannot price (`422 rate_not_priced`). Those are\
        \ refused\nrather than quietly ignored — the till asked for terms we will not\nhonour, and printing\
        \ a different number on the customer's receipt\nwould be worse than an error. Omit the field and\
        \ the sale prices\nexactly as it always has. On a sale that earns nothing either way\n(suspended\
        \ merchant, below minimum) the field is ignored rather than\nrefused, and the sale is recorded\
        \ with its `200` body as usual.\n\n| HTTP | Meaning |\n|---|---|\n| `201` | Created — cashback\
        \ accrued (or held for review if stale). |\n| `200` + `Idempotency-Replay: true` | Replay of the\
        \ original result for this `Idempotency-Key`. |\n| `200` `status: recorded_ineligible` | Merchant\
        \ is suspended; sale recorded, **no cashback**. |\n| `200` `status: below_minimum` | Below the\
        \ merchant's minimum eligible amount; recorded, **no cashback**. |\n| `409` | `duplicate_invoice`.\
        \ |\n| `422` | Validation failure — including a malformed or future-dated `occurred_at`, unknown\
        \ `customer_ref`, an unusable `cashback_rate_percent` override on an accruing sale, missing or\
        \ mismatched `Idempotency-Key`. |\n\nA merchant account that is **not trading** is refused\n`403\
        \ forbidden_ability` in the error envelope, with the message\n*\"This merchant account is not\
        \ active on the platform.\"* That covers\nevery status except `active` and `suspended`: a **closed**\
        \ account,\nand one that has not completed onboarding (a self-signed-up store\nstill in setup,\
        \ awaiting review, or sent back). **Suspended is NOT\none of them** — a suspended merchant's sales\
        \ are still accepted, as\n`200 recorded_ineligible` above. The credential should already be\n\
        revoked in the refused cases; stop sending and contact the platform.\nRetrying cannot help until\
        \ the account is reinstated.\n"
