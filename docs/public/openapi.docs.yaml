  /v1/customers/lookup:
    get:
      operationId: lookupCustomer
      tags:
      - Customers
      summary: Confirm a customer ref at the till
      x-required-ability: customers:lookup
      description: 'Resolves a customer ref — the 6-digit customer code the customer

        shows as digits or QR, or their Maldivian mobile (`+960XXXXXXX` or

        the 7-digit local form starting `7` or `9`) — to a **masked** name

        so the cashier can confirm the right person is being credited — the

        defence against recycled phone numbers and typos crediting a

        stranger. Confirm before every phone-keyed credit: a mistyped

        mobile is a real, currently-assigned number more often than a

        mistyped code is a real code.


        `valid: true` means the customer can currently earn. A ref that

        resolves but cannot earn (customer blocked or closed) returns `200`

        with `valid: false`. An unknown ref returns `404

        customer_not_found`.


        Only the masked name is ever exposed. No balance, phone number, or

        any other customer data crosses this API.


        **Failed lookups are budgeted.** Because the ref space is small, a

        walk of it is treated as enumeration: unresolved refs are counted

        **per merchant per rolling day** — shared across every credential

        the store holds — and beyond the daily allowance every lookup for

        that merchant answers `429` `{"message": "Too Many Attempts."}`

        with `Retry-After` until the window rolls. Successful lookups are

        never counted. A till confirming refs a customer is standing there

        reading out will never approach it; a script iterating refs will.

        '
      parameters:
      - name: ref
        in: query
        required: true
        description: 'The customer''s 6-digit code as shown at the till, or their

          Maldivian mobile (`+960XXXXXXX`, or 7-digit local starting `7`

          or `9`). Remember to URL-encode `+` as `%2B`.

          '
        schema:
          type: string
          pattern: ^(\d{6}|\+960[79]\d{6}|[79]\d{6})$
        examples:
          code:
            value: '482917'
          phone:
            value: '+9607712345'
      responses:
        '200':
          description: The ref resolves; confirm the name with the customer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerLookupResult'
              examples:
                valid:
                  value:
                    ref: '482917'
                    valid: true
                    name: Aisha Mohamed
                    masked_name: Ais*** Moh***
                blocked:
                  summary: Known ref that cannot currently earn
                  value:
                    ref: '104433'
                    valid: false
                    name: Hussain Adam
                    masked_name: Hus*** Ada***
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenAbility'
        '404':
          description: '`customer_not_found` — no customer matches this ref.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                unknown:
                  value:
                    error:
                      code: customer_not_found
                      message: No customer matches ref "000000".
        '422':
          description: '`validation_failed` — `ref` missing, or neither a 6-digit code nor a Maldivian
            mobile.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                badRef:
                  value:
                    error:
                      code: validation_failed
                      message: The given data was invalid.
                      errors:
                        ref:
                        - The ref field format is invalid.
webhooks:
  merchant.rate_changed:
    post:
      operationId: webhookMerchantRateChanged
      summary: The merchant's standing rate changed
      description: 'Emitted whenever the merchant''s rate changes. For decreases,

        `effective_at` is 00:00 (UTC+5) the next day; for increases it is

        the moment of the change. Refresh the till''s cached rate on receipt

        — without this event, tills cache indefinitely and quote offers the

        platform will not honour.


        See `WebhookEvent` for the envelope, signature verification, and the

        retry policy common to all events.

        '
      parameters:
      - $ref: '#/components/parameters/WebhookSignature'
      - $ref: '#/components/parameters/WebhookTimestamp'
      - $ref: '#/components/parameters/WebhookEventName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/WebhookEvent'
              - type: object
                properties:
                  type:
                    const: merchant.rate_changed
                  data:
                    $ref: '#/components/schemas/WebhookRateChangedData'
            examples:
              decrease:
                value:
                  id: evt_01J5A8Z0T2N9GQK4WMB3XVRD6H
                  type: merchant.rate_changed
                  created_at: '2026-08-14T16:05:11+05:00'
                  data:
                    merchant_id: 12
                    cashback_rate_percent: '1.50'
                    platform_fee_percent: '0.50'
                    previous_cashback_rate_percent: '2.00'
                    previous_platform_fee_percent: '0.75'
                    effective_at: '2026-08-15T00:00:00+05:00'
      responses:
        '200':
          description: Acknowledged. Any `2xx` counts as delivered; anything else (or a 10-second timeout)
            is retried.
  merchant.suspended:
    post:
      operationId: webhookMerchantSuspended
      summary: The merchant was suspended
      description: 'Emitted when the merchant is automatically suspended (settlement

        overdue past day 16). From this moment, `POST /v1/transactions`

        returns `200 recorded_ineligible` with `reason: merchant_suspended`

        — sales are still recorded, but no cashback accrues. Tills should

        stop advertising cashback until `merchant.reinstated`.

        '
      parameters:
      - $ref: '#/components/parameters/WebhookSignature'
      - $ref: '#/components/parameters/WebhookTimestamp'
      - $ref: '#/components/parameters/WebhookEventName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/WebhookEvent'
              - type: object
                properties:
                  type:
                    const: merchant.suspended
                  data:
                    $ref: '#/components/schemas/WebhookSuspendedData'
            examples:
              suspended:
                value:
                  id: evt_01J5A9B7WQZ3JD8T2NKC5YVEMF
                  type: merchant.suspended
                  created_at: '2026-08-16T00:05:00+05:00'
                  data:
                    merchant_id: 12
                    reason: overdue_settlement
                    suspended_at: '2026-08-16T00:05:00+05:00'
      responses:
        '200':
          description: Acknowledged. Any `2xx` counts as delivered; anything else (or a 10-second timeout)
            is retried.
  merchant.reinstated:
    post:
      operationId: webhookMerchantReinstated
      summary: The merchant was reinstated
      description: 'Emitted when a suspended merchant settles and is reinstated.

        Cashback accrual resumes for sales received after

        `reinstated_at`; tills may resume advertising the offer.

        '
      parameters:
      - $ref: '#/components/parameters/WebhookSignature'
      - $ref: '#/components/parameters/WebhookTimestamp'
      - $ref: '#/components/parameters/WebhookEventName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/WebhookEvent'
              - type: object
                properties:
                  type:
                    const: merchant.reinstated
                  data:
                    $ref: '#/components/schemas/WebhookReinstatedData'
            examples:
              reinstated:
                value:
                  id: evt_01J5AB2R8XW4KE9V3PMD6ZTFNG
                  type: merchant.reinstated
                  created_at: '2026-08-18T10:12:00+05:00'
                  data:
                    merchant_id: 12
                    reinstated_at: '2026-08-18T10:12:00+05:00'
      responses:
        '200':
          description: Acknowledged. Any `2xx` counts as delivered; anything else (or a 10-second timeout)
            is retried.
  transaction.reversed:
    post:
      operationId: webhookTransactionReversed
      summary: A transaction was reversed
      description: 'Emitted whenever one of the merchant''s transactions transitions to

        `reversed` — including reversals initiated outside this API (admin

        action, dispute resolution), so the till''s local record can be kept

        in sync. Reversals the vendor itself initiated also emit this event;

        deduplicate by transaction id.

        '
      parameters:
      - $ref: '#/components/parameters/WebhookSignature'
      - $ref: '#/components/parameters/WebhookTimestamp'
      - $ref: '#/components/parameters/WebhookEventName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/WebhookEvent'
              - type: object
                properties:
                  type:
                    const: transaction.reversed
                  data:
                    $ref: '#/components/schemas/WebhookTransactionReversedData'
            examples:
              adminReversal:
                value:
                  id: evt_01J5AC9K2MHQ7FT5WNB8XVGDRP
                  type: transaction.reversed
                  created_at: '2026-08-15T14:20:00+05:00'
                  data:
                    transaction_id: 84521
                    merchant_id: 12
                    invoice_no: INV-1001
                    reason: dispute_resolved
                    reversed_at: '2026-08-15T14:20:00+05:00'
      responses:
        '200':
          description: Acknowledged. Any `2xx` counts as delivered; anything else (or a 10-second timeout)
            is retried.
components:
  securitySchemes:
    vendorToken:
      type: http
      scheme: bearer
      description: 'Per-merchant Sanctum personal access token — one token per merchant

        per POS vendor, independently revocable, so a merchant switching POS

        vendor never forces rotation across other merchants.


        Two ways a token comes into existence, both producing the same

        credential: Manfaa issues one at onboarding, or the **merchant''s own

        owner** issues one themselves from Settings › API access in the

        merchant panel, choosing the abilities below. Either way the

        plaintext is shown exactly once at issuance and never again — only

        its SHA-256 digest is stored, so a lost token is replaced, never

        recovered. The merchant can revoke any of their tokens at any time

        from the same screen; the next request with it answers `401`.


        Each token carries **abilities**; every operation declares the one

        it requires as `x-required-ability`:


        | Ability | Grants |

        |---|---|

        | `transactions:write` | `POST /v1/transactions` |

        | `transactions:reverse` | `POST /v1/transactions/{id}/reverse` |

        | `rates:read` | `GET /v1/merchants/me/rate` |

        | `customers:lookup` | `GET /v1/customers/lookup` |


        A missing or revoked token returns `401`

        `{"message": "Unauthenticated."}`; a valid token lacking the

        operation''s ability returns `403`

        `{"message": "Invalid ability provided."}` (both auth-layer bodies

        — see `AuthLayerMessage`). Tokens are merchant-scoped: every

        resource read or written belongs to the token''s merchant, and other

        merchants'' resources answer `404`. Requests are throttled at 120

        per minute **per token**; beyond that, `429`

        `{"message": "Too Many Attempts."}` with `Retry-After`.

        '
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 'Unique key for this write, generated by the till — a fresh UUID v4

        per logical operation is recommended. Scoped to the merchant

        credential. Omitting the header is `422 idempotency_key_required`.

        Repeating a key with an identical body replays the original result

        (`200` + `Idempotency-Replay: true`); repeating it with a different

        body is `422 idempotency_key_reuse_mismatch`. Retries after network

        failures or `5xx` MUST reuse the same key.

        '
      schema:
        type: string
        minLength: 1
        maxLength: 255
      example: 0a1cf047-9d35-4f26-b8a9-6f2f7c1de1a4
    WebhookSignature:
      name: X-Manfaa-Signature
      in: header
      required: true
      description: 'Lowercase hex encoding of `HMAC-SHA256(endpoint_secret, raw_body)`,

        computed over the **raw request body bytes exactly as sent** — verify

        before parsing, against the raw bytes, never a re-serialisation.

        Compare in constant time. Retried deliveries carry an identical body

        and therefore an identical signature.

        '
      schema:
        type: string
        pattern: ^[0-9a-f]{64}$
      example: 5b6c1de0f4a2b39c8e7d6f5a4b3c2d1e0f9a8b7c6d5e4f3a2b1c0d9e8f7a6b5c
    WebhookTimestamp:
      name: X-Manfaa-Timestamp
      in: header
      required: true
      description: 'Unix epoch seconds of this delivery **attempt**. Not covered by the

        signature (which is over the body alone); use it for latency

        monitoring and coarse staleness checks. Replay protection comes from

        the signed body: deduplicate by the event `id` and reject events

        whose signed `created_at` is implausibly old for your use.

        '
      schema:
        type: integer
        format: int64
      example: 1755151511
    WebhookEventName:
      name: X-Manfaa-Event
      in: header
      required: true
      description: 'The event name (equal to the body''s `type`), so receivers can route

        the delivery before parsing. Not covered by the signature — trust

        the signed `type` field for anything beyond routing.

        '
      schema:
        type: string
        enum:
        - merchant.rate_changed
        - merchant.suspended
        - merchant.reinstated
        - transaction.reversed
      example: merchant.rate_changed
  headers:
    IdempotencyReplay:
      description: 'Present (with value `true`) when this response is a replay of a

        previously processed `Idempotency-Key` rather than the result of new

        work. Absent on first processing.

        '
      schema:
        type: boolean
  responses:
    Unauthorized:
      description: 'Missing, malformed, or revoked bearer token. Raised by the auth

        layer before the vendor API proper, so the body is the bare

        `{"message"}` shape, not the error envelope.

        '
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthLayerMessage'
          examples:
            unauthorized:
              value:
                message: Unauthenticated.
    ForbiddenAbility:
      description: 'The token is valid but does not carry the ability this operation

        requires (see `x-required-ability`). Raised by the auth layer, so

        the body is the bare `{"message"}` shape, not the error envelope.

        (The one enveloped `403` is the not-active-merchant refusal on

        `POST /v1/transactions` — closed, or never approved — code

        `forbidden_ability`.)

        '
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthLayerMessage'
          examples:
            forbidden:
              value:
                message: Invalid ability provided.
  schemas:
    AuthLayerMessage:
      type: object
      description: 'The bare body shape of auth-layer and throttling failures (`401`,

        missing-ability `403`, `429`), which are raised before the vendor

        API proper and therefore do not use the error envelope.

        '
      required:
      - message
      properties:
        message:
          type: string
          description: Human-readable. Distinguish these outcomes by HTTP status, never by message text.
    MachineCode:
      type: string
      description: 'The registry of stable machine codes. Codes are contractual and

        never change meaning; messages are human-readable and may change.

        Codes appear in two places: as `error.code` in the error envelope,

        and as reason/cause values inside `200`/`201` bodies (`reason`,

        `cause`, `transaction.reason_code`).


        Note: the usual `401` and missing-ability `403` are auth-layer

        failures with the bare `{"message"}` body (see `AuthLayerMessage`)

        — the `unauthorized` and `forbidden_ability` envelope codes appear

        only on the edge paths noted below.


        | Code | Appears as | HTTP | Retry? |

        |---|---|---|---|

        | `unauthorized` | error (edge paths; the usual 401 body is `{"message": "Unauthenticated."}`)
        | 401 | After fixing credentials |

        | `forbidden_ability` | error (merchant not active — closed, or never approved; the usual missing-ability
        403 body is `{"message": "Invalid ability provided."}`) | 403 | After fixing token abilities;
        never while the merchant is not active |

        | `validation_failed` | error | 422 | Fix request; resend with a **fresh** key |

        | `idempotency_key_required` | error | 422 | Add the header; resend |

        | `idempotency_key_reuse_mismatch` | error | 422 | Never — fix key generation |

        | `future_dated` | error | 422 | Fix the till clock; resend with a fresh key |

        | `customer_not_found` | error | 422 (create) / 404 (lookup) | Re-confirm the ref with the customer
        |

        | `no_effective_rate` | error | 422 | No — contact the platform |

        | `rate_below_advertised` | error | 422 | Never with that value — an override may only raise the
        advertised rate |

        | `rate_not_priced` | error | 422 | No — the platform prices no fee for that rate |

        | `unknown_category` | error | 422 | Refresh the category list; fix the slug; fresh key |

        | `inactive_category` | error | 422 | Refresh the category list; resubmit; fresh key |

        | `duplicate_category_line` | error | 422 | Merge the duplicate lines; fresh key |

        | `lines_sum_mismatch` | error | 422 | Make line amounts sum to `eligible_amount`; fresh key |

        | `duplicate_invoice` | error | 409 | Never — sale already recorded |

        | `invalid_state` | error | 409 | Never — terminal state |

        | `backdated_irreversible` | error | 409 | Never — admin adjustment only |

        | `transaction_not_found` | error | 404 | Never |

        | `merchant_suspended` | reason (`200 recorded_ineligible`) | — | n/a — recorded, no cashback
        |

        | `below_minimum` | reason (`200 below_minimum`) | — | n/a — recorded, zero cashback |

        | `backdated_final` | reason (`201`, `state: payable_unfunded`) | — | n/a — accepted, payable
        now, irreversible |

        | `locked_in_settlement` | cause (`200 adjustment_created`) | — | n/a — adjustment created |

        | `already_confirmed` | cause (`200 adjustment_created`) | — | n/a — adjustment created |


        Transient coordination codes (e.g. `409

        idempotency_key_in_flight`) are deliberately unregistered. Anything

        not listed here — and any `5xx` — is retryable with the same

        `Idempotency-Key`.

        '
      enum:
      - unauthorized
      - forbidden_ability
      - validation_failed
      - idempotency_key_required
      - idempotency_key_reuse_mismatch
      - future_dated
      - customer_not_found
      - no_effective_rate
      - rate_below_advertised
      - rate_not_priced
      - unknown_category
      - inactive_category
      - duplicate_category_line
      - lines_sum_mismatch
      - duplicate_invoice
      - invalid_state
      - backdated_irreversible
      - transaction_not_found
      - merchant_suspended
      - below_minimum
      - backdated_final
      - locked_in_settlement
      - already_confirmed
    Error:
      type: object
      description: 'The error envelope, identical on every non-2xx response except the

        auth-layer `401`/`403` and throttling `429` (see

        `AuthLayerMessage`): `{"error": {"code", "message"}}`. Match on

        `code`, never on `message`. `errors` (per-field messages) is

        present only with `validation_failed`; `meta` carries optional

        machine-readable context (e.g. the existing `transaction_id` on

        `duplicate_invoice`, the current `state` on `invalid_state` and

        `backdated_irreversible`).

        '
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              $ref: '#/components/schemas/MachineCode'
            message:
              type: string
              description: Human-readable, subject to change. Never match on it.
            errors:
              type: object
              description: Per-field validation messages. Present only when `code` is `validation_failed`.
              additionalProperties:
                type: array
                items:
                  type: string
            meta:
              type: object
              description: Optional machine-readable context for this failure mode.
              additionalProperties: true
    LaariAmount:
      type: integer
      format: int64
      description: An integer count of laari (1/100 MVR). Never fractional, never a float.
    PercentString:
      type: string
      pattern: ^\d{1,2}\.\d{2}$
      description: 'A rate, as a 2-decimal percent STRING — `"2.00"`, `"0.75"`,

        `"12.50"`. Every rate on this API is quoted this way, the same

        idiom `cashback_mvr` uses for money: exact digits, no float, no

        locale. Internally the platform stores and computes rates as

        integer basis points, but **basis points never appear on the

        wire** — do not expect a `rate_bp` or `fee_bp` field anywhere.


        Read one by splitting on the decimal point (or with a decimal

        type). Never parse it into a binary float and multiply.

        '
      examples:
      - '2.00'
      - '0.75'
      - '12.50'
    PercentInput:
      description: 'A rate on the way IN: a 2-decimal percent, sent either as a string

        (`"2"`, `"2.5"`, `"2.50"`) or as a JSON number (`2`, `2.5`). At

        most two decimal places — `"2.555"` is `validation_failed`, as are

        negatives and non-numeric values. Sending a string is recommended:

        it cannot be mangled by a JSON library''s float handling.

        '
      oneOf:
      - type: string
        pattern: ^\d{1,2}(\.\d{1,2})?$
      - type: number
      examples:
      - '2.50'
      - 2.5
    MvrString:
      type: string
      pattern: ^-?\d{1,3}(,\d{3})*\.\d{2}$
      description: 'Pre-formatted MVR presentation of a laari integer, with thousands

        separators — e.g. laari `430025` is `"4,300.25"`. Presentation only;

        the paired `*_laari` integer is the value.

        '
    TransactionState:
      type: string
      description: 'Internal transaction state (PLAN §6). The customer-facing status is

        deliberately simpler; for the till, everything up to

        `payable_unfunded`/`on_hold` is "pending", `confirmed`/`paid` are

        final, `reversed`/`written_off` are terminal negatives.


        | State | Meaning |

        |---|---|

        | `tracked` | POST received, not yet validated |

        | `awaiting_validation` | In the refund window — settlement clock not started |

        | `payable_unfunded` | Settlement clock running |

        | `on_hold` | Fraud or dispute review |

        | `confirmed` | Settlement received and allocated |

        | `paid` | Included in a completed payout |

        | `reversed` | Voided, duplicated, invalidated, or recorded-ineligible |

        | `written_off` | Merchant never settled — 90 days past due |

        '
      enum:
      - tracked
      - awaiting_validation
      - payable_unfunded
      - on_hold
      - confirmed
      - paid
      - reversed
      - written_off
    TransactionCreateRequest:
      type: object
      required:
      - invoice_no
      - customer_ref
      - eligible_amount
      properties:
        invoice_no:
          type: string
          minLength: 1
          maxLength: 64
          description: 'The merchant''s invoice number. Unique per merchant — a second

            distinct request with the same `invoice_no` is

            `409 duplicate_invoice`.

            '
        customer_ref:
          type: string
          pattern: ^(\d{6}|\+960[79]\d{6}|[79]\d{6})$
          description: 'Who to credit — EITHER the customer''s 6-digit code (shown at the

            till as digits or QR), OR their Maldivian mobile number: full

            `+960XXXXXXX`, or the 7-digit local form (mobiles start `7` or

            `9`), normalised server-side to `+960` E.164 before lookup. The

            two spaces never collide — codes are exactly six digits, local

            mobiles exactly seven. Code-keyed transactions record

            `origin: pos`; phone-keyed record `origin: api_phone`. An

            unknown phone answers exactly like an unknown code —

            `422 customer_not_found`. Any other shape is

            `422 validation_failed`.

            '
          examples:
          - '482917'
          - '+9607712345'
          - '7712345'
        eligible_amount:
          allOf:
          - $ref: '#/components/schemas/LaariAmount'
          minimum: 1
          description: 'The merchant''s own eligible invoice total, in laari. Taken at

            face value — never recomputed by the platform. This is the only

            figure used in computation.

            '
        sale_amount:
          type:
          - integer
          - 'null'
          format: int64
          minimum: 1
          description: 'Optional full invoice total, in laari. Never used in any

            computation — kept for dispute answers, merchant analytics, and

            eligible-ratio monitoring.

            '
        occurred_at:
          type: string
          description: "When the sale happened at the till. **Optional — omit it and\nthe platform uses\
            \ NOW**, which is what a till posting a sale as\nit rings it up means anyway.\n\nTwo accepted\
            \ shapes:\n\n- **ISO 8601 with an explicit offset** —\n  `2026-08-14T11:04:22+05:00`, `2026-08-14T06:04:22Z`,\
            \ or\n  `2026-08-14T11:04:22+0500`. Read exactly as sent.\n- **A plain wall clock with NO\
            \ offset** —\n  `2026-08-14 11:04:22` or `2026-08-14T11:04:22` — read as\n  **Maldives time\
            \ (UTC+5)**, the only sensible reading of a\n  clock on a Maldivian till. `2026-08-14 11:04:22`\
            \ is therefore\n  the instant `2026-08-14T06:04:22Z`.\n\nAnything else (a date without a time,\
            \ `15/08/2026`, seconds\nomitted) is `422 validation_failed`. Future-dated values beyond\n\
            5 minutes of clock skew are `422 future_dated`. The rate\napplied is the one effective at\
            \ this instant.\n"
          examples:
          - '2026-08-14T11:04:22+05:00'
          - '2026-08-14 11:04:22'
        cashback_rate_percent:
          allOf:
          - $ref: '#/components/schemas/PercentInput'
          description: "**Optional per-sale rate override** — a rate for THIS SALE\nonly, e.g. a staff\
            \ discount day or a one-off goodwill boost.\nThe merchant's standing rate is untouched, and\
            \ the rate that\nactually applied is frozen on the transaction as always\n(`transaction.cashback_rate_percent`),\
            \ with the platform fee\nfollowing the APPLIED rate into its §4 tier.\n\nTwo rules, both refusals\
            \ rather than silent adjustments:\n\n- it may only **raise** the rate the sale would otherwise\
            \ earn\n  — the standing rate, or a live promotion covering this sale.\n  A lower value is\
            \ `422 rate_below_advertised`, with the\n  advertised rate in\n  `error.meta.advertised_cashback_rate_percent`.\
            \ The advertised\n  rate is a public promise to the customer;\n- it must be priced by the\
            \ platform's active fee schedule. A\n  rate above its ceiling is `422 rate_not_priced`, with\
            \ the\n  ceiling in `error.meta.ceiling_percent`.\n\nWith `lines`, the override becomes the\
            \ rate of every line that\nwould otherwise price at the standing rate (the `category:\nnull`\
            \ bucket). Category overrides and exclusions are untouched,\nand a live promotion still lifts\
            \ any line it would pay more on\n— no line ever earns less than it would have without the\n\
            override.\n"
          examples:
          - '5.00'
          - 5
        branch_id:
          type:
          - integer
          - 'null'
          format: int64
          description: 'Optional branch, from the ids issued at onboarding. Must belong

            to the authenticated merchant, else `validation_failed`.

            '
        lines:
          type: array
          minItems: 1
          maxItems: 100
          description: "**Optional line-item split** for stores with product-category\nrates (`GET /v1/merchants/me/product-categories`).\
            \ Omit it and\nthe whole `eligible_amount` earns the standing rate, exactly as\nbefore — sending\
            \ `lines` is never required.\n\nEach line is `{category, amount_laari}`: `category` is one\
            \ of\nthe merchant's active category slugs, or **`null` for the\ndefault \"everything else\"\
            \ bucket** (standing rate). Rules:\n\n- amounts are laari integers ≥ 1 and **must sum to exactly\n\
            \  `eligible_amount`** (`422 lines_sum_mismatch`);\n- each category — and the null default\
            \ — may appear at most\n  once (`422 duplicate_category_line`);\n- unknown or other-merchant\
            \ slugs are `422 unknown_category`;\n  deactivated ones are `422 inactive_category`.\n\nPricing\
            \ per line (§4 ceiling rounding per line, then summed —\ntotals are the sum of the stored\
            \ line integers): `excluded`\ncategories earn 0 (even during promotions); `rate` categories\n\
            earn their own `cashback_rate_percent`; the default line earns\nthe standing rate — or the\
            \ per-sale `cashback_rate_percent`\noverride, when one is sent. A live promotion covering\
            \ the sale (its minimum purchase\nis judged against the WHOLE `eligible_amount`) lifts every\n\
            non-excluded line to max(promotion rate, the line's own rate);\nper-customer promotion caps\
            \ clip only the promotion-priced\nlines, in submitted order. The response echoes the priced\n\
            `lines` with per-line integers.\n"
          items:
            type: object
            required:
            - category
            - amount_laari
            properties:
              category:
                type:
                - string
                - 'null'
                description: Category slug, or null for the default (standing-rate) bucket.
              amount_laari:
                allOf:
                - $ref: '#/components/schemas/LaariAmount'
                minimum: 1
    ProductCategory:
      type: object
      description: 'One merchant product category as listed to vendors. `category` is

        the exact `lines[].category` value. `cashback_rate_percent` is null

        exactly when `mode` is `excluded`.

        '
      required:
      - category
      - name_en
      - name_dv
      - mode
      - cashback_rate_percent
      properties:
        category:
          type: string
          description: The immutable slug submitted in transaction lines.
        name_en:
          type: string
        name_dv:
          type:
          - string
          - 'null'
        mode:
          type: string
          enum:
          - excluded
          - rate
        cashback_rate_percent:
          oneOf:
          - $ref: '#/components/schemas/PercentString'
          - type: 'null'
          description: The category's override cashback rate as a 2-decimal percent string; null for excluded
            categories.
    TransactionLine:
      type: object
      description: 'One priced line of a lined transaction — an immutable snapshot of

        the terms the line earned under. `priced_by` says why:

        `excluded` (earns nothing, promos included), `category` (its own

        override rate), `standing` (the default bucket, or a line whose own

        rate beat the promotion), `promotion` (lifted to the promotion

        rate; per-customer caps clip only these lines, fee following the

        reward actually granted). The transaction''s `cashback_laari` /

        `fee_laari` are the SUMS of these stored integers.

        '
      required:
      - category
      - category_name_en
      - amount_laari
      - cashback_rate_percent
      - platform_fee_percent
      - cashback_laari
      - fee_laari
      - priced_by
      - sort
      properties:
        category:
          type:
          - string
          - 'null'
          description: The category slug as submitted (creation-time snapshot); null for the default bucket.
        category_name_en:
          type:
          - string
          - 'null'
        amount_laari:
          $ref: '#/components/schemas/LaariAmount'
        cashback_rate_percent:
          allOf:
          - $ref: '#/components/schemas/PercentString'
          description: The rate this LINE actually earned, as a 2-decimal percent string (`"0.00"` for
            an excluded line).
        platform_fee_percent:
          allOf:
          - $ref: '#/components/schemas/PercentString'
          description: The platform fee tier that followed the line's rate (`"0.00"` for an excluded line).
        cashback_laari:
          $ref: '#/components/schemas/LaariAmount'
        fee_laari:
          $ref: '#/components/schemas/LaariAmount'
        priced_by:
          type: string
          enum:
          - excluded
          - category
          - standing
          - promotion
        sort:
          type: integer
          description: Zero-based submitted position.
    Transaction:
      type: object
      description: 'The transaction resource. Amounts are laari integers with paired

        `*_mvr` presentation strings; rates are 2-decimal percent strings

        (`PercentString`) — basis points never appear on the wire.

        `cashback_rate_percent` / `platform_fee_percent` are the terms

        FROZEN at `occurred_at`: they never change afterwards, even if the

        merchant''s rate does, and a per-sale `cashback_rate_percent`

        override is frozen here exactly the same way. On zero-cashback

        outcomes (`below_minimum`, `merchant_suspended`) the frozen rate is

        still present: the row evidences the terms the sale met.


        **Two rate pairs, and a LINED sale needs the second one.**

        `cashback_rate_percent` / `platform_fee_percent` are the BASE terms

        the sale was priced AGAINST. `effective_cashback_rate_percent` /

        `effective_platform_fee_percent` are what it actually EARNED —

        `cashback_laari / eligible_laari`, rounded half-up to the nearest

        basis point.


        On a single-rate sale the two agree. On a sale with `lines[]` they

        do not, because each line priced at its own category rate and the

        base rate applied to none of the basket as a whole: 100,000 laari

        made of 30,000 excluded + 25,000 at 2.00% + 45,000 at the 5.00%

        standing rate earns 2,750, so the base rate reads `"5.00"` while

        the sale really returned `"2.75"`. Print the per-line rates from

        `lines[]` on an itemised receipt, and the effective pair wherever

        you have room for exactly one number.

        '
      required:
      - id
      - origin
      - invoice_no
      - state
      - reason_code
      - backdated
      - currency
      - eligible_laari
      - eligible_mvr
      - sale_laari
      - sale_mvr
      - cashback_rate_percent
      - platform_fee_percent
      - effective_cashback_rate_percent
      - effective_platform_fee_percent
      - cashback_laari
      - cashback_mvr
      - fee_laari
      - fee_mvr
      - fee_gst_laari
      - fee_gst_mvr
      - occurred_at
      - received_at
      properties:
        id:
          type: integer
          format: int64
          description: Platform transaction id. Store it — reversals address it.
        origin:
          type: string
          description: 'How the transaction entered the platform. API-created

            transactions are `pos` when `customer_ref` was the 6-digit code,

            `api_phone` when it was a phone number.

            '
          enum:
          - pos
          - manual
          - online_link
          - api_phone
          - card_linked
        invoice_no:
          type: string
        state:
          $ref: '#/components/schemas/TransactionState'
        reason_code:
          type:
          - string
          - 'null'
          description: Machine code qualifying the current state (see `MachineCode`), e.g. `below_minimum`,
            `merchant_suspended`, `backdated_final`, or the reversal reason. Rewritten by later transitions
            — for the permanent irreversibility fact, read `backdated`.
        backdated:
          type: boolean
          description: '`true` when the sale was recorded outside the merchant''s

            validation window (+3 days grace). Such a transaction skipped

            the refund window, is payable immediately, and can **never** be

            reversed through this API — `POST /v1/transactions/{id}/reverse`

            answers `409 backdated_irreversible` regardless of state. A

            permanent property of the row: unlike `reason_code`, nothing

            later clears it.

            '
        currency:
          type: string
          const: MVR
        eligible_laari:
          $ref: '#/components/schemas/LaariAmount'
        eligible_mvr:
          allOf:
          - $ref: '#/components/schemas/MvrString'
          description: '`eligible_laari` preformatted for printing — "1,180.00". Every

            amount in this payload ships as BOTH: the `_laari` integer is

            the value and the only thing to compute with, the `_mvr` string

            is what goes on a receipt. Never parse the string back.

            '
        sale_laari:
          type:
          - integer
          - 'null'
          format: int64
          description: The reference-only sale total, if supplied.
        sale_mvr:
          type:
          - string
          - 'null'
          description: '`sale_laari` preformatted, or null when it was not supplied.'
        cashback_rate_percent:
          allOf:
          - $ref: '#/components/schemas/PercentString'
          description: 'The cashback rate this sale was priced at, frozen at

            `occurred_at` — the standing rate, a live promotion''s rate, or

            the per-sale `cashback_rate_percent` override, whichever

            applied.

            '
        platform_fee_percent:
          allOf:
          - $ref: '#/components/schemas/PercentString'
          description: The platform fee, tiered on the APPLIED cashback rate and frozen with it.
        effective_cashback_rate_percent:
          type:
          - string
          - 'null'
          description: 'What the sale ACTUALLY returned: `cashback_laari /

            eligible_laari` as a 2-decimal percent string, rounded half-up

            to the nearest basis point. Equal to `cashback_rate_percent` on

            a single-rate sale; DIFFERENT on a lined one, where it is the

            only honest single figure. `null` only when `eligible_laari` is

            zero — a rate on nothing is undefined, not 0%.

            '
          example: '2.75'
        effective_platform_fee_percent:
          type:
          - string
          - 'null'
          description: The same division for the fee — `fee_laari / eligible_laari`.
          example: '0.64'
        cashback_laari:
          $ref: '#/components/schemas/LaariAmount'
        cashback_mvr:
          $ref: '#/components/schemas/MvrString'
        fee_laari:
          $ref: '#/components/schemas/LaariAmount'
        fee_mvr:
          $ref: '#/components/schemas/MvrString'
        fee_gst_laari:
          $ref: '#/components/schemas/LaariAmount'
        fee_gst_mvr:
          $ref: '#/components/schemas/MvrString'
        occurred_at:
          type: string
          format: date-time
          description: As supplied, normalised to UTC.
        received_at:
          type: string
          format: date-time
          description: When the platform received the POST (UTC).
        lines:
          type: array
          description: 'Present ONLY on transactions created with a `lines` split: the

            priced lines, in submitted order. Absent — not empty — on

            single-rate transactions. When present,

            `cashback_rate_percent` / `platform_fee_percent` on the

            transaction are the BASE-rate snapshot (the standing rate, or

            the per-sale override when one was sent); the per-line truth is

            here, and `cashback_laari`/`fee_laari` are the sums of these

            line integers.

            '
          items:
            $ref: '#/components/schemas/TransactionLine'
    TransactionWriteResult:
      type: object
      description: 'Envelope for `POST /v1/transactions`. `status` names the outcome;

        `reason` (a `MachineCode`) qualifies it when cashback did not accrue

        normally. HTTP `201` means newly created with accrual; HTTP `200` is

        an idempotent replay or a recorded-without-cashback outcome.

        '
      required:
      - status
      - reason
      - transaction
      properties:
        status:
          type: string
          enum:
          - created
          - recorded_ineligible
          - below_minimum
          description: '`created` — cashback accrued (HTTP 201, or 200 on replay).

            `recorded_ineligible` — merchant suspended; recorded, no cashback.

            `below_minimum` — under the merchant''s minimum; recorded, zero cashback.

            '
        reason:
          oneOf:
          - $ref: '#/components/schemas/MachineCode'
          - type: 'null'
          description: '`merchant_suspended`, `below_minimum`, `backdated_final`, or `null` for a clean
            creation.'
        transaction:
          $ref: '#/components/schemas/Transaction'
    ReverseRequest:
      type: object
      required:
      - reason
      properties:
        reason:
          type: string
          description: Why the sale is being reversed. Recorded on the transaction event and reported
            to the customer factually.
          enum:
          - customer_refund
          - till_void
          - duplicate
          - other
        occurred_at:
          type: string
          description: 'When the refund/void happened at the till. **Optional — omit it

            for now.** Same two shapes as on creation: ISO 8601 with an

            offset, or a plain wall clock read as Maldives time.

            '
          examples:
          - '2026-08-15T09:30:00+05:00'
          - '2026-08-15 09:30:00'
    ReverseResult:
      type: object
      description: 'Envelope for `POST /v1/transactions/{id}/reverse`. `outcome`

        distinguishes an in-place reversal from a credit adjustment;

        `cause` (a `MachineCode`) says why an adjustment was needed.

        Reversals and adjustments always carry the **stored** integers —

        nothing is recomputed.

        '
      required:
      - outcome
      - cause
      - adjustment
      - transaction
      properties:
        outcome:
          type: string
          enum:
          - reversed
          - adjustment_created
          description: '`reversed` — the transaction moved to `state: reversed`; the

            accrual was reversed in full.

            `adjustment_created` — the transaction could not be reversed in

            place; a credit adjustment was created and will be applied to

            the merchant''s next settlement batch.

            '
        cause:
          oneOf:
          - $ref: '#/components/schemas/MachineCode'
          - type: 'null'
          description: 'Present when `outcome` is `adjustment_created`:

            `locked_in_settlement` (the line sits in a settlement batch that

            has left draft) or `already_confirmed` (the reward is confirmed

            or already paid out). `null` when `outcome` is `reversed`.

            '
        adjustment:
          oneOf:
          - $ref: '#/components/schemas/Adjustment'
          - type: 'null'
          description: The credit adjustment, when `outcome` is `adjustment_created`; otherwise `null`.
        transaction:
          $ref: '#/components/schemas/Transaction'
    Adjustment:
      type: object
      description: 'A post-lock/post-confirmation correction. History is never edited;

        the adjustment is applied as a credit on the merchant''s next

        settlement batch. `amount_laari` is negative — the stored line total

        (cashback + fee + GST), negated.

        '
      required:
      - id
      - transaction_id
      - amount_laari
      - amount_mvr
      - currency
      - reason_code
      - created_at
      properties:
        id:
          type: integer
          format: int64
        transaction_id:
          type: integer
          format: int64
        amount_laari:
          $ref: '#/components/schemas/LaariAmount'
        amount_mvr:
          $ref: '#/components/schemas/MvrString'
        currency:
          type: string
          const: MVR
        reason_code:
          type: string
          description: The reversal reason as submitted.
        created_at:
          type: string
          format: date-time
    MerchantRate:
      type: object
      description: The merchant's current standing rate, for the till display. Advisory — the server recomputes
        authoritatively at `occurred_at`.
      required:
      - cashback_rate_percent
      - platform_fee_percent
      - currency
      - min_eligible_laari
      - has_category_overrides
      - pending_decrease
      properties:
        cashback_rate_percent:
          allOf:
          - $ref: '#/components/schemas/PercentString'
          description: Current customer cashback rate, as a 2-decimal percent string.
        platform_fee_percent:
          allOf:
          - $ref: '#/components/schemas/PercentString'
          description: Current platform fee, tiered on the cashback rate.
        currency:
          type: string
          const: MVR
        min_eligible_laari:
          allOf:
          - $ref: '#/components/schemas/LaariAmount'
          description: Sales with `eligible_amount` below this record with zero cashback (`below_minimum`).
        has_category_overrides:
          type: boolean
          description: '`true` when this store has ACTIVE product categories — some

            products are excluded, or carry their own rate. The headline

            `cashback_rate_percent` above then applies only to what is NOT

            in one of those categories, so a till that prints it against

            the whole basket over-promises. Read

            `GET /v1/merchants/me/product-categories` and send `lines[]`

            on the sale; the per-line rates and

            `effective_cashback_rate_percent` in the response are what the

            customer actually earned.

            '
        pending_decrease:
          oneOf:
          - $ref: '#/components/schemas/PendingRateDecrease'
          - type: 'null'
          description: The scheduled decrease taking effect at 00:00 UTC+5, if one exists. Increases apply
            immediately and never appear here.
        active_promotion:
          allOf:
          - $ref: '#/components/schemas/ActivePromotion'
          description: 'Present ONLY while a published promotion is live AND genuinely

            boosting (its rate above the standing rate) — the field is

            absent otherwise, so the base contract stays byte-stable for

            tills that predate promotions.

            '
    PendingRateDecrease:
      type: object
      required:
      - cashback_rate_percent
      - platform_fee_percent
      - effective_at
      properties:
        cashback_rate_percent:
          $ref: '#/components/schemas/PercentString'
        platform_fee_percent:
          $ref: '#/components/schemas/PercentString'
        effective_at:
          type: string
          format: date-time
          description: Always 00:00 UTC+5 on a following day.
    ActivePromotion:
      type: object
      description: 'A live promotion boosting the merchant''s rate right now. Advisory,

        exactly like the standing rate: the till applies `branch_id` and

        `min_purchase_laari` for DISPLAY, and the server re-resolves

        authoritatively at `occurred_at`.

        '
      required:
      - cashback_rate_percent
      - platform_fee_percent
      - branch_id
      - min_purchase_laari
      - ends_at
      properties:
        cashback_rate_percent:
          $ref: '#/components/schemas/PercentString'
        platform_fee_percent:
          $ref: '#/components/schemas/PercentString'
        branch_id:
          type:
          - integer
          - 'null'
          format: int64
          description: The branch the promotion is scoped to; null means every branch.
        min_purchase_laari:
          allOf:
          - $ref: '#/components/schemas/LaariAmount'
          description: Minimum eligible amount for the promotion to apply; `0` when there is none.
        ends_at:
          type: string
          format: date-time
    CustomerLookupResult:
      type: object
      required:
      - ref
      - valid
      - name
      - masked_name
      properties:
        ref:
          type: string
          pattern: ^\d{6}$
          description: The ref as looked up.
        valid:
          type: boolean
          description: Whether this customer can currently earn cashback.
        name:
          type: string
          description: 'The customer''s name. **Confirm against this** — the cashier is

            checking it against the person at the counter, and a partial

            name cannot do that: in the Maldives `Ahm*** Naz***` fits an

            enormous number of people, so a mis-keyed digit still credits a

            stranger.


            This is not a bulk read. A lookup needs the 6-digit code the

            customer has just chosen to show the cashier, answers one

            customer, and misses are budgeted per merchant per day and

            logged.

            '
        masked_name:
          type: string
          deprecated: true
          description: 'The same name with only the first three characters of each part

            visible (e.g. `Ais*** Moh***`). Retained so tills already built

            against it keep working; use `name` instead.

            '
    WebhookEvent:
      type: object
      description: 'Common envelope for every outbound webhook delivery.


        **Signature verification** — every delivery carries

        `X-Manfaa-Signature` (lowercase hex `HMAC-SHA256` of the raw body

        with your endpoint''s signing secret, issued once at endpoint

        registration), `X-Manfaa-Timestamp` (delivery-attempt time, unix

        seconds) and `X-Manfaa-Event` (the event name, for routing before

        parsing). Verify by computing the HMAC over the **raw body bytes**

        and comparing constant-time; then parse. Deduplicate by `id` —

        delivery is **at-least-once** and may be out of order. `created_at`

        is inside the signed body and is the event''s authoritative time.

        A worked signature example is in the vendor integration guide.


        **Retry policy** — a delivery counts as successful on any `2xx`

        within 10 seconds. Otherwise it is retried with exponential backoff

        at approximately 1 minute, 5 minutes, 30 minutes, 2 hours, 8 hours,

        and 24 hours after the first attempt (6 retries over roughly 35

        hours). After the final failure the event is parked and surfaced to

        platform operations; it is not silently dropped. Retried deliveries

        carry the identical body (and signature) with a fresh

        `X-Manfaa-Timestamp`.

        '
      required:
      - id
      - type
      - created_at
      - data
      properties:
        id:
          type: string
          description: Globally unique event id (`evt_` + ULID). Deduplicate on this.
          pattern: ^evt_[0-9A-HJKMNP-TV-Z]{26}$
        type:
          type: string
          enum:
          - merchant.rate_changed
          - merchant.suspended
          - merchant.reinstated
          - transaction.reversed
        created_at:
          type: string
          format: date-time
          description: When the event occurred (signed, authoritative).
        data:
          type: object
          description: Event-specific payload — see the per-event schemas.
    WebhookRateChangedData:
      type: object
      required:
      - merchant_id
      - cashback_rate_percent
      - platform_fee_percent
      - previous_cashback_rate_percent
      - previous_platform_fee_percent
      - effective_at
      properties:
        merchant_id:
          type: integer
          format: int64
        cashback_rate_percent:
          $ref: '#/components/schemas/PercentString'
        platform_fee_percent:
          $ref: '#/components/schemas/PercentString'
        previous_cashback_rate_percent:
          $ref: '#/components/schemas/PercentString'
        previous_platform_fee_percent:
          oneOf:
          - $ref: '#/components/schemas/PercentString'
          - type: 'null'
          description: 'The fee the outgoing rate was billed at. Null in the rare case

            where the outgoing rate was not priced by the fee schedule in

            force at `effective_at` (a legacy rate being rescued).

            '
        effective_at:
          type: string
          format: date-time
          description: When the new rate takes (or took) effect — 00:00 UTC+5 next day for decreases,
            immediate for increases.
    WebhookSuspendedData:
      type: object
      required:
      - merchant_id
      - reason
      - suspended_at
      properties:
        merchant_id:
          type: integer
          format: int64
        reason:
          type: string
          description: Why the merchant was suspended. `overdue_settlement` is the automatic day-16 suspension.
          enum:
          - overdue_settlement
          - manual
        suspended_at:
          type: string
          format: date-time
    WebhookReinstatedData:
      type: object
      required:
      - merchant_id
      - reinstated_at
      properties:
        merchant_id:
          type: integer
          format: int64
        reinstated_at:
          type: string
          format: date-time
    WebhookTransactionReversedData:
      type: object
      required:
      - transaction_id
      - merchant_id
      - invoice_no
      - reason
      - reversed_at
      properties:
        transaction_id:
          type: integer
          format: int64
        merchant_id:
          type: integer
          format: int64
        invoice_no:
          type: string
        reason:
          type: string
          description: The reversal reason code recorded on the transition event.
        reversed_at:
          type: string
          format: date-time
