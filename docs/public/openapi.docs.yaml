                  \ store's standing 2.00%:\n\n- cashback = ceil(118,000 × 200 ÷ 10,000) = **2,360\n \
                  \ laari** = MVR 23.60\n- 2.00% sits in the 2.00%–4.99% band, whose platform fee\n  is\
