name: manfaa_merchant
description: "The Manfaa merchant app — the till in the pocket."
publish_to: 'none'

version: 1.0.29+30

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^17.5.0
  dio: ^5.11.0
  flutter_secure_storage: ^11.0.0
  device_info_plus: ^13.2.0
  # Wizard estate (MR1): the same no-key OSM decision as the customer app,
  # versions matched to mobile/customer's pubspec.
  flutter_map: ^8.3.1
  latlong2: ^0.10.1
  geolocator: ^14.0.3
  image_picker: ^1.2.3
  intl: ^0.20.2
  flutter_localizations:
    sdk: flutter
  manfaa_core:
    path: ../packages/manfaa_core
  manfaa_ui:
    path: ../packages/manfaa_ui
  mobile_scanner: ^7.4.0
  connectivity_plus: ^7.3.1
  # Profile screen (MR5): the website row opens in the browser — same
  # version the customer app pins.
  url_launcher: ^6.3.2
  # Push (MR4): same versions the customer app pins. Live Firebase config as of
  # 2026-08-20 — mv.manfaa.merchant (Android) and mv.manfaa.manfaaMerchant
  # (iOS) are registered in console project manfaa-6e1b4.
  firebase_core: ^4.13.0
  firebase_messaging: ^16.5.0

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    # MR11 — the platform banks' real marks on the pay step's bank picker,
    # the same PNGs the customer app's payout screen ships.
    - assets/banks/

    # The platform's own marks, shipped so the app has a logo before it has
    # ever reached the network. The API's copies supersede these whenever a
    # superadmin replaces one (see BrandAssetCache).
    - assets/brand/

  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Variable.ttf
    - family: Faruma
      fonts:
        - asset: assets/fonts/Faruma.ttf
    - family: MVWaheed
      fonts:
        - asset: assets/fonts/MVWaheed.otf

# MR6 branding — the illustrative mark from the owner's Merchant App
# Logo.png ref (storefront under the circular arrow), on the app canvas.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "branding/icon-1024.png"
  # The Android adaptive icon shows the FOREGROUND ONLY. Cropping it to the
  # emblem -- as the customer app does -- made the two icons indistinguishable
  # on any modern phone, because both apps share that wallet mark (owner,
  # 2026-08-21): the "Merchant" bar and the wordmark only exist in the
  # full-bleed art that iOS and pre-Oreo Android draw.
  #
  # So this app's foreground is the WHOLE lockup, bar included, on white.
  # Tinting the background the bar's blue was tried first and rejected: the
  # emblem is navy and was drawn for a white field, so it went muddy.
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "branding/adaptive-foreground.png"
  remove_alpha_ios: true

flutter_native_splash:
  color: "#F6F6F9"
  image: branding/adaptive-foreground.png
  android_12:
    color: "#F6F6F9"
    image: branding/adaptive-foreground.png
