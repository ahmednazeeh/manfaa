name: manfaa_merchant
description: "The Manfaa merchant app — the till in the pocket."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^17.5.0
  dio: ^5.11.0
  flutter_secure_storage: ^11.0.0
  device_info_plus: ^13.2.0
  # Wizard estate (MR1): the same no-key OSM decision as the customer app,
  # versions matched to mobile/customer's pubspec.
  flutter_map: ^8.3.1
  latlong2: ^0.10.1
  geolocator: ^14.0.3
  image_picker: ^1.2.3
  intl: ^0.20.2
  flutter_localizations:
    sdk: flutter
  manfaa_core:
    path: ../packages/manfaa_core
  manfaa_ui:
    path: ../packages/manfaa_ui
  mobile_scanner: ^7.4.0
  connectivity_plus: ^7.3.1
  # Profile screen (MR5): the website row opens in the browser — same
  # version the customer app pins.
  url_launcher: ^6.3.2
  # Push (MR4): same versions the customer app pins. Runs against PLACEHOLDER
  # Firebase config until mv.manfaa.merchant is registered in the console —
  # see lib/firebase_options.dart for the swap procedure.
  firebase_core: ^4.13.0
  firebase_messaging: ^16.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Variable.ttf
    - family: Faruma
      fonts:
        - asset: assets/fonts/Faruma.ttf
    - family: MVWaheed
      fonts:
        - asset: assets/fonts/MVWaheed.otf
